<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>하늘에 닿고 싶어</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  * { -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #05061a;
    font-family: 'Jua', sans-serif;
    overscroll-behavior: none;
  }
  #outer {
    width: 100vw; height: 100dvh; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #05061a;
  }
  #gameContainer {
    position: relative;
    width: 100%; height: 100%;
    max-width: 480px;
    max-height: 900px;
    margin: 0 auto;
    overflow: hidden;
    box-shadow: 0 0 60px rgba(0,0,0,0.6);
    background: #000;
    display: flex;
    flex-direction: column;
  }
  /* ===== 최상단 광고 배너 슬롯 ===== */
  #adBanner {
    flex: 0 0 auto;
    height: clamp(52px, 8.5%, 92px);
    width: 100%;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    background:
      repeating-linear-gradient(45deg, #f3f5f9 0 12px, #eaeef4 12px 24px);
    border-bottom: 2px solid rgba(0,0,0,0.12);
  }
  #adBanner .ad-chip {
    position: absolute;
    top: 5px; left: 6px;
    background: rgba(0,0,0,0.32);
    color: #fff;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 5px;
    letter-spacing: 0.5px;
    pointer-events: none;
  }
  #adSlot { display: flex; align-items: center; justify-content: center; }
  #adSlot:empty { display: none; }
  /* 실제 광고가 삽입되면 플레이스홀더 로테이터는 자동으로 숨김 */
  #adBanner:has(#adSlot:not(:empty)) #adRotator { display: none; }
  #adBanner:has(#adSlot:not(:empty)) { background: #fff; }
  /* ===== AD 아이템을 먹을 때마다 다음 배너로 넘어가는 플레이스홀더 로테이터 ===== */
  #adRotator {
    position: relative;
    width: 100%; height: 100%;
  }
  .ad-slide {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; text-align: center; line-height: 1.2;
    opacity: 0; transform: translateY(10px) scale(0.94);
    transition: opacity 0.32s ease, transform 0.32s ease;
    pointer-events: none;
  }
  .ad-slide.active { opacity: 1; transform: translateY(0) scale(1); }
  .ad-slide .ad-title { font-size: clamp(12px, 3.4vw, 16px); font-weight: bold; }
  .ad-slide .ad-size { font-size: clamp(9px, 2.4vw, 11px); }
  #gameArea {
    position: relative;
    flex: 1 1 auto;
    width: 100%;
    min-height: 0;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
</style>
</head>
<body>
<div id="outer">
  <div id="gameContainer">
    <!-- ===================================================================
         광고 배너 영역 (Ad banner slot)
         실제 광고를 넣으려면 아래 <div id="adSlot"> 안에 광고 네트워크
         스크립트/태그를 붙여넣으세요. 예) Google AdSense:

         <div id="adSlot">
           <ins class="adsbygoogle"
                style="display:inline-block;width:320px;height:50px"
                data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
                data-ad-slot="XXXXXXXXXX"></ins>
           <script>(adsbygoogle = window.adsbygoogle || []).push({});<\/script>
         </div>

         adSlot에 내용이 채워지면 아래 플레이스홀더 로테이터(#adRotator)는
         자동으로 가려지고 광고가 그 자리에 표시됩니다.
    ==================================================================== -->
    <div id="adBanner">
      <span class="ad-chip">AD</span>
      <div id="adSlot"></div>
      <!-- AD 아이템을 먹을 때마다 advanceAdBanner()가 다음 슬라이드로 넘겨줍니다.
           ※ 실제 광고 네트워크(AdSense 등)를 #adSlot에 넣은 뒤에는 이 로테이터가
           자동으로 숨겨지며, advanceAdBanner()도 실제 광고를 새로고침하지 않습니다.
           (광고 네트워크 대부분은 사용자 행동에 맞춰 강제로 광고를 새로고침하는 것을
           약관으로 금지하므로, 이 로테이터는 플레이스홀더 전용입니다.) -->
      <div id="adRotator">
        <div class="ad-slide active">
          <div class="ad-title">광고 배너 영역</div>
          <div class="ad-size">여기에 광고가 표시됩니다 (권장 320×50)</div>
        </div>
        <div class="ad-slide">
          <div class="ad-title" style="color:#4285F4;">🎮 오늘의 추천 게임</div>
          <div class="ad-size">지금 다운로드하고 플레이해보세요</div>
        </div>
        <div class="ad-slide">
          <div class="ad-title" style="color:#EA7B2C;">🛒 깜짝 특가 세일</div>
          <div class="ad-size">지금 확인하면 할인 받아요</div>
        </div>
        <div class="ad-slide">
          <div class="ad-title" style="color:#9B5DE5;">🎬 신작 예고편 공개</div>
          <div class="ad-size">지금 바로 확인해보세요</div>
        </div>
      </div>
    </div>
    <div id="gameArea">
      <canvas id="gameCanvas"></canvas>
    </div>
  </div>
</div>
<script>
(function(){
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const container = document.getElementById('gameContainer');
  const gameArea = document.getElementById('gameArea');

  // ---------- ad banner rotator ----------
  // AD 아이템을 먹을 때마다 플레이스홀더 슬라이드를 다음 것으로 넘깁니다.
  // 실제 광고가 #adSlot에 삽입되면 CSS가 이 로테이터를 자동으로 숨기고,
  // 이 함수는 실제 광고에는 아무 영향도 주지 않습니다(광고 네트워크 정책 보호).
  let adSlideIndex = 0;
  function advanceAdBanner(){
    const slides = document.querySelectorAll('#adRotator .ad-slide');
    if(!slides.length) return;
    slides[adSlideIndex].classList.remove('active');
    adSlideIndex = (adSlideIndex+1) % slides.length;
    slides[adSlideIndex].classList.add('active');
  }

  // ---------- utility ----------
  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
  function lerp(a,b,t){ return a+(b-a)*t; }
  function randRange(a,b){ return a+Math.random()*(b-a); }
  function hexToRgb(hex){
    const n = parseInt(hex.slice(1),16);
    return [(n>>16)&255,(n>>8)&255,n&255];
  }
  function lerpColorHex(h1,h2,t){
    const a=hexToRgb(h1), b=hexToRgb(h2);
    const r=Math.round(lerp(a[0],b[0],t));
    const g=Math.round(lerp(a[1],b[1],t));
    const bl=Math.round(lerp(a[2],b[2],t));
    return `rgb(${r},${g},${bl})`;
  }

  // ---------- layout ----------
  let W=0,H=0,DPR=1;
  let charRadius=24, restY=0, jumpPeak=100, scrollSpeed=40;
  let pillarLeftX=0, pillarRightX=0; // live, from gapWidth
  let gapWidth=200, gapTarget=200, gapWidthMin=100, gapWidthMax=260;

  function currentLeftX(){ return pillarLeftX + charRadius*0.25; }
  function currentRightX(){ return pillarRightX - charRadius*0.25; }

  function resize(){
    const rect = gameArea.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio||1, 2.5);
    W = rect.width; H = rect.height;
    canvas.width = Math.round(W*DPR);
    canvas.height = Math.round(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);

    charRadius = W*0.055;
    restY = H*0.60;
    jumpPeak = H*0.16;
    scrollSpeed = H*0.12;
    // gap is wide enough that a single jump can't cross it - two jumps are needed
    gapWidthMin = W*0.58;
    gapWidthMax = W*0.82;
    if(!gapTarget || gapTarget < gapWidthMin || gapTarget > gapWidthMax) gapTarget = (gapWidthMin+gapWidthMax)/2;
    gapWidth = gapTarget;
    pillarLeftX = (W-gapWidth)/2;
    pillarRightX = pillarLeftX+gapWidth;
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', ()=>setTimeout(resize,50));

  // ---------- audio ----------
  let actx=null;
  function ensureAudio(){
    if(!actx){
      try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
    } else if(actx.state==='suspended'){ actx.resume(); }
    ensureVoice();
    loadVoiceClips();
  }
  function beep(freq,dur,type,vol,delay){
    if(!actx) return;
    delay = delay||0; vol = vol==null?0.14:vol; type = type||'sine';
    const t0=actx.currentTime+delay;
    const osc=actx.createOscillator(), gain=actx.createGain();
    osc.type=type; osc.frequency.setValueAtTime(freq,t0);
    gain.gain.setValueAtTime(0,t0);
    gain.gain.linearRampToValueAtTime(vol,t0+0.012);
    gain.gain.exponentialRampToValueAtTime(0.001,t0+dur);
    osc.connect(gain); gain.connect(actx.destination);
    osc.start(t0); osc.stop(t0+dur+0.03);
  }
  function sfxJump(){ beep(520,0.09,'triangle',0.12); beep(760,0.07,'triangle',0.09,0.045); }
  function sfxLand(){ beep(210,0.09,'sine',0.10); }
  function sfxHit(){ beep(150,0.20,'sawtooth',0.15); beep(90,0.22,'square',0.08,0.03); }
  function sfxGameOver(){ beep(420,0.16,'sine',0.12,0); beep(320,0.16,'sine',0.12,0.16); beep(220,0.28,'sine',0.12,0.32); }
  function sfxStart(){ beep(440,0.09,'triangle',0.1); beep(660,0.09,'triangle',0.1,0.08); beep(880,0.12,'triangle',0.1,0.16); }
  function sfxUnlock(){ beep(660,0.08,'square',0.08); beep(990,0.1,'square',0.08,0.09); }
  function sfxFall(){ beep(300,0.12,'sine',0.1); beep(160,0.22,'sine',0.09,0.06); }
  function noiseBurst(dur,vol,delay,filterFreq){
    if(!actx) return;
    delay = delay||0; vol = vol==null?0.2:vol; filterFreq = filterFreq||1200;
    const t0 = actx.currentTime+delay;
    const bufferSize = Math.max(1,Math.floor(actx.sampleRate*dur));
    const buffer = actx.createBuffer(1, bufferSize, actx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1) * (1-i/bufferSize); }
    const src = actx.createBufferSource();
    src.buffer = buffer;
    const filter = actx.createBiquadFilter();
    filter.type='lowpass'; filter.frequency.setValueAtTime(filterFreq,t0);
    const gain = actx.createGain();
    gain.gain.setValueAtTime(vol,t0);
    gain.gain.exponentialRampToValueAtTime(0.001,t0+dur);
    src.connect(filter); filter.connect(gain); gain.connect(actx.destination);
    src.start(t0); src.stop(t0+dur+0.02);
  }
  function sfxExplode(){ noiseBurst(0.32,0.3,0,900); beep(90,0.2,'square',0.16,0); beep(55,0.28,'sine',0.12,0.02); }
  function sfxHeal(){ beep(660,0.09,'triangle',0.11); beep(880,0.09,'triangle',0.11,0.08); beep(1100,0.14,'triangle',0.12,0.16); }
  function sfxEquip(){ beep(200,0.08,'square',0.13); beep(520,0.07,'triangle',0.1,0.05); beep(920,0.09,'triangle',0.09,0.1); }
  function sfxFireball(){
    noiseBurst(0.4,0.26,0,1800);
    beep(140,0.3,'sawtooth',0.16,0); beep(280,0.25,'sawtooth',0.14,0.05);
    beep(560,0.2,'square',0.12,0.12); beep(880,0.25,'triangle',0.14,0.2);
  }
  function sfxLightning(){ noiseBurst(0.18,0.22,0,3000); beep(1400,0.05,'square',0.1,0); beep(180,0.24,'sawtooth',0.15,0.02); }
  function sfxFriendGreet(){ beep(700,0.06,'square',0.13); beep(900,0.08,'square',0.13,0.05); beep(1200,0.1,'triangle',0.12,0.11); }
  function sfxMaxHpUp(){ beep(520,0.1,'triangle',0.12); beep(660,0.1,'triangle',0.12,0.09); beep(880,0.1,'triangle',0.13,0.18); beep(1100,0.16,'triangle',0.13,0.27); }
  function sfxAdSwoosh(){ beep(300,0.06,'sine',0.06); beep(450,0.06,'sine',0.06,0.05); }

  // ---------- voice dubbing (Web Speech API - no audio files needed) ----------
  let voiceReady = false, voicesList = [];
  function ensureVoice(){
    voiceReady = true;
    if(!('speechSynthesis' in window)) return;
    try{
      voicesList = window.speechSynthesis.getVoices();
      if(!voicesList.length){
        window.speechSynthesis.onvoiceschanged = function(){ voicesList = window.speechSynthesis.getVoices(); };
      }
    }catch(e){}
  }
  function pickEnglishVoice(){
    if(!voicesList || !voicesList.length) return null;
    return voicesList.find(v=>/en[-_]us/i.test(v.lang)) || voicesList.find(v=>/^en/i.test(v.lang)) || voicesList[0];
  }
  function speakLine(text, rate, pitch){
    if(!voiceReady || !('speechSynthesis' in window)) return;
    try{
      window.speechSynthesis.cancel(); // interrupt any line still playing so callouts stay snappy
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      const v = pickEnglishVoice();
      if(v) u.voice = v;
      u.rate = rate||1.05; u.pitch = pitch||1.1; u.volume = 1;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  // ---------- recorded voice clips (real dubbed audio drop-in) ----------
  // Empty for now -> everything falls back to the synthesized browser voice above.
  // To swap in real recordings later: add entries here like
  //   friend0: 'data:audio/mp3;base64,......'
  // (one base64 data-URL per line) and the matching id will play that audio
  // instead of the synthesized voice automatically - no other code changes needed.

  };
  const voiceClipBuffers = {};
  function loadVoiceClips(){
    if(!actx) return;
    for(const id in voiceClipsB64){
      if(voiceClipBuffers[id]) continue;
      fetch(voiceClipsB64[id]).then(r=>r.arrayBuffer())
        .then(buf=>actx.decodeAudioData(buf))
        .then(decoded=>{ voiceClipBuffers[id]=decoded; })
        .catch(()=>{});
    }
  }
  function playVoiceClip(id){
    if(!actx || !voiceClipBuffers[id]) return false;
    try{
      const src = actx.createBufferSource();
      src.buffer = voiceClipBuffers[id];
      const g = actx.createGain(); g.gain.value = 1;
      src.connect(g); g.connect(actx.destination);
      src.start();
      return true;
    }catch(e){ return false; }
  }
  // plays the real recorded clip if one has been provided for `id`, otherwise
  // falls back to the synthesized browser voice with the given text/rate/pitch
  function playVoiceLine(id, fallbackText, rate, pitch){
    if(playVoiceClip(id)) return;
    speakLine(fallbackText, rate, pitch);
  }

  // ---------- BGM: procedural chiptune loop (no external audio files) ----------
  let bgmOn = false, bgmGain = null, bgmNextNoteTime = 0, bgmStep = 0, bgmTimerId = null;
  const BGM_BPM = 132;
  const BGM_STEP_DUR = 60/BGM_BPM/2; // 8th notes
  const BGM_LOOKAHEAD = 0.15; // seconds of notes to schedule ahead of time
  const BGM_ROOT = 523.25; // C5
  // upbeat 16-step riff (semitone offsets from root; null = rest)
  const BGM_MELODY = [0,null,7,12, 11,null,7,9, 0,null,7,12, 16,14,12,9];
  const BGM_BASS   = [-12,null,-12,null, -5,null,-5,null, -12,null,-12,null, -7,null,-7,null];
  function bgmSemi(n){ return BGM_ROOT*Math.pow(2,n/12); }
  function ensureBgmGain(){
    if(!actx || bgmGain) return;
    bgmGain = actx.createGain();
    bgmGain.gain.value = 0.5;
    bgmGain.connect(actx.destination);
  }
  function bgmTone(time, freq, dur, type, vol){
    const osc = actx.createOscillator(), gain = actx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, time);
    gain.gain.setValueAtTime(0, time);
    gain.gain.linearRampToValueAtTime(vol, time+0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, time+dur);
    osc.connect(gain); gain.connect(bgmGain);
    osc.start(time); osc.stop(time+dur+0.02);
  }
  function bgmHit(time, dur, vol, filterFreq){
    const bufferSize = Math.max(1, Math.floor(actx.sampleRate*dur));
    const buffer = actx.createBuffer(1, bufferSize, actx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1)*(1-i/bufferSize); }
    const src = actx.createBufferSource(); src.buffer = buffer;
    const filter = actx.createBiquadFilter();
    filter.type='highpass'; filter.frequency.setValueAtTime(filterFreq,time);
    const gain = actx.createGain();
    gain.gain.setValueAtTime(vol, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time+dur);
    src.connect(filter); filter.connect(gain); gain.connect(bgmGain);
    src.start(time); src.stop(time+dur+0.02);
  }
  function bgmKick(time, vol){
    const osc = actx.createOscillator(), gain = actx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(150, time);
    osc.frequency.exponentialRampToValueAtTime(45, time+0.11);
    gain.gain.setValueAtTime(vol, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time+0.14);
    osc.connect(gain); gain.connect(bgmGain);
    osc.start(time); osc.stop(time+0.16);
  }
  function bgmScheduler(){
    if(!bgmOn || !actx) return;
    // if we fell way behind (e.g. tab was backgrounded), snap back instead of bursting
    if(bgmNextNoteTime < actx.currentTime-0.5) bgmNextNoteTime = actx.currentTime+0.05;
    while(bgmNextNoteTime < actx.currentTime+BGM_LOOKAHEAD){
      const i = bgmStep % 16;
      const mel = BGM_MELODY[i], bass = BGM_BASS[i];
      if(mel!=null) bgmTone(bgmNextNoteTime, bgmSemi(mel), BGM_STEP_DUR*0.82, 'square', 0.05);
      if(bass!=null) bgmTone(bgmNextNoteTime, bgmSemi(bass), BGM_STEP_DUR*0.9, 'triangle', 0.075);
      if(i%4===0) bgmKick(bgmNextNoteTime, 0.16);
      bgmHit(bgmNextNoteTime, 0.03, i%2===0?0.02:0.012, i%4===2?7000:9500);
      bgmNextNoteTime += BGM_STEP_DUR;
      bgmStep++;
    }
    bgmTimerId = setTimeout(bgmScheduler, 25);
  }
  function startBgm(){
    if(!actx || bgmOn) return;
    ensureBgmGain();
    bgmGain.gain.cancelScheduledValues(actx.currentTime);
    bgmGain.gain.setValueAtTime(0, actx.currentTime);
    bgmGain.gain.linearRampToValueAtTime(0.5, actx.currentTime+0.6);
    bgmOn = true; bgmStep = 0;
    bgmNextNoteTime = actx.currentTime+0.05;
    bgmScheduler();
  }
  function stopBgm(){
    bgmOn = false;
    if(bgmTimerId){ clearTimeout(bgmTimerId); bgmTimerId=null; }
    if(bgmGain && actx){
      bgmGain.gain.cancelScheduledValues(actx.currentTime);
      bgmGain.gain.setValueAtTime(bgmGain.gain.value, actx.currentTime);
      bgmGain.gain.linearRampToValueAtTime(0.0001, actx.currentTime+0.5);
    }
  }

  // ---------- game state ----------
  let state = 'start'; // start | playing | gameover
  let hp=3, hpMax=3;
  let height=0, sessionBest=0, landings=0;
  let climbPerLanding = 3;
  let charSide = 'left';
  // charState: resting (safe, on a pillar) | jump1 (first hop, airborne) |
  // freefall (missed the window, falling under gravity, can still be rescued) |
  // jump2 (second hop, committed to landing) | dead (fall animation before game-over)
  let charState = 'resting';
  let charX=0, charY=0, charScale=1, charRot=0;
  let segFromX=0, segFromY=0, segToX=0, segToY=0, segStart=0, segDuration=420, segPeak=100;
  let travelDir=1; // +1 moving right, -1 moving left (persists through freefall)
  let targetSideAfterJump='right';
  let freefallVy=0;
  let restDeadline=0;
  let deathAt=-999;
  let gameOverReason='hp'; // 'hp' | 'fall'
  let landTime=-999;
  let invincibleUntil=0;
  let blinkAt=0, blinking=false, blinkUntil=0;
  let obstacles=[], particles=[];
  let nextSpawnAt=0;
  let bgScrollOffset=0;
  let obstacleUnlocked = {helmet:false, ad:false, leaf:false, boulder:false, lightning:false, friend:false, hpup:false};
  let unlockToastText='', unlockToastUntil=0;
  let lastTime=0;
  let shakeUntil=0, shakeMag=0;
  let helmetLevel=0; // 0=none, 1=silver shield, 2=golden shield (one more -> fireball)

  // fireball ultimate (triggered at helmetLevel 3): grin-with-teeth wind-up, then ignite & fly
  const FIREBALL_GRIN_DURATION = 550;
  let fireballGrinStart=0;
  let fireballStart=0, fireballDuration=4200, fireballStartHeight=0;

  // friend encounter (high-five then fly off together)
  // 3 friend variants, each a different color granting a different height bonus
  const FRIEND_VARIANTS = [
    { name:'민트', body:'#8FE3F0', wing:'#6FCBE0', ascend:20, w:3.2, line:'Good my friend! Go, Go, Go!' },
    { name:'복숭아', body:'#FFD9C7', wing:'#FFB199', ascend:30, w:1.6, line:'Great my friend! Let\'s Go!' },
    { name:'골드', body:'#FFEEB0', wing:'#FFD166', ascend:50, w:0.6, line:'Fantastic!! Fly Away!' }
  ];
  function pickFriendVariant(){
    const total = FRIEND_VARIANTS.reduce((s,v)=>s+v.w,0);
    let r = Math.random()*total;
    for(let i=0;i<FRIEND_VARIANTS.length;i++){ if(r<FRIEND_VARIANTS[i].w) return i; r-=FRIEND_VARIANTS[i].w; }
    return 0;
  }
  let friendX=0, friendY=0, friendPhaseStart=0, friendAscendStartHeight=0, friendVariant=0;
  let hfFriendStartX=0, hfFriendStartY=0;

  // big "shout" text popup (호야!, 짝! etc.)
  let shoutText='', shoutColor='#FFD93D', shoutStart=0, shoutUntil=0;

  // full-screen flash overlay (power-up cue)
  let flashColor='#fff', flashStart=0, flashUntil=0;
  function triggerFlash(color, dur){
    flashColor = color; flashStart = performance.now(); flashUntil = flashStart+dur;
  }
  function triggerShout(text, color, dur){
    shoutText = text; shoutColor = color||'#FFD93D';
    shoutStart = performance.now(); shoutUntil = shoutStart+(dur||1000);
  }

  function diffFactor(){ return clamp(landings/50,0,1); }
  function spawnIntervalBase(){ return lerp(1650,620,diffFactor()); }
  function obstacleSpeedBase(){ return lerp(H*0.28,H*0.60,diffFactor()); }
  function restTimeLimit(){ return lerp(3.4,1.9,diffFactor()); } // seconds allowed idle on a pillar

  function scheduleNextSpawn(now){
    const base = spawnIntervalBase();
    nextSpawnAt = now + base*(0.55+Math.random()*0.85);
  }

  function resetGame(){
    hpMax = 3; hp = hpMax; height = 0; landings = 0;
    obstacles = []; particles = [];
    obstacleUnlocked = {helmet:false, ad:false, leaf:false, boulder:false, lightning:false, friend:false, hpup:false};
    helmetLevel = 0;
    charSide = 'left'; charState='resting';
    invincibleUntil = 0; landTime=-999; deathAt=-999; gameOverReason='hp';
    shoutUntil=0; flashUntil=0;
    gapTarget = (gapWidthMin+gapWidthMax)/2; gapWidth = gapTarget;
    pillarLeftX = (W-gapWidth)/2; pillarRightX = pillarLeftX+gapWidth;
    charX = currentLeftX(); charY = restY; charScale=1; charRot=0;
    blinkAt = performance.now()+randRange(1500,3500);
    restDeadline = performance.now() + restTimeLimit()*1000 + 1000; // extra grace at the very start
  }

  function startGame(){
    ensureAudio();
    resetGame();
    state = 'playing';
    sfxStart();
    nextSpawnAt = performance.now()+1600;
    startBgm();
  }

  function triggerGameOver(){
    state='gameover';
    sessionBest = Math.max(sessionBest, height);
    sfxGameOver();
    shakeUntil = performance.now()+300; shakeMag = 10;
    stopBgm();
  }

  function enterFreefall(fromX, fromY){
    charState = 'freefall';
    charX = fromX; charY = fromY;
    freefallVy = H*0.55;
  }

  function idleTimeoutFall(now){
    targetSideAfterJump = charSide==='left' ? 'right' : 'left';
    travelDir = charSide==='left' ? 1 : -1;
    enterFreefall(charX, restY);
    sfxFall();
  }

  function triggerFallDeath(now){
    charState = 'dead';
    gameOverReason = 'fall';
    deathAt = now;
    shakeUntil = now+300; shakeMag = 8;
    sfxFall();
  }

  // ---- fireball ultimate: 3rd stacked helmet -> grin baring white teeth -> "Fire Ball!!" -> invincible +100m auto-ascent ----
  function triggerFireballGrin(now){
    charState = 'fireball_grin';
    fireballGrinStart = now;
    shakeUntil = now+150; shakeMag = 4;
  }
  function triggerFireball(now){
    charState = 'fireball';
    helmetLevel = 0; // the 3 stacked charges are spent powering the ultimate
    fireballStart = now;
    fireballStartHeight = height;
    fireballDuration = 4200;
    triggerShout('Fire Ball!!', '#FFD93D', 1000);
    playVoiceLine('fireball', 'Fire Ball!!', 1.1, 0.85);
    triggerFlash('#FFD93D', 350);
    shakeUntil = now+500; shakeMag = 14;
    // satisfying screen-clear: everything currently falling bursts away
    // (clear in place, NOT reassign - this can run while update()'s obstacle
    // loop is mid-iteration via equipHelmet(), and reassigning `obstacles` to
    // a new array would leave that loop indexing into a stale/empty array)
    for(const o of obstacles){
      spawnParticles(o.x, o.y, '#FF9F45', 6, [60,200], 0.5);
    }
    obstacles.length = 0;
    sfxFireball();
  }

  // ---- friend encounter: touch the falling friend -> high-five -> fly up together (20/30/50m by variant) ----
  function encounterFriend(o){
    hfFriendStartX = o.x; hfFriendStartY = o.y;
    friendX = o.x; friendY = o.y;
    friendVariant = o.variant||0;
    friendPhaseStart = performance.now();
    charState = 'friend_highfive';
  }

  function beginJump1(now){
    const fromX = charSide==='left' ? currentLeftX() : currentRightX();
    const dirSign = charSide==='left' ? 1 : -1;
    const midRatio = randRange(0.44,0.58);
    const dist = gapWidth*midRatio;
    const toX = fromX + dirSign*dist;
    targetSideAfterJump = charSide==='left' ? 'right' : 'left';
    segFromX=fromX; segFromY=restY; segToX=toX; segToY=restY;
    segStart=now;
    segDuration = clamp(dist/(W*0.95)*1000, 260, 900);
    segPeak = jumpPeak;
    travelDir = dirSign;
    charState = 'jump1';
    sfxJump();
  }

  function beginJump2(now){
    const targetX = targetSideAfterJump==='left' ? currentLeftX() : currentRightX();
    const dist = Math.abs(targetX-charX);
    segFromX=charX; segFromY=charY; segToX=targetX; segToY=restY;
    segStart=now;
    segDuration = clamp(dist/(W*0.95)*1000, 220, 900);
    segPeak = jumpPeak*clamp(dist/(gapWidth*0.5), 0.5, 1.4);
    travelDir = targetX>charX ? 1 : -1;
    charState = 'jump2';
    sfxJump();
  }

  function tryJump(){
    ensureAudio();
    if(state==='start'){ startGame(); return; }
    if(state==='gameover'){ startGame(); return; }
    if(state!=='playing') return;
    const now = performance.now();
    if(charState==='resting'){
      beginJump1(now);
    } else if(charState==='jump1' || charState==='freefall'){
      beginJump2(now);
    }
    // jump2 or dead: input ignored, already committed
  }

  // ---------- obstacles ----------
  // damaging: drop, leaf, boulder, lightning (2 dmg). beneficial pickups: helmet
  // (stacking shield), ad (heal + advances ad banner), hpup (max HP +1), friend (mini event)
  function pickObstacleType(){
    const pool = [{t:'drop', w:5}];
    if(obstacleUnlocked.helmet) pool.push({t:'helmet', w:1.4});
    if(obstacleUnlocked.ad) pool.push({t:'ad', w:1.1});
    if(obstacleUnlocked.leaf) pool.push({t:'leaf', w:3});
    if(obstacleUnlocked.friend) pool.push({t:'friend', w:1.0});
    if(obstacleUnlocked.lightning) pool.push({t:'lightning', w:1.3});
    if(obstacleUnlocked.hpup) pool.push({t:'hpup', w:0.6});
    if(obstacleUnlocked.boulder) pool.push({t:'boulder', w:2});
    const total = pool.reduce((s,p)=>s+p.w,0);
    let r = Math.random()*total;
    for(const p of pool){ if(r<p.w) return p.t; r-=p.w; }
    return 'drop';
  }

  function obstacleRadius(type){
    if(type==='boulder') return W*0.075;
    if(type==='ad') return W*0.06;
    if(type==='helmet') return W*0.055;
    if(type==='leaf') return W*0.05;
    if(type==='lightning') return W*0.05;
    if(type==='friend') return W*0.058;
    if(type==='hpup') return W*0.058;
    return W*0.045;
  }

  function spawnObstacle(){
    const type = pickObstacleType();
    const r = obstacleRadius(type);
    const margin = r+10;
    const usableW = Math.max(10, gapWidth-margin*2);
    const x = pillarLeftX+margin+Math.random()*usableW;
    const speedMul = type==='boulder' ? 0.72
      : type==='lightning' ? 1.25
      : type==='friend' ? 0.78
      : (type==='helmet'||type==='ad'||type==='hpup') ? 0.8
      : 1;
    const vy = obstacleSpeedBase()*(0.85+Math.random()*0.35)*speedMul;
    obstacles.push({
      type, x, baseX:x, y:-r-10, r, vy, age:0,
      amp: r*1.7, freq: 2+Math.random()*1.6, phase: Math.random()*Math.PI*2,
      rot:0, spin:(Math.random()<0.5?-1:1)*randRange(0.5,1.4),
      variant: type==='friend' ? pickFriendVariant() : 0,
      zone: currentZoneIdx() // freeze the seasonal skin at spawn time so it doesn't reskin mid-fall
    });
  }

  function spawnParticles(x,y,color,count,speedRange,life){
    for(let i=0;i<count;i++){
      const ang = Math.random()*Math.PI*2;
      const sp = randRange(speedRange[0],speedRange[1]);
      particles.push({
        x,y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp-sp*0.3,
        life:life, maxLife:life, color, r: randRange(2,5)
      });
    }
  }

  function hitObstacle(o, dmg){
    dmg = dmg||1;
    hp = Math.max(0,hp-dmg);
    invincibleUntil = performance.now()+950;
    spawnParticles(o.x,o.y,'#FFD93D',10,[60,180],0.5);
    if(o.type==='lightning') sfxLightning(); else sfxHit();
    shakeUntil = performance.now()+180; shakeMag = dmg>=2 ? 10 : 6;
    if(hp<=0) triggerGameOver();
  }

  function equipHelmet(o){
    helmetLevel++;
    spawnParticles(o.x,o.y,'#CBD3DA',10,[50,150],0.45);
    spawnParticles(charX, charY-charRadius, '#E8EEF2', 7, [30,100], 0.4);
    sfxEquip();
    if(helmetLevel >= 3){
      triggerFireballGrin(performance.now());
    }
  }

  function healFromAd(o){
    hp = Math.min(hpMax, hp+1);
    spawnParticles(o.x,o.y,'#FF5C7A',10,[50,150],0.5);
    sfxHeal();
    advanceAdBanner();
    sfxAdSwoosh();
  }

  function gainMaxHp(o){
    hpMax = Math.min(5, hpMax+1);
    hp = Math.min(hpMax, hp+1);
    spawnParticles(o.x,o.y,'#FF8FA8',12,[60,180],0.55);
    sfxMaxHpUp();
    unlockToastText = '💗 최대 HP +1!'; unlockToastUntil = performance.now()+1600;
  }

  function destroyWithHelmet(o){
    helmetLevel = Math.max(0, helmetLevel-1);
    spawnParticles(o.x,o.y,'#FFB199',14,[80,220],0.55);
    spawnParticles(o.x,o.y,'#FFD93D',8,[60,180],0.45);
    sfxExplode();
    shakeUntil = performance.now()+150; shakeMag = 5;
  }

  function landCharacter(){
    landings++;
    height += climbPerLanding;
    sessionBest = Math.max(sessionBest, height);
    landTime = performance.now();
    spawnParticles(charX, restY+charRadius*0.6, '#C9A876', 6, [30,90], 0.4);
    sfxLand();
    if(landings % 10 === 0){
      gapTarget = randRange(gapWidthMin, gapWidthMax);
    }
    if(landings === 3 && !obstacleUnlocked.helmet){
      obstacleUnlocked.helmet = true;
      unlockToastText = '🛡️ 강철투구 등장!'; unlockToastUntil = performance.now()+2400;
      sfxUnlock();
    }
    if(landings === 5 && !obstacleUnlocked.ad){
      obstacleUnlocked.ad = true;
      unlockToastText = '📢 광고 캡슐 등장! HP+1'; unlockToastUntil = performance.now()+2400;
      sfxUnlock();
    }
    if(landings === 8 && !obstacleUnlocked.leaf){
      obstacleUnlocked.leaf = true;
      unlockToastText = '🍃 회오리 낙엽 등장!'; unlockToastUntil = performance.now()+2200;
      sfxUnlock();
    }
    if(landings === 10 && !obstacleUnlocked.friend){
      obstacleUnlocked.friend = true;
      unlockToastText = '🐧 친구 등장! 색깔마다 다른 보너스(+20/30/50m)!'; unlockToastUntil = performance.now()+2600;
      sfxUnlock();
    }
    if(landings === 12 && !obstacleUnlocked.lightning){
      obstacleUnlocked.lightning = true;
      unlockToastText = '⚡ 번개 등장! HP-2 주의'; unlockToastUntil = performance.now()+2400;
      sfxUnlock();
    }
    if(landings === 15 && !obstacleUnlocked.hpup){
      obstacleUnlocked.hpup = true;
      unlockToastText = '💗 HP 강화 캡슐 등장!'; unlockToastUntil = performance.now()+2400;
      sfxUnlock();
    }
    if(landings === 18 && !obstacleUnlocked.boulder){
      obstacleUnlocked.boulder = true;
      unlockToastText = '🪨 큰 돌덩이 등장!'; unlockToastUntil = performance.now()+2200;
      sfxUnlock();
    }
  }

  // ---------- update ----------
  function update(dt, now){
    gapWidth += (gapTarget-gapWidth)*Math.min(1,dt*1.5);
    pillarLeftX = (W-gapWidth)/2;
    pillarRightX = pillarLeftX+gapWidth;
    bgScrollOffset += dt*scrollSpeed;

    // blink
    if(!blinking && now>blinkAt){ blinking=true; blinkUntil=now+120; }
    if(blinking && now>blinkUntil){ blinking=false; blinkAt = now+randRange(1800,4200); }

    if(state==='playing'){
      if(charState==='resting'){
        charX = charSide==='left' ? currentLeftX() : currentRightX();
        charY = restY + Math.sin(now/320)*2;
        charRot = 0; charScale = 1;
        const remain = (restDeadline-now)/1000, limit = restTimeLimit();
        if(remain < limit*0.2 && remain>0){
          const shake = 1-remain/(limit*0.2);
          charX += (Math.random()*2-1)*shake*3;
        }
        if(now > restDeadline){
          idleTimeoutFall(now);
        }
      } else if(charState==='jump1'){
        const t = Math.min(1,(now-segStart)/segDuration);
        charX = lerp(segFromX, segToX, t);
        charY = restY - Math.sin(t*Math.PI)*segPeak;
        charRot = Math.sin(t*Math.PI)*0.32*travelDir;
        charScale = 1 + Math.sin(t*Math.PI)*0.06;
        if(t>=1){
          enterFreefall(segToX, restY);
        }
      } else if(charState==='freefall'){
        freefallVy += H*2.4*dt;
        charY += freefallVy*dt;
        const targetX = targetSideAfterJump==='left' ? currentLeftX() : currentRightX();
        charX += (targetX-charX)*Math.min(1,dt*0.8);
        charRot += dt*5*travelDir;
        charScale = 1;
        if(charY > H + charRadius*2.2){
          triggerFallDeath(now);
        }
      } else if(charState==='jump2'){
        const t = Math.min(1,(now-segStart)/segDuration);
        charX = lerp(segFromX, segToX, t);
        charY = lerp(segFromY, segToY, t) - Math.sin(t*Math.PI)*segPeak;
        charRot = Math.sin(t*Math.PI)*0.32*travelDir;
        charScale = 1 + Math.sin(t*Math.PI)*0.06;
        if(t>=1){
          charSide = targetSideAfterJump;
          charX = charSide==='left' ? currentLeftX() : currentRightX();
          charY = restY; charRot = 0; charScale = 1;
          charState = 'resting';
          restDeadline = now + restTimeLimit()*1000;
          landCharacter();
        }
      } else if(charState==='dead'){
        freefallVy += H*2.4*dt;
        charY += freefallVy*dt;
        charRot += dt*5*travelDir;
        if(now-deathAt>500){
          triggerGameOver();
        }
      } else if(charState==='fireball_grin'){
        // wind-up: bare white teeth and grin before igniting
        const gt = Math.min(1,(now-fireballGrinStart)/FIREBALL_GRIN_DURATION);
        charScale = 1 + Math.sin(gt*Math.PI)*0.14;
        charY = restY + Math.sin(now/70)*2;
        if(gt>=1){
          triggerFireball(now);
        }
      } else if(charState==='fireball'){
        const t = Math.min(1,(now-fireballStart)/fireballDuration);
        const eased = 1-Math.pow(1-t,3);
        height = fireballStartHeight + 100*eased;
        sessionBest = Math.max(sessionBest, height);
        const centerX = (pillarLeftX+pillarRightX)/2;
        charX += (centerX-charX)*Math.min(1,dt*4);
        charY = restY + Math.sin(now/90)*3;
        charRot = Math.sin(now/60)*0.15;
        charScale = 1.08 + Math.sin(now/80)*0.05;
        if(Math.random()<0.6){
          spawnParticles(charX+randRange(-charRadius*0.4,charRadius*0.4), charY+charRadius*0.7,
            Math.random()<0.5?'#FF9F45':'#FFD93D', 1, [20,60], 0.35);
        }
        if(t>=1){
          charState = 'resting';
          charX = charSide==='left' ? currentLeftX() : currentRightX();
          charY = restY; charRot=0; charScale=1;
          restDeadline = now + restTimeLimit()*1000;
          landTime = now;
          spawnParticles(charX, restY+charRadius*0.6, '#C9A876', 8, [30,110], 0.45);
          sfxLand();
        }
      } else if(charState==='friend_highfive'){
        const dur = 420;
        const t = Math.min(1,(now-friendPhaseStart)/dur);
        friendX = lerp(hfFriendStartX, charX, t);
        friendY = lerp(hfFriendStartY, charY, t);
        charScale = 1 + Math.sin(t*Math.PI)*0.1;
        if(t>=1){
          spawnParticles(charX, charY, '#FFD93D', 12, [60,180], 0.5);
          const fv0 = FRIEND_VARIANTS[friendVariant];
          triggerShout('짝! +'+fv0.ascend+'m', fv0.wing, 700);
          playVoiceLine('friend'+friendVariant, fv0.line, 1.0, 1.05 + friendVariant*0.08);
          sfxFriendGreet();
          charState = 'friend_ascend';
          friendAscendStartHeight = height;
          friendPhaseStart = now;
        }
      } else if(charState==='friend_ascend'){
        const dur = 1200 + FRIEND_VARIANTS[friendVariant].ascend*17;
        const t = Math.min(1,(now-friendPhaseStart)/dur);
        const eased = 1-Math.pow(1-t,2);
        height = friendAscendStartHeight + FRIEND_VARIANTS[friendVariant].ascend*eased;
        sessionBest = Math.max(sessionBest, height);
        charY = restY + Math.sin(now/260)*4;
        charScale = 1;
        const dir = travelDir || 1;
        const exitStart = 0.65;
        if(t < exitStart){
          friendX = charX + charRadius*1.7*dir;
          friendY = charY + Math.sin(now/220+1)*4;
        } else {
          const et = (t-exitStart)/(1-exitStart);
          friendX = charX + charRadius*1.7*dir + et*charRadius*3;
          friendY = charY - et*charRadius*5;
        }
        if(Math.random()<0.35){
          spawnParticles(friendX, friendY+charRadius*0.5, '#BDEFFF', 1, [15,45], 0.4);
        }
        if(t>=1){
          charState = 'resting';
          charX = charSide==='left' ? currentLeftX() : currentRightX();
          charY = restY; charRot=0; charScale=1;
          restDeadline = now + restTimeLimit()*1000;
          landTime = now;
          spawnParticles(charX, restY+charRadius*0.6, '#C9A876', 6, [30,90], 0.4);
          sfxLand();
        }
      }

      if(now>=nextSpawnAt){ spawnObstacle(); scheduleNextSpawn(now); }

      const vulnerable = (charState==='jump1' || charState==='freefall' || charState==='jump2');
      for(let i=obstacles.length-1;i>=0;i--){
        const o=obstacles[i];
        o.age += dt;
        o.y += o.vy*dt;
        if(o.type==='leaf'){
          o.x = o.baseX + Math.sin(o.age*o.freq+o.phase)*o.amp;
          o.rot = Math.sin(o.age*o.freq+o.phase)*0.7;
        } else if(o.type==='boulder'){
          o.rot += dt*o.spin*0.3;
        } else if(o.type==='helmet'){
          o.rot += dt*o.spin*0.35;
        } else if(o.type==='ad'){
          o.rot = Math.sin(o.age*2.2+o.phase)*0.08;
        } else if(o.type==='lightning'){
          o.rot = Math.sin(o.age*40)*0.05;
        } else if(o.type==='friend'){
          o.rot = Math.sin(o.age*2+o.phase)*0.12;
        } else if(o.type==='hpup'){
          o.rot = Math.sin(o.age*1.6+o.phase)*0.06;
        } else {
          o.rot += dt*o.spin;
        }
        if(o.y - o.r > H){ obstacles.splice(i,1); continue; }

        // fireball ultimate: smash straight through anything in the gap
        if(charState==='fireball'){
          spawnParticles(o.x,o.y,'#FFB199',6,[50,150],0.4);
          obstacles.splice(i,1);
          continue;
        }
        // fireball wind-up (grinning before ignition): invincible, obstacles keep falling
        // until the burst-clear happens at actual ignition (triggerFireball)
        if(charState==='fireball_grin'){ continue; }

        if(vulnerable){
          const dist = Math.hypot(charX-o.x, charY-o.y);
          if(dist < charRadius*0.72 + o.r*0.72){
            if(o.type==='ad'){
              healFromAd(o);
              obstacles.splice(i,1);
              continue;
            } else if(o.type==='hpup'){
              gainMaxHp(o);
              obstacles.splice(i,1);
              continue;
            } else if(o.type==='helmet'){
              equipHelmet(o);
              // equipHelmet() may trigger the fireball wind-up (grin phase), which does
              // NOT touch the obstacles array - safe to keep iterating normally
              obstacles.splice(i,1);
              continue;
            } else if(o.type==='friend'){
              encounterFriend(o);
              obstacles.splice(i,1);
              continue;
            } else if(helmetLevel>=1){
              destroyWithHelmet(o);
              obstacles.splice(i,1);
              continue;
            } else if(now>=invincibleUntil){
              hitObstacle(o, o.type==='lightning'?2:1);
              obstacles.splice(i,1);
              continue;
            }
          }
        }
      }
    }

    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];
      p.life -= dt;
      if(p.life<=0){ particles.splice(i,1); continue; }
      p.x += p.vx*dt; p.y += p.vy*dt;
      p.vy += 220*dt;
    }
  }

  // ---------- drawing helpers ----------
  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }
  function heart(cx,cy,s){
    ctx.beginPath();
    ctx.moveTo(cx, cy+s*0.3);
    ctx.bezierCurveTo(cx-s, cy-s*0.6, cx-s*1.6, cy+s*0.35, cx, cy+s*1.15);
    ctx.bezierCurveTo(cx+s*1.6, cy+s*0.35, cx+s, cy-s*0.6, cx, cy+s*0.3);
    ctx.closePath();
  }

  // ---------- zones: every 500m the scenery/season changes ----------
  // spring 0-500m, summer 500-1000m, autumn 1000-1500m, winter 1500-2000m, space 2000m+ (final, forever)
  const ZONES = [
    { key:'spring', label:'봄',   skyTop:'#8FD8FF', skyBot:'#EAFBE6', pillarA:'#FFC3E0', pillarB:'#FF95C2', railTint:'#FFEAF4', cloudColor:'rgba(255,255,255,0.85)' },
    { key:'summer', label:'여름', skyTop:'#2FA8F0', skyBot:'#BFEFFF', pillarA:'#9BE8CF', pillarB:'#5FCBAE', railTint:'#EAFFFA', cloudColor:'rgba(255,255,255,0.85)' },
    { key:'autumn', label:'가을', skyTop:'#F2A65A', skyBot:'#FFDFAE', pillarA:'#E0894A', pillarB:'#B85F2C', railTint:'#FFE9CC', cloudColor:'rgba(255,244,224,0.85)' },
    { key:'winter', label:'겨울', skyTop:'#5C87BE', skyBot:'#EAF4FC', pillarA:'#E4F3FC', pillarB:'#AFCFEE', railTint:'#FFFFFF',  cloudColor:'rgba(255,255,255,0.92)' },
    { key:'space',  label:'우주', skyTop:'#05061E', skyBot:'#241B45', pillarA:'#7A69B8', pillarB:'#463A73', railTint:'#CFC6FF', cloudColor:'rgba(190,180,255,0.35)' }
  ];
  const ZONE_LEN = 500;
  const ZONE_TRANS = 70; // meters of crossfade blended into the next zone near each boundary
  function zoneInfo(h){
    h = Math.max(0,h);
    const idx = Math.min(ZONES.length-1, Math.floor(h/ZONE_LEN));
    const nextIdx = Math.min(ZONES.length-1, idx+1);
    const into = h - idx*ZONE_LEN;
    let t = 0;
    if(idx < ZONES.length-1){
      t = clamp((into-(ZONE_LEN-ZONE_TRANS))/ZONE_TRANS, 0, 1);
    }
    return { idx, nextIdx, t, zone:ZONES[idx], nextZone:ZONES[nextIdx] };
  }
  // "logical" zone used for picking obstacle skins / character outfit (hard cutover at the halfway blend point)
  function currentZoneIdx(h){
    const zi = zoneInfo(h==null?height:h);
    return zi.t>=0.5 ? zi.nextIdx : zi.idx;
  }

  let starField = null;
  function ensureStars(){
    if(starField) return starField;
    starField = [];
    for(let i=0;i<48;i++){
      starField.push({ xf: Math.random(), yf: Math.random(), r: randRange(0.6,2.0), ph: Math.random()*Math.PI*2, spd: randRange(0.5,1.3) });
    }
    return starField;
  }
  let cloudField = null;
  function ensureClouds(){
    if(cloudField) return cloudField;
    cloudField = [];
    for(let i=0;i<6;i++){
      cloudField.push({ xf: Math.random(), yf: Math.random(), s: randRange(0.5,1.1), spd: randRange(0.25,0.5) });
    }
    return cloudField;
  }

  function drawBackground(now){
    const zi = zoneInfo(height);
    const topCol = lerpColorHex(zi.zone.skyTop, zi.nextZone.skyTop, zi.t);
    const botCol = lerpColorHex(zi.zone.skyBot, zi.nextZone.skyBot, zi.t);
    const grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0, topCol); grad.addColorStop(1, botCol);
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    // stars only in (or fading into) the space zone
    const starAlpha = zi.idx>=4 ? 1 : (zi.idx===3 ? zi.t : 0);
    if(starAlpha>0.01){
      const stars = ensureStars();
      ctx.save();
      for(const s of stars){
        const y = ((s.yf*H) + bgScrollOffset*0.25*s.spd) % (H+20) - 10;
        const x = s.xf*W;
        const tw = 0.55+0.45*Math.sin(now/500*s.spd + s.ph);
        ctx.globalAlpha = starAlpha*tw;
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath(); ctx.arc(x,y,s.r,0,Math.PI*2); ctx.fill();
      }
      ctx.restore();
    }

    // clouds (nebulae once in space) fade out crossing into the space zone
    const cloudAlpha = zi.idx>=4 ? 0.5 : clamp(1-(zi.idx===3?zi.t:0), 0.08, 0.85);
    const cloudColor = lerpColorHexAlpha(zi.zone.cloudColor, zi.nextZone.cloudColor, zi.t);
    const clouds = ensureClouds();
    ctx.save();
    ctx.globalAlpha = cloudAlpha;
    for(const c of clouds){
      const y = ((c.yf*H) + bgScrollOffset*0.4*c.spd) % (H+120) - 60;
      const x = c.xf*W;
      drawCloud(x,y,c.s*W*0.16,cloudColor);
    }
    ctx.restore();
  }

  // lerp two rgba()/rgba(...)-style css color strings component-wise (used for cloud tint blending)
  function parseRgba(str){
    const m = str.match(/rgba?\(([^)]+)\)/);
    if(!m) return [255,255,255,0.85];
    const parts = m[1].split(',').map(s=>parseFloat(s));
    return [parts[0],parts[1],parts[2], parts.length>3?parts[3]:1];
  }
  function lerpColorHexAlpha(c1,c2,t){
    const a = parseRgba(c1), b = parseRgba(c2);
    const r = Math.round(lerp(a[0],b[0],t)), g = Math.round(lerp(a[1],b[1],t)), bl = Math.round(lerp(a[2],b[2],t));
    const al = lerp(a[3],b[3],t);
    return `rgba(${r},${g},${bl},${al.toFixed(3)})`;
  }

  function drawCloud(x,y,s,color){
    ctx.fillStyle = color || 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.ellipse(x,y,s,s*0.55,0,0,Math.PI*2);
    ctx.ellipse(x+s*0.6,y+s*0.1,s*0.65,s*0.4,0,0,Math.PI*2);
    ctx.ellipse(x-s*0.6,y+s*0.15,s*0.55,s*0.35,0,0,Math.PI*2);
    ctx.fill();
  }

  function drawPillars(now){
    const w = pillarLeftX;
    drawPillar(0, w, true);
    drawPillar(W-w, w, false);
  }
  function drawPillar(x0, w, isLeft){
    const zi = zoneInfo(height);
    const colA = lerpColorHex(zi.zone.pillarA, zi.nextZone.pillarA, zi.t);
    const colB = lerpColorHex(zi.zone.pillarB, zi.nextZone.pillarB, zi.t);
    const grad = ctx.createLinearGradient(x0,0,x0+w,0);
    grad.addColorStop(0, isLeft? colA : colB);
    grad.addColorStop(1, isLeft? colB : colA);
    ctx.fillStyle = grad;
    ctx.fillRect(x0,0,w,H);

    // scrolling stripe blocks
    const blockH = 76;
    const off = bgScrollOffset % blockH;
    ctx.save();
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = '#000';
    for(let y=-blockH+off; y<H+blockH; y+=blockH){
      roundRect(x0+w*0.12, y+8, w*0.76, blockH*0.45, 10);
      ctx.fill();
    }
    ctx.restore();

    // inner glowing rail
    const railTint = lerpColorHex(zi.zone.railTint, zi.nextZone.railTint, zi.t);
    const railX = isLeft ? x0+w : x0;
    const railGrad = ctx.createLinearGradient(railX-6,0,railX+6,0);
    railGrad.addColorStop(0,'rgba(255,255,255,0)');
    railGrad.addColorStop(0.5, railTint.replace('rgb(','rgba(').replace(')',',0.6)'));
    railGrad.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle = railGrad;
    ctx.fillRect(railX-6,0,12,H);
  }

  function drawCharacter(x,y,scale,rot,now){
    const isFlashing = now < invincibleUntil && Math.floor(now/90)%2===0;
    const sinceLand = now-landTime;
    let squash = 1, squashY = 1;
    if(sinceLand>=0 && sinceLand<260){
      const p = sinceLand/260;
      const wob = Math.sin(p*Math.PI)*(1-p);
      squash = 1+wob*0.18; squashY = 1-wob*0.18;
    }
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(rot);
    ctx.scale(scale*squash, scale*squashY);

    const r = charRadius;
    // shadow
    ctx.save();
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(0, r*1.15, r*0.9, r*0.28, 0,0,Math.PI*2); ctx.fill();
    ctx.restore();

    // fireball ultimate: flame aura behind the body
    if(charState==='fireball'){
      const flicker = 1+Math.sin(now/40)*0.08;
      ctx.save();
      ctx.scale(flicker,flicker);
      const fg = ctx.createRadialGradient(0,0,r*0.3,0,0,r*1.6);
      fg.addColorStop(0,'rgba(255,217,61,0.9)');
      fg.addColorStop(0.5,'rgba(255,140,45,0.55)');
      fg.addColorStop(1,'rgba(255,90,45,0)');
      ctx.fillStyle = fg;
      ctx.beginPath(); ctx.arc(0,0,r*1.6,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }

    // feet (only when resting on a pillar)
    if(charState==='resting'){
      ctx.fillStyle = '#F2994A';
      ctx.beginPath(); ctx.ellipse(-r*0.35, r*0.92, r*0.22, r*0.13, 0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(r*0.35, r*0.92, r*0.22, r*0.13, 0,0,Math.PI*2); ctx.fill();
    }

    // wing
    ctx.fillStyle = '#F2A93B';
    ctx.beginPath();
    ctx.ellipse(-r*0.75, r*0.05, r*0.45, r*0.62, -0.5, 0, Math.PI*2);
    ctx.fill();

    // body
    ctx.fillStyle = isFlashing ? '#FFFFFF' : '#FFC947';
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();

    // blush
    ctx.fillStyle = 'rgba(255,120,120,0.55)';
    ctx.beginPath(); ctx.ellipse(-r*0.5, r*0.18, r*0.16, r*0.1, 0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(r*0.5, r*0.18, r*0.16, r*0.1, 0,0,Math.PI*2); ctx.fill();

    // eyes
    const eyeY = -r*0.08;
    const eyeDX = r*0.36;
    if(charState==='fireball_grin'){
      // confident squint during the fireball wind-up grin
      ctx.strokeStyle = '#3A2A1A'; ctx.lineWidth = r*0.09; ctx.lineCap='round';
      ctx.beginPath(); ctx.arc(-eyeDX, eyeY+r*0.03, r*0.16, Math.PI*1.08, Math.PI*1.92); ctx.stroke();
      ctx.beginPath(); ctx.arc(eyeDX, eyeY+r*0.03, r*0.16, Math.PI*1.08, Math.PI*1.92); ctx.stroke();
    } else if(blinking){
      ctx.strokeStyle = '#3A2A1A'; ctx.lineWidth = r*0.08; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(-eyeDX-r*0.14,eyeY); ctx.lineTo(-eyeDX+r*0.14,eyeY); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(eyeDX-r*0.14,eyeY); ctx.lineTo(eyeDX+r*0.14,eyeY); ctx.stroke();
    } else {
      const dir = charState!=='resting' ? travelDir : 0;
      ctx.fillStyle = '#3A2A1A';
      ctx.beginPath(); ctx.ellipse(-eyeDX+dir*r*0.04, eyeY, r*0.17, r*0.20,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(eyeDX+dir*r*0.04, eyeY, r*0.17, r*0.20,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(-eyeDX+dir*r*0.04+r*0.05, eyeY-r*0.06, r*0.05,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(eyeDX+dir*r*0.04+r*0.05, eyeY-r*0.06, r*0.05,0,Math.PI*2); ctx.fill();
    }

    // beak (or, during the fireball wind-up, an open beak baring a grin of white teeth)
    if(charState==='fireball_grin'){
      const gt = clamp((now-fireballGrinStart)/FIREBALL_GRIN_DURATION, 0, 1);
      const openAmt = Math.sin(Math.min(1, gt/0.35)*Math.PI/2); // snaps open quickly, holds
      const teethH = r*0.05 + openAmt*r*0.10;
      // upper mandible
      ctx.fillStyle = '#F2994A';
      ctx.beginPath();
      ctx.moveTo(-r*0.34, r*0.20);
      ctx.lineTo(r*0.34, r*0.20);
      ctx.lineTo(0, r*0.17);
      ctx.closePath(); ctx.fill();
      // white teeth row
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath(); ctx.rect(-r*0.28, r*0.20, r*0.56, teethH); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = r*0.018;
      for(let ti=-2; ti<=2; ti++){
        ctx.beginPath();
        ctx.moveTo(ti*r*0.112, r*0.20);
        ctx.lineTo(ti*r*0.112, r*0.20+teethH);
        ctx.stroke();
      }
      // lower mandible, drops open
      ctx.fillStyle = '#F2994A';
      ctx.beginPath();
      ctx.moveTo(-r*0.30, r*0.20+teethH);
      ctx.lineTo(r*0.30, r*0.20+teethH);
      ctx.lineTo(0, r*0.20+teethH + r*0.16 + openAmt*r*0.14);
      ctx.closePath(); ctx.fill();
    } else {
      ctx.fillStyle = '#F2994A';
      ctx.beginPath();
      ctx.moveTo(-r*0.14, r*0.28);
      ctx.lineTo(r*0.14, r*0.28);
      ctx.lineTo(0, r*0.48);
      ctx.closePath(); ctx.fill();
    }

    // seasonal outfit accessory (matches the current background zone) - drawn clear of the
    // top-center head area so it never clashes with the steel-helmet power-up drawn after it
    drawZoneOutfit(r, currentZoneIdx(height));

    // steel helmet (shield power-up, worn on head - color upgrades as it stacks)
    if(helmetLevel>=1){
      drawHelmetOnHead(r, helmetLevel, now);
    }

    ctx.restore();
  }

  // ---------- seasonal character outfit (matches the current zone) ----------
  function drawZoneOutfit(r, zoneIdx){
    if(zoneIdx===0){ // spring: flower clip beside the head
      ctx.save(); ctx.translate(r*0.62, -r*0.78);
      ctx.fillStyle = '#FF6FA5';
      for(let i=0;i<5;i++){
        ctx.save(); ctx.rotate(i*(Math.PI*2/5));
        ctx.beginPath(); ctx.ellipse(0,-r*0.11,r*0.075,r*0.11,0,0,Math.PI*2); ctx.fill();
        ctx.restore();
      }
      ctx.fillStyle = '#FFE477';
      ctx.beginPath(); ctx.arc(0,0,r*0.06,0,Math.PI*2); ctx.fill();
      ctx.restore();
    } else if(zoneIdx===1){ // summer: sunglasses
      ctx.save();
      ctx.fillStyle = 'rgba(40,40,50,0.88)';
      ctx.beginPath(); ctx.ellipse(-r*0.36,-r*0.08,r*0.19,r*0.15,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(r*0.36,-r*0.08,r*0.19,r*0.15,0,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(40,40,50,0.88)'; ctx.lineWidth = r*0.05;
      ctx.beginPath(); ctx.moveTo(-r*0.17,-r*0.08); ctx.lineTo(r*0.17,-r*0.08); ctx.stroke();
      ctx.restore();
    } else if(zoneIdx===2){ // autumn: striped scarf
      ctx.save();
      ctx.fillStyle = '#D1492E';
      ctx.beginPath(); ctx.ellipse(0,r*0.34,r*0.62,r*0.16,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#F2A33D';
      for(let i=-2;i<=2;i++){ ctx.beginPath(); ctx.ellipse(i*r*0.2,r*0.34,r*0.07,r*0.13,0,0,Math.PI*2); ctx.fill(); }
      ctx.fillStyle = '#D1492E';
      ctx.beginPath(); ctx.moveTo(r*0.3,r*0.4); ctx.lineTo(r*0.5,r*0.85); ctx.lineTo(r*0.32,r*0.82); ctx.closePath(); ctx.fill();
      ctx.restore();
    } else if(zoneIdx===3){ // winter: scarf + earmuffs
      ctx.save();
      ctx.fillStyle = '#3F7FC4';
      ctx.beginPath(); ctx.ellipse(0,r*0.34,r*0.62,r*0.16,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#EAF6FF';
      for(let i=-2;i<=2;i++){ ctx.beginPath(); ctx.ellipse(i*r*0.2,r*0.34,r*0.07,r*0.13,0,0,Math.PI*2); ctx.fill(); }
      ctx.fillStyle = '#3F7FC4';
      ctx.beginPath(); ctx.moveTo(-r*0.3,r*0.4); ctx.lineTo(-r*0.5,r*0.85); ctx.lineTo(-r*0.32,r*0.82); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#EAF6FF';
      ctx.beginPath(); ctx.arc(-r*0.95,-r*0.35,r*0.16,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(r*0.95,-r*0.35,r*0.16,0,Math.PI*2); ctx.fill();
      ctx.restore();
    } else { // space: spacesuit collar + tiny antenna
      ctx.save();
      ctx.strokeStyle = 'rgba(220,230,255,0.9)'; ctx.lineWidth = r*0.12;
      ctx.beginPath(); ctx.ellipse(0,r*0.42,r*0.68,r*0.14,0,Math.PI*1.08,Math.PI*1.92); ctx.stroke();
      ctx.fillStyle = '#FFD166';
      ctx.beginPath(); ctx.arc(r*0.15,-r*1.05,r*0.06,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(220,230,255,0.9)'; ctx.lineWidth = r*0.035;
      ctx.beginPath(); ctx.moveTo(r*0.15,-r*0.95); ctx.lineTo(r*0.15,-r*1.05); ctx.stroke();
      ctx.restore();
    }
  }

  function drawHelmetOnHead(r, level, now){
    const lvl2 = level>=2;
    const grad = ctx.createLinearGradient(-r*0.9,-r*1.05,r*0.9,-r*0.2);
    if(lvl2){
      grad.addColorStop(0,'#FFF3C4');
      grad.addColorStop(0.5,'#FFC94D');
      grad.addColorStop(1,'#FF8A3D');
    } else {
      grad.addColorStop(0,'#EEF2F5');
      grad.addColorStop(0.5,'#B9C4CC');
      grad.addColorStop(1,'#8993A0');
    }
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(-r*0.95, -r*0.22);
    ctx.quadraticCurveTo(-r*0.95, -r*1.18, 0, -r*1.15);
    ctx.quadraticCurveTo(r*0.95, -r*1.18, r*0.95, -r*0.22);
    ctx.quadraticCurveTo(0, -r*0.36, -r*0.95, -r*0.22);
    ctx.closePath();
    ctx.fill();
    // brim
    ctx.fillStyle = lvl2 ? '#C9781E' : '#7B8794';
    roundRect(-r*1.02, -r*0.28, r*2.04, r*0.16, r*0.08);
    ctx.fill();
    // rivets
    ctx.fillStyle = lvl2 ? '#8A4A0F' : '#5B6572';
    ctx.beginPath(); ctx.arc(-r*0.6,-r*0.75,r*0.06,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(r*0.6,-r*0.75,r*0.06,0,Math.PI*2); ctx.fill();
    // shine
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath(); ctx.ellipse(-r*0.32,-r*0.82,r*0.22,r*0.13,-0.4,0,Math.PI*2); ctx.fill();
    // level-2 glow ring, hinting the next catch triggers the ultimate
    if(lvl2){
      ctx.save();
      ctx.globalAlpha = 0.5+Math.sin((now||0)/150)*0.15;
      ctx.strokeStyle = '#FFD93D';
      ctx.lineWidth = r*0.09;
      ctx.beginPath(); ctx.arc(0,-r*0.65,r*0.78,0,Math.PI*2); ctx.stroke();
      ctx.restore();
    }
  }

  function drawRestRing(now){
    if(state!=='playing' || charState!=='resting') return;
    const remain = clamp((restDeadline-now)/1000, 0, 999);
    const limit = restTimeLimit();
    const frac = clamp(remain/limit, 0, 1);
    if(frac > 0.55) return; // only warn once time is running low
    const r = charRadius*1.4;
    ctx.save();
    ctx.translate(charX, charY);
    ctx.rotate(-Math.PI/2);
    ctx.strokeStyle = frac>0.28 ? 'rgba(255,214,10,0.85)' : 'rgba(255,70,70,0.9)';
    ctx.lineWidth = charRadius*0.13;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(0,0,r,0, Math.PI*2*frac);
    ctx.stroke();
    ctx.restore();
  }

  // the friend character (falls as a pickup, then rides along during the encounter) - colors depend on variant
  function drawFriendCharacter(x,y,variant){
    const fv = FRIEND_VARIANTS[variant||0];
    ctx.save();
    ctx.translate(x,y);
    const r = charRadius*0.92;
    ctx.save();
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(0, r*1.15, r*0.9, r*0.28, 0,0,Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.fillStyle = fv.wing;
    ctx.beginPath(); ctx.ellipse(r*0.75, r*0.05, r*0.45, r*0.62, 0.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = fv.body;
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,150,150,0.5)';
    ctx.beginPath(); ctx.ellipse(-r*0.5, r*0.18, r*0.16, r*0.1, 0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(r*0.5, r*0.18, r*0.16, r*0.1, 0,0,Math.PI*2); ctx.fill();
    // happy closed ^_^ eyes
    ctx.strokeStyle = '#294048'; ctx.lineWidth = r*0.09; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(-r*0.36, -r*0.02, r*0.16, Math.PI*1.15, Math.PI*1.85); ctx.stroke();
    ctx.beginPath(); ctx.arc(r*0.36, -r*0.02, r*0.16, Math.PI*1.15, Math.PI*1.85); ctx.stroke();
    ctx.fillStyle = '#F2994A';
    ctx.beginPath();
    ctx.moveTo(-r*0.14, r*0.28); ctx.lineTo(r*0.14, r*0.28); ctx.lineTo(0, r*0.48);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // big "shout" text popup (호야!, 짝! etc.) - pops in with a bounce, fades out
  function drawShout(now){
    if(now > shoutUntil || !shoutText) return;
    const total = shoutUntil-shoutStart || 1;
    const t = clamp((now-shoutStart)/total, 0, 1);
    const pop = t<0.25 ? (t/0.25) : 1;
    const fade = t>0.7 ? 1-(t-0.7)/0.3 : 1;
    const scale = 0.5+pop*0.65 - (t>0.25 ? Math.min(0.15,(t-0.25)*0.3) : 0);
    ctx.save();
    ctx.translate(charX, charY - charRadius*1.9);
    ctx.scale(scale, scale);
    ctx.globalAlpha = fade;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `${Math.round(W*0.11)}px 'Jua', sans-serif`;
    ctx.lineWidth = W*0.02;
    ctx.strokeStyle = '#3A2A1A';
    ctx.strokeText(shoutText,0,0);
    ctx.fillStyle = shoutColor;
    ctx.fillText(shoutText,0,0);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function drawFlash(now){
    if(now > flashUntil) return;
    const total = flashUntil-flashStart || 1;
    const p = clamp(1-(now-flashStart)/total, 0, 1);
    ctx.save();
    ctx.globalAlpha = p*0.55;
    ctx.fillStyle = flashColor;
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }

  // ---------- seasonal obstacle skins: 'drop'/'leaf'/'boulder'/'lightning' reskin per zone ----------
  function drawObstacleDrop(r, zoneIdx){
    if(zoneIdx===0){ // spring: cherry blossom petal
      ctx.fillStyle = '#FF9FC7';
      for(let i=0;i<5;i++){
        ctx.save(); ctx.rotate(i*(Math.PI*2/5));
        ctx.beginPath(); ctx.ellipse(0,-r*0.62,r*0.38,r*0.58,0,0,Math.PI*2); ctx.fill();
        ctx.restore();
      }
      ctx.fillStyle = '#FFE477';
      ctx.beginPath(); ctx.arc(0,0,r*0.22,0,Math.PI*2); ctx.fill();
    } else if(zoneIdx===1){ // summer: classic water droplet
      ctx.fillStyle = '#4FC3F7';
      ctx.beginPath();
      ctx.moveTo(0,-r*1.3);
      ctx.quadraticCurveTo(r*1.05,r*0.35,0,r*1.05);
      ctx.quadraticCurveTo(-r*1.05,r*0.35,0,-r*1.3);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#1B6B93';
      ctx.beginPath(); ctx.arc(-r*0.22,r*0.15,r*0.1,0,Math.PI*2); ctx.arc(r*0.22,r*0.15,r*0.1,0,Math.PI*2); ctx.fill();
    } else if(zoneIdx===2){ // autumn: acorn
      ctx.fillStyle = '#C98A46';
      ctx.beginPath(); ctx.ellipse(0,r*0.22,r*0.72,r*0.82,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#7A4A1E';
      ctx.beginPath(); ctx.arc(0,-r*0.4,r*0.78,Math.PI*1.02,Math.PI*1.98); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#5C3714';
      ctx.fillRect(-r*0.08,-r*1.15,r*0.16,r*0.26);
    } else if(zoneIdx===3){ // winter: icicle
      ctx.fillStyle = '#CDEEFC';
      ctx.beginPath();
      ctx.moveTo(-r*0.55,-r*1.1); ctx.lineTo(r*0.55,-r*1.1); ctx.lineTo(0,r*1.35);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = r*0.1; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(-r*0.18,-r*0.85); ctx.lineTo(-r*0.05,r*0.55); ctx.stroke();
    } else { // space: meteor chunk with a faint trail
      ctx.fillStyle = 'rgba(176,140,224,0.32)';
      ctx.beginPath(); ctx.moveTo(0,-r*0.2); ctx.lineTo(-r*0.42,-r*1.7); ctx.lineTo(r*0.42,-r*1.7); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#9A8AC2';
      ctx.beginPath();
      const pts=7;
      for(let i=0;i<pts;i++){ const a=(i/pts)*Math.PI*2; const rr=r*(0.75+0.2*Math.sin(a*2.3)); const px=Math.cos(a)*rr, py=Math.sin(a)*rr; if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py); }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#5E4A8C';
      ctx.beginPath(); ctx.arc(-r*0.2,-r*0.1,r*0.15,0,Math.PI*2); ctx.arc(r*0.15,r*0.25,r*0.12,0,Math.PI*2); ctx.fill();
    }
  }

  function drawObstacleLeaf(r, zoneIdx){
    if(zoneIdx===0){ // spring: dandelion fluff
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      for(let i=0;i<10;i++){
        const a = i*(Math.PI*2/10);
        ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*r*1.1, Math.sin(a)*r*1.1); ctx.strokeStyle='rgba(255,255,255,0.85)'; ctx.lineWidth=r*0.06; ctx.stroke();
      }
      ctx.fillStyle = '#FFE9F4';
      ctx.beginPath(); ctx.arc(0,0,r*0.42,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#D9739E';
      ctx.beginPath(); ctx.arc(0,0,r*0.14,0,Math.PI*2); ctx.fill();
    } else if(zoneIdx===1){ // summer: broad green leaf
      ctx.fillStyle = '#4CAF50';
      ctx.beginPath();
      ctx.ellipse(0,0,r*1.15,r*0.62,0,0,Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = '#2E7D32'; ctx.lineWidth = r*0.12; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(-r*1.05,0); ctx.lineTo(r*1.05,0); ctx.stroke();
    } else if(zoneIdx===2){ // autumn: maple leaf
      ctx.fillStyle = '#E0632E';
      ctx.beginPath();
      for(let i=0;i<5;i++){
        const a = -Math.PI/2 + i*(Math.PI*2/5);
        const tipX = Math.cos(a)*r*1.15, tipY = Math.sin(a)*r*1.15;
        const baseA1 = a-0.35, baseA2 = a+0.35;
        const b1x = Math.cos(baseA1)*r*0.5, b1y = Math.sin(baseA1)*r*0.5;
        const b2x = Math.cos(baseA2)*r*0.5, b2y = Math.sin(baseA2)*r*0.5;
        if(i===0) ctx.moveTo(b1x,b1y);
        ctx.lineTo(tipX,tipY); ctx.lineTo(b2x,b2y);
      }
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#A8391A'; ctx.lineWidth = r*0.08; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,r*1.15); ctx.stroke();
    } else if(zoneIdx===3){ // winter: snowflake
      ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = r*0.14; ctx.lineCap='round';
      for(let i=0;i<3;i++){
        ctx.save(); ctx.rotate(i*(Math.PI/3));
        ctx.beginPath(); ctx.moveTo(-r*1.1,0); ctx.lineTo(r*1.1,0); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(r*0.65,0); ctx.lineTo(r*0.9,-r*0.3); ctx.moveTo(r*0.65,0); ctx.lineTo(r*0.9,r*0.3); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-r*0.65,0); ctx.lineTo(-r*0.9,-r*0.3); ctx.moveTo(-r*0.65,0); ctx.lineTo(-r*0.9,r*0.3); ctx.stroke();
        ctx.restore();
      }
    } else { // space: tumbling debris panel
      ctx.fillStyle = '#8FA3B8';
      ctx.beginPath();
      ctx.rect(-r*1.05,-r*0.5,r*2.1,r);
      ctx.fill();
      ctx.fillStyle = '#4E5D6C';
      ctx.fillRect(-r*0.85,-r*0.3,r*0.6,r*0.24);
      ctx.fillRect(r*0.15,-r*0.02,r*0.6,r*0.24);
      ctx.strokeStyle = '#CFE0EE'; ctx.lineWidth = r*0.06;
      ctx.strokeRect(-r*1.05,-r*0.5,r*2.1,r);
    }
  }

  function drawObstacleBoulder(r, zoneIdx, phase){
    if(zoneIdx===0){ // spring: flower pot
      ctx.fillStyle = '#D97B4A';
      ctx.beginPath();
      ctx.moveTo(-r*0.62,-r*0.1); ctx.lineTo(r*0.62,-r*0.1); ctx.lineTo(r*0.42,r*0.85); ctx.lineTo(-r*0.42,r*0.85);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#B85F2C';
      ctx.fillRect(-r*0.72,-r*0.28,r*1.44,r*0.2);
      ctx.fillStyle = '#5CA85A';
      ctx.beginPath(); ctx.ellipse(-r*0.2,-r*0.55,r*0.22,r*0.38,-0.3,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(r*0.22,-r*0.6,r*0.22,r*0.4,0.3,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#FF6FA5';
      ctx.beginPath(); ctx.arc(0,-r*0.85,r*0.18,0,Math.PI*2); ctx.fill();
    } else { // summer coconut / autumn pumpkin / winter snowball / space asteroid all share the craggy blob base
      const cfg = zoneIdx===1 ? {fill:'#8B5A2B', dark:'#4A2F16'}
        : zoneIdx===2 ? {fill:'#E8792A', dark:'#B85F2C'}
        : zoneIdx===3 ? {fill:'#F2FAFF', dark:'#C9E6F7'}
        : {fill:'#9E9E9E', dark:'#5C5C63'};
      ctx.fillStyle = cfg.fill;
      ctx.beginPath();
      const pts=8;
      for(let i=0;i<pts;i++){
        const a=(i/pts)*Math.PI*2;
        const rr=r*(0.85+0.15*Math.sin(a*3+(phase||0)));
        const px=Math.cos(a)*rr, py=Math.sin(a)*rr;
        if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath(); ctx.fill();
      if(zoneIdx===2){ // pumpkin ridges + stem
        ctx.strokeStyle = cfg.dark; ctx.lineWidth = r*0.06;
        for(let i=-2;i<=2;i++){ ctx.beginPath(); ctx.moveTo(i*r*0.22,-r*0.75); ctx.quadraticCurveTo(i*r*0.3,0,i*r*0.22,r*0.75); ctx.stroke(); }
        ctx.fillStyle = '#5C3714';
        ctx.fillRect(-r*0.09,-r*1.05,r*0.18,r*0.28);
      } else if(zoneIdx===3){ // snowball texture dots
        ctx.fillStyle = cfg.dark;
        ctx.beginPath(); ctx.arc(-r*0.25,-r*0.1,r*0.06,0,Math.PI*2); ctx.arc(r*0.15,r*0.2,r*0.05,0,Math.PI*2); ctx.arc(r*0.1,-r*0.3,r*0.05,0,Math.PI*2); ctx.fill();
      } else { // coconut face / asteroid craters
        ctx.fillStyle = cfg.dark;
        ctx.beginPath(); ctx.ellipse(-r*0.28,-r*0.05,r*0.11,r*0.14,0,0,Math.PI*2); ctx.ellipse(r*0.28,-r*0.05,r*0.11,r*0.14,0,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle=cfg.dark; ctx.lineWidth=r*0.09; ctx.lineCap='round';
        ctx.beginPath(); ctx.moveTo(-r*0.15,r*0.35); ctx.lineTo(r*0.15,r*0.35); ctx.stroke();
      }
    }
  }

  function drawObstacleLightning(r, zoneIdx){
    if(zoneIdx===0){ // spring: bee
      const glow = ctx.createRadialGradient(0,0,0,0,0,r*1.6);
      glow.addColorStop(0,'rgba(255,224,120,0.5)'); glow.addColorStop(1,'rgba(255,224,120,0)');
      ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(0,0,r*1.6,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(230,240,255,0.7)';
      ctx.beginPath(); ctx.ellipse(-r*0.15,-r*0.55,r*0.5,r*0.28,-0.3,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(r*0.15,-r*0.55,r*0.5,r*0.28,0.3,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#FFD93D';
      ctx.beginPath(); ctx.ellipse(0,0.1*r,r*0.75,r*0.55,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#2B2B2B';
      ctx.fillRect(-r*0.75,-r*0.18,r*1.5,r*0.16);
      ctx.fillRect(-r*0.6,r*0.12,r*1.2,r*0.16);
      ctx.beginPath(); ctx.arc(0,-r*0.4,r*0.22,0,Math.PI*2); ctx.fill();
    } else if(zoneIdx===2){ // autumn: whirlwind gust
      ctx.strokeStyle = '#C9C2B8'; ctx.lineWidth = r*0.16; ctx.lineCap='round';
      for(let i=0;i<3;i++){
        const rr = r*(0.4+i*0.4);
        ctx.beginPath(); ctx.arc(0,0,rr,Math.PI*0.15+i*0.5,Math.PI*1.5+i*0.5); ctx.stroke();
      }
      ctx.fillStyle = '#8A8378';
      ctx.beginPath(); ctx.arc(r*1.1,-r*0.2,r*0.14,0,Math.PI*2); ctx.fill();
    } else if(zoneIdx===4){ // space: laser beam
      const glow = ctx.createRadialGradient(0,0,0,0,0,r*1.6);
      glow.addColorStop(0,'rgba(92,242,255,0.45)'); glow.addColorStop(1,'rgba(92,242,255,0)');
      ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(0,0,r*1.6,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#5CF2FF';
      ctx.beginPath(); ctx.moveTo(-r*0.22,-r*1.4); ctx.lineTo(r*0.22,-r*1.4); ctx.lineTo(r*0.1,r*1.4); ctx.lineTo(-r*0.1,r*1.4);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#FF5CF0';
      ctx.beginPath(); ctx.arc(0,0,r*0.24,0,Math.PI*2); ctx.fill();
    } else { // summer thunderbolt / winter blizzard blast (same silhouette, different coloring)
      const col = zoneIdx===3 ? {glow:'rgba(223,244,255,0.55)', fill:'#DFF4FF', stroke:'#9FD8F2'}
        : {glow:'rgba(255,244,168,0.55)', fill:'#FFF4A8', stroke:'#FFAA00'};
      const glow = ctx.createRadialGradient(0,0,0,0,0,r*1.8);
      glow.addColorStop(0,col.glow); glow.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(0,0,r*1.8,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = col.fill;
      ctx.beginPath();
      ctx.moveTo(-r*0.15,-r*1.3);
      ctx.lineTo(r*0.55,-r*0.15);
      ctx.lineTo(r*0.05,-r*0.15);
      ctx.lineTo(r*0.65,r*1.3);
      ctx.lineTo(-r*0.35,r*0.05);
      ctx.lineTo(r*0.15,r*0.05);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = col.stroke; ctx.lineWidth = r*0.08;
      ctx.stroke();
    }
  }

  function drawObstacle(o){
    ctx.save();
    ctx.translate(o.x,o.y);
    ctx.rotate(o.rot||0);
    const oz = o.zone||0;
    if(o.type==='drop'){
      drawObstacleDrop(o.r, oz);
    } else if(o.type==='leaf'){
      drawObstacleLeaf(o.r, oz);
    } else if(o.type==='boulder'){
      drawObstacleBoulder(o.r, oz, o.phase);
    } else if(o.type==='lightning'){
      drawObstacleLightning(o.r, oz);
    } else if(o.type==='helmet'){
      const grad = ctx.createLinearGradient(-o.r,-o.r,o.r,o.r*0.3);
      grad.addColorStop(0,'#EDEFF2');
      grad.addColorStop(1,'#9AA5B1');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0,0,o.r,Math.PI,0);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#7B8794';
      roundRect(-o.r*1.08,-o.r*0.06,o.r*2.16,o.r*0.28,o.r*0.12);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.beginPath(); ctx.ellipse(-o.r*0.35,-o.r*0.35,o.r*0.28,o.r*0.16,-0.4,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#5B6572';
      ctx.beginPath(); ctx.arc(-o.r*0.65,-o.r*0.12,o.r*0.09,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(o.r*0.65,-o.r*0.12,o.r*0.09,0,Math.PI*2); ctx.fill();
    } else if(o.type==='ad'){
      const pulse = 1+Math.sin(o.age*6)*0.06;
      ctx.scale(pulse,pulse);
      const grad = ctx.createLinearGradient(-o.r,-o.r,o.r,o.r);
      grad.addColorStop(0,'#FFD93D');
      grad.addColorStop(1,'#FF9F45');
      ctx.fillStyle = grad;
      roundRect(-o.r*1.05,-o.r*0.78,o.r*2.1,o.r*1.56,o.r*0.32);
      ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = o.r*0.1;
      roundRect(-o.r*1.05,-o.r*0.78,o.r*2.1,o.r*1.56,o.r*0.32);
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${Math.round(o.r*0.95)}px sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('AD', 0, -o.r*0.06);
      ctx.fillStyle = '#FF5C7A';
      heart(o.r*0.6, -o.r*0.58, o.r*0.26);
      ctx.fill();
    } else if(o.type==='lightning'){
      const glow = ctx.createRadialGradient(0,0,0,0,0,o.r*1.8);
      glow.addColorStop(0,'rgba(255,244,168,0.55)');
      glow.addColorStop(1,'rgba(255,244,168,0)');
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(0,0,o.r*1.8,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#FFF4A8';
      ctx.beginPath();
      ctx.moveTo(-o.r*0.15,-o.r*1.3);
      ctx.lineTo(o.r*0.55,-o.r*0.15);
      ctx.lineTo(o.r*0.05,-o.r*0.15);
      ctx.lineTo(o.r*0.65,o.r*1.3);
      ctx.lineTo(-o.r*0.35,o.r*0.05);
      ctx.lineTo(o.r*0.15,o.r*0.05);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#FFAA00'; ctx.lineWidth = o.r*0.08;
      ctx.stroke();
    } else if(o.type==='friend'){
      const r = o.r*1.05;
      const fv = FRIEND_VARIANTS[o.variant||0];
      ctx.fillStyle = fv.wing;
      ctx.beginPath(); ctx.ellipse(r*0.7,r*0.05,r*0.42,r*0.58,0.5,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = fv.body;
      ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(255,150,150,0.5)';
      ctx.beginPath(); ctx.ellipse(-r*0.5,r*0.18,r*0.15,r*0.09,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(r*0.5,r*0.18,r*0.15,r*0.09,0,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#294048'; ctx.lineWidth = r*0.09; ctx.lineCap='round';
      ctx.beginPath(); ctx.arc(-r*0.36,-r*0.02,r*0.15,Math.PI*1.15,Math.PI*1.85); ctx.stroke();
      ctx.beginPath(); ctx.arc(r*0.36,-r*0.02,r*0.15,Math.PI*1.15,Math.PI*1.85); ctx.stroke();
      ctx.fillStyle = '#F2994A';
      ctx.beginPath(); ctx.moveTo(-r*0.13,r*0.26); ctx.lineTo(r*0.13,r*0.26); ctx.lineTo(0,r*0.44); ctx.closePath(); ctx.fill();
    } else if(o.type==='hpup'){
      const pulse = 1+Math.sin(o.age*5)*0.08;
      ctx.scale(pulse,pulse);
      ctx.strokeStyle = 'rgba(255,180,200,0.7)'; ctx.lineWidth = o.r*0.07; ctx.lineCap='round';
      for(let i=0;i<6;i++){
        const a = (i/6)*Math.PI*2 + o.age*1.5;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a)*o.r*1.1, Math.sin(a)*o.r*1.1);
        ctx.lineTo(Math.cos(a)*o.r*1.55, Math.sin(a)*o.r*1.55);
        ctx.stroke();
      }
      const grad = ctx.createRadialGradient(0,-o.r*0.15,0,0,-o.r*0.15,o.r*1.1);
      grad.addColorStop(0,'#FFE3EA');
      grad.addColorStop(1,'#FF5C7A');
      ctx.fillStyle = grad;
      heart(0,-o.r*0.15,o.r*0.95);
      ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = o.r*0.09;
      heart(0,-o.r*0.15,o.r*0.95);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawParticles(){
    for(const p of particles){
      const a = clamp(p.life/p.maxLife,0,1);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawHUD(now){
    // backing panels for legibility over any background
    const hs = W*0.045;
    const heartsPanelW = 18+hpMax*(hs*2.3)-2;
    ctx.save();
    ctx.fillStyle = 'rgba(10,20,30,0.28)';
    roundRect(10, 10, heartsPanelW, hs*2.1, hs*1.05);
    ctx.fill();
    ctx.restore();

    // hearts
    for(let i=0;i<hpMax;i++){
      const cx = 22+i*(hs*2.3), cy = 26;
      ctx.fillStyle = i<hp ? '#FF5C7A' : 'rgba(255,255,255,0.28)';
      ctx.strokeStyle = 'rgba(0,0,0,0.25)';
      ctx.lineWidth = hs*0.06;
      heart(cx-hs*0.75, cy-hs*0.35, hs*0.75);
      ctx.fill(); ctx.stroke();
    }

    // score
    ctx.textAlign = 'right';
    ctx.textBaseline = 'alphabetic';
    const scoreText = Math.floor(height)+'m';
    ctx.font = `${Math.round(W*0.065)}px 'Jua', sans-serif`;
    const scoreW = ctx.measureText(scoreText).width;
    ctx.save();
    ctx.fillStyle = 'rgba(10,20,30,0.28)';
    roundRect(W-30-scoreW, 12, scoreW+20, hs*2.3, hs*1.05);
    ctx.fill();
    ctx.restore();
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillText(scoreText, W-18+1, 38+1);
    ctx.fillStyle = '#FFFFFF';
    ctx.fillText(scoreText, W-18, 38);

    if(now < unlockToastUntil){
      ctx.textAlign='center';
      const alpha = clamp((unlockToastUntil-now)/2200,0,1);
      ctx.globalAlpha = Math.min(1, alpha*3);
      ctx.font = `${Math.round(W*0.05)}px 'Jua', sans-serif`;
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillText(unlockToastText, W/2+1, H*0.22+1);
      ctx.fillStyle = '#FFF3B0';
      ctx.fillText(unlockToastText, W/2, H*0.22);
      ctx.globalAlpha = 1;
    }
  }

  function drawOverlay(now){
    if(state==='start'){
      ctx.fillStyle = 'rgba(5,8,25,0.45)';
      ctx.fillRect(0,0,W,H);
      ctx.textAlign='center';
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.font = `${Math.round(W*0.11)}px 'Jua', sans-serif`;
      ctx.fillText('하늘에', W/2+2, H*0.33+2);
      ctx.fillText('닿고 싶어', W/2+2, H*0.33+Math.round(W*0.13)+2);
      ctx.fillStyle = '#FFFFFF';
      ctx.fillText('하늘에', W/2, H*0.33);
      ctx.fillText('닿고 싶어', W/2, H*0.33+Math.round(W*0.13));

      ctx.font = `${Math.round(W*0.038)}px 'Jua', sans-serif`;
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      const lh = Math.round(W*0.052);
      ctx.fillText('탭하면 점프, 공중에서 한번 더 탭하면', W/2, H*0.485);
      ctx.fillText('반대쪽까지 이어서 점프해요', W/2, H*0.485+lh);
      ctx.fillText('너무 오래 머무르면 떨어지니 조심!', W/2, H*0.485+lh*2);

      const bob = Math.sin(now/350)*6;
      ctx.font = `${Math.round(W*0.055)}px 'Jua', sans-serif`;
      ctx.fillStyle = '#FFD93D';
      ctx.fillText('탭 / 스페이스바로 시작', W/2, H*0.78+bob);

      drawCharacter(W/2, H*0.66, 1, 0, now);
    } else if(state==='gameover'){
      ctx.fillStyle = 'rgba(5,8,25,0.6)';
      ctx.fillRect(0,0,W,H);
      ctx.textAlign='center';
      ctx.fillStyle = '#FF5C7A';
      ctx.font = `${Math.round(W*0.09)}px 'Jua', sans-serif`;
      ctx.fillText(gameOverReason==='fall' ? '떨어지고 말았어요!' : '게임 오버', W/2, H*0.38);

      ctx.fillStyle = '#FFFFFF';
      ctx.font = `${Math.round(W*0.06)}px 'Jua', sans-serif`;
      ctx.fillText('높이: '+Math.floor(height)+'m', W/2, H*0.48);
      ctx.font = `${Math.round(W*0.045)}px 'Jua', sans-serif`;
      ctx.fillStyle = '#FFD93D';
      ctx.fillText('최고 기록(이번 플레이): '+Math.floor(sessionBest)+'m', W/2, H*0.55);

      const bob = Math.sin(now/350)*6;
      ctx.font = `${Math.round(W*0.052)}px 'Jua', sans-serif`;
      ctx.fillStyle = '#FFFFFF';
      ctx.fillText('탭 / 스페이스바로 다시 시작', W/2, H*0.66+bob);
    }
  }

  // ---------- main loop ----------
  function render(now){
    let ox=0, oy=0;
    if(now<shakeUntil){
      const p = (shakeUntil-now)/300;
      ox = (Math.random()*2-1)*shakeMag*p;
      oy = (Math.random()*2-1)*shakeMag*p;
    }
    ctx.save();
    ctx.translate(ox,oy);
    drawBackground(now);
    drawPillars(now);
    drawParticles();
    if(state!=='start'){
      drawRestRing(now);
      if(charState==='friend_highfive' || charState==='friend_ascend'){
        drawFriendCharacter(friendX, friendY, friendVariant);
      }
      drawCharacter(charX, charY, charScale, charRot, now);
      drawShout(now);
    }
    for(const o of obstacles) drawObstacle(o);
    if(state==='playing') drawHUD(now);
    ctx.restore();
    drawFlash(now);
    drawOverlay(now);
  }

  function loop(now){
    if(!lastTime) lastTime = now;
    let dt = (now-lastTime)/1000;
    lastTime = now;
    dt = Math.min(dt, 0.05);
    update(dt, now);
    render(now);
    requestAnimationFrame(loop);
  }

  // ---------- input ----------
  function onPointerDown(e){
    e.preventDefault();
    tryJump();
  }
  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('touchstart', function(e){ e.preventDefault(); }, {passive:false});
  window.addEventListener('keydown', function(e){
    if(e.code==='Space' || e.key===' '){
      e.preventDefault();
      tryJump();
    }
  });
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden) lastTime = 0;
  });

  // ---------- init ----------
  resize();
  resetGame();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
