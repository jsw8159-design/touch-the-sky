<style>
  * { -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #05061a;
    font-family: 'Jua', sans-serif;
    overscroll-behavior: none;
  }
  #outer {
    width: 100vw; height: 100dvh; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #05061a;
  }
  #gameContainer {
    position: relative;
    width: 100%; height: 100%;
    max-width: 480px;
    max-height: 900px;
    margin: 0 auto;
    overflow: hidden;
    box-shadow: 0 0 60px rgba(0,0,0,0.6);
    background: #000;
    display: flex;
    flex-direction: column;
  }
  /* ===== 최상단 광고 배너 슬롯 ===== */
  #adBanner {
    flex: 0 0 auto;
    height: clamp(52px, 8.5%, 92px);
    width: 100%;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    background:
      repeating-linear-gradient(45deg, #f3f5f9 0 12px, #eaeef4 12px 24px);
    border-bottom: 2px solid rgba(0,0,0,0.12);
  }
  #adBanner .ad-chip {
    position: absolute;
    top: 5px; left: 6px;
    background: rgba(0,0,0,0.32);
    color: #fff;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 5px;
    letter-spacing: 0.5px;
    pointer-events: none;
  }
  #adSlot { display: flex; align-items: center; justify-content: center; }
  #adSlot:empty { display: none; }
  /* 실제 광고가 삽입되면 플레이스홀더 로테이터는 자동으로 숨김 */
  #adBanner:has(#adSlot:not(:empty)) #adRotator { display: none; }
  #adBanner:has(#adSlot:not(:empty)) { background: #fff; }
  /* ===== AD 아이템을 먹을 때마다 다음 배너로 넘어가는 플레이스홀더 로테이터 ===== */
  #adRotator {
    position: relative;
    width: 100%; height: 100%;
  }
  .ad-slide {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; text-align: center; line-height: 1.2;
    opacity: 0; transform: translateY(10px) scale(0.94);
    transition: opacity 0.32s ease, transform 0.32s ease;
    pointer-events: none;
  }
  .ad-slide.active { opacity: 1; transform: translateY(0) scale(1); }
  .ad-slide .ad-title { font-size: clamp(12px, 3.4vw, 16px); font-weight: bold; }
  .ad-slide .ad-size { font-size: clamp(9px, 2.4vw, 11px); }
  #gameArea {
    position: relative;
    flex: 1 1 auto;
    width: 100%;
    min-height: 0;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  #uiOverlay {
    position: absolute; inset: 0;
    pointer-events: none;
    z-index: 5;
  }
  .uiBtn {
    position: absolute;
    pointer-events: auto;
    display: flex; align-items: center; justify-content: center;
    width: 42px; height: 42px;
    border-radius: 50%;
    border: none;
    background: rgba(10,20,30,0.42);
    color: #fff;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;

  #btnSkinNext { right: 6%; top: 63%; display: none; }

  #btnShare {

<script type="module">
  // ---------- global leaderboard backend (Firebase Firestore) ----------
  // exposes window.__ttsCloud for the main game script (a plain, non-module IIFE)
  // to call. Fails soft: if the CDN/network/Firestore is unreachable, every
  // method below resolves to a falsy/null result instead of throwing, so the
  // game degrades to local-only leaderboards rather than breaking.
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import {
    getFirestore, collection, doc, setDoc, getDocs, query, where, orderBy, limit, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAG7tHoduXzxc_VSNG0izbrIzCJJfnBeQk",
    authDomain: "touch-the-sky-790fa.firebaseapp.com",
    projectId: "touch-the-sky-790fa",
    storageBucket: "touch-the-sky-790fa.firebasestorage.app",
    messagingSenderId: "736779603701",
    appId: "1:736779603701:web:0052e0c6984a918b143fbc"
  };

  let db = null;
  try {
    db = getFirestore(initializeApp(firebaseConfig));
  } catch (e) { console.warn('[touch-the-sky] Firebase init failed', e); }

  window.__ttsCloud = {
    async submitScore(clientId, nickname, score) {
      if (!db) return false;
      try {
        await setDoc(doc(db, 'scores', clientId), {
          nickname: String(nickname || '익명').slice(0, 20),
          score: Math.max(0, Math.floor(score)),
          ts: serverTimestamp()
        });
        return true;
      } catch (e) { console.warn('[touch-the-sky] submitScore failed', e); return false; }
    },
    async fetchTop(n) {
      if (!db) return null;
      try {
        const q = query(collection(db, 'scores'), orderBy('score', 'desc'), limit(n || 10));
        const snap = await getDocs(q);
        const rows = [];
        snap.forEach(d => {
          const v = d.data() || {};
          rows.push({ nickname: v.nickname || '익명', score: v.score || 0 });
        });
        return rows;
      } catch (e) { console.warn('[touch-the-sky] fetchTop failed', e); return null; }
    },
    // records "a friend opened my challenge link and played" so the inviter can
    // be credited later. doc id = the friend's clientId, so each friend can only
    // ever trigger one referral credit (re-visiting the same link can't be farmed).
    async recordReferral(referrerClientId, referredClientId, referredNickname) {
      if (!db || !referrerClientId || !referredClientId || referrerClientId === referredClientId) return false;
      try {
        await setDoc(doc(db, 'referrals', referredClientId), {
          to: referrerClientId,
          fromNickname: String(referredNickname || '친구').slice(0, 20),
          ts: serverTimestamp()
        });
        return true;
      } catch (e) { console.warn('[touch-the-sky] recordReferral failed', e); return false; }
    },
    async fetchNewReferrals(myClientId) {
      if (!db || !myClientId) return null;
      try {
        const q = query(collection(db, 'referrals'), where('to', '==', myClientId));
        const snap = await getDocs(q);
        const rows = [];
        snap.forEach(d => { rows.push({ id: d.id, fromNickname: (d.data() || {}).fromNickname || '친구' }); });
        return rows;
      } catch (e) { console.warn('[touch-the-sky] fetchNewReferrals failed', e); return null; }
    }
  };
</script>

  const voiceClipBuffers = {};
  function loadVoiceClips(){
    if(!actx) return;
    for(const id in voiceClipsB64){
      if(voiceClipBuffers[id]) continue;
      fetch(voiceClipsB64[id]).then(r=>r.arrayBuffer())
        .then(buf=>actx.decodeAudioData(buf))
        .then(decoded=>{ voiceClipBuffers[id]=decoded; })
        .catch(()=>{});
    }
  }
  function playVoiceClip(id){
    if(muted || !actx || !voiceClipBuffers[id]) return false;
    try{
      const src = actx.createBufferSource();
      src.buffer = voiceClipBuffers[id];
      const g = actx.createGain(); g.gain.value = 1;
      src.connect(g); g.connect(actx.destination);
      src.start();
      return true;
    }catch(e){ return false; }
  }
  // plays the real recorded clip if one has been provided for `id`, otherwise
  // falls back to the synthesized browser voice with the given text/rate/pitch
  function playVoiceLine(id, fallbackText, rate, pitch){
    if(playVoiceClip(id)) return;
    speakLine(fallbackText, rate, pitch);
  }

  // ---------- BGM: procedural chiptune loop (no external audio files) ----------
  // three presets keyed to how far you've climbed - ground (spring/summer/autumn/winter),
  // orbit (leaving Earth), and deep space (moon onward) - see applyBgmPreset()/bgmTierForZone()
  let bgmOn = false, bgmGain = null, bgmNextNoteTime = 0, bgmStep = 0, bgmTimerId = null;
  const BGM_LOOKAHEAD = 0.15; // seconds of notes to schedule ahead of time
  const BGM_PRESETS = {
    ground: {
      root: 523.25, bpm: 132, // C5, upbeat
      melody: [0,null,7,12, 11,null,7,9, 0,null,7,12, 16,14,12,9],
      bass:   [-12,null,-12,null, -5,null,-5,null, -12,null,-12,null, -7,null,-7,null],
      leadType: 'square', bassType: 'triangle'
    },
    orbit: {
      root: 466.16, bpm: 118, // Bb4, floaty/transitional
      melody: [0,null,null,7, 10,null,7,null, 0,null,null,7, 12,null,10,7],
      bass:   [-12,null,null,null, -7,null,null,null, -12,null,null,null, -5,null,null,null],
      leadType: 'sine', bassType: 'sine'
    },
    deepspace: {
      root: 392.00, bpm: 100, // G4, slow and atmospheric
      melody: [0,null,null,null, 5,null,null,null, 7,null,null,null, 3,null,null,null],
      bass:   [-12,null,null,null,null,null,-12,null, -5,null,null,null,null,null,-5,null],
      leadType: 'sine', bassType: 'square'
    }
  };
  let BGM_ROOT = BGM_PRESETS.ground.root, BGM_BPM = BGM_PRESETS.ground.bpm;
  let BGM_STEP_DUR = 60/BGM_BPM/2; // 8th notes
  let BGM_MELODY = BGM_PRESETS.ground.melody, BGM_BASS = BGM_PRESETS.ground.bass;
  let bgmLeadType = BGM_PRESETS.ground.leadType, bgmBassType = BGM_PRESETS.ground.bassType;
  let currentBgmTier = 'ground';
  function bgmTierForZone(zoneIdx){
    if(zoneIdx<=3) return 'ground';
    if(zoneIdx===4) return 'orbit';
    return 'deepspace';
  }
  function applyBgmPreset(tier){
    const p = BGM_PRESETS[tier];
    BGM_ROOT = p.root; BGM_BPM = p.bpm; BGM_STEP_DUR = 60/BGM_BPM/2;
    BGM_MELODY = p.melody; BGM_BASS = p.bass;
    bgmLeadType = p.leadType; bgmBassType = p.bassType;
    currentBgmTier = tier;
  }
  function syncBgmToZone(){
    const tier = bgmTierForZone(currentZoneIdx(height));
    if(tier !== currentBgmTier) applyBgmPreset(tier);
  }
  function bgmSemi(n){ return BGM_ROOT*Math.pow(2,n/12); }
  function ensureBgmGain(){
    if(!actx || bgmGain) return;
    bgmGain = actx.createGain();
    bgmGain.gain.value = 0.5;
    bgmGain.connect(actx.destination);
  }
  function bgmTone(time, freq, dur, type, vol){
    const osc = actx.createOscillator(), gain = actx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, time);
    gain.gain.setValueAtTime(0, time);
    gain.gain.linearRampToValueAtTime(vol, time+0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, time+dur);
    osc.connect(gain); gain.connect(bgmGain);
    osc.start(time); osc.stop(time+dur+0.02);
  }
  function bgmHit(time, dur, vol, filterFreq){
    const bufferSize = Math.max(1, Math.floor(actx.sampleRate*dur));
    const buffer = actx.createBuffer(1, bufferSize, actx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1)*(1-i/bufferSize); }
    const src = actx.createBufferSource(); src.buffer = buffer;
    const filter = actx.createBiquadFilter();
    filter.type='highpass'; filter.frequency.setValueAtTime(filterFreq,time);
    const gain = actx.createGain();
    gain.gain.setValueAtTime(vol, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time+dur);
    src.connect(filter); filter.connect(gain); gain.connect(bgmGain);
    src.start(time); src.stop(time+dur+0.02);
  }
  function bgmKick(time, vol){
    const osc = actx.createOscillator(), gain = actx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(150, time);
    osc.frequency.exponentialRampToValueAtTime(45, time+0.11);
    gain.gain.setValueAtTime(vol, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time+0.14);
    osc.connect(gain); gain.connect(bgmGain);
    osc.start(time); osc.stop(time+0.16);
  }
  function bgmScheduler(){
    if(!bgmOn || !actx) return;
    // if we fell way behind (e.g. tab was backgrounded), snap back instead of bursting
    if(bgmNextNoteTime < actx.currentTime-0.5) bgmNextNoteTime = actx.currentTime+0.05;
    while(bgmNextNoteTime < actx.currentTime+BGM_LOOKAHEAD){
      const i = bgmStep % 16;
      const mel = BGM_MELODY[i], bass = BGM_BASS[i];
      if(mel!=null) bgmTone(bgmNextNoteTime, bgmSemi(mel), BGM_STEP_DUR*0.82, bgmLeadType, 0.05);
      if(bass!=null) bgmTone(bgmNextNoteTime, bgmSemi(bass), BGM_STEP_DUR*0.9, bgmBassType, 0.075);
      if(i%4===0 && currentBgmTier==='ground') bgmKick(bgmNextNoteTime, 0.16);
      bgmHit(bgmNextNoteTime, 0.03, i%2===0?0.02:0.012, i%4===2?7000:9500);
      bgmNextNoteTime += BGM_STEP_DUR;
      bgmStep++;
    }
    bgmTimerId = setTimeout(bgmScheduler, 25);
  }
  function startBgm(){
    if(!actx || bgmOn || muted) return;
    ensureBgmGain();
    bgmGain.gain.cancelScheduledValues(actx.currentTime);
    bgmGain.gain.setValueAtTime(0, actx.currentTime);
    bgmGain.gain.linearRampToValueAtTime(0.5, actx.currentTime+0.6);
    bgmOn = true; bgmStep = 0;
    bgmNextNoteTime = actx.currentTime+0.05;
    bgmScheduler();
  }
  function stopBgm(){
    bgmOn = false;
    if(bgmTimerId){ clearTimeout(bgmTimerId); bgmTimerId=null; }
    if(bgmGain && actx){
      bgmGain.gain.cancelScheduledValues(actx.currentTime);
      bgmGain.gain.setValueAtTime(bgmGain.gain.value, actx.currentTime);
      bgmGain.gain.linearRampToValueAtTime(0.0001, actx.currentTime+0.5);
    }
  }

  // ---------- game state ----------
  let state = 'start'; // start | playing | gameover
  let hp=3, hpMax=3;
  let height=0, landings=0;
  // best height ever reached, persisted across visits via localStorage
  let sessionBest = parseFloat(lsGet('bestHeight','0'))||0;
  let isNewRecord = false;
  let runStartBest = sessionBest; // snapshot at run start, since sessionBest updates mid-run
  let climbPerLanding = 3;
  // combo: consecutive successful landings without taking a hit. boosts height gained per landing.
  let combo=0, comboBest=0, comboMultiplier=1, comboPopAt=-999;
  function comboMultiplierFor(c){ return 1 + Math.min(c,10)*0.1; } // ramps to x2.0 at a 10-streak

  // ---------- sound mute ----------
  let muted = lsGet('muted','0')==='1';
  function applyMuteUi(){
    btnMute.textContent = muted ? '🔇' : '🔊';
  }
  function toggleMute(){
    muted = !muted;
    lsSet('muted', muted ? '1' : '0');
    applyMuteUi();
    if(muted){ stopBgm(); }
    else if(state==='playing' && !paused){ startBgm(); }
  }
  applyMuteUi();

  // ---------- local leaderboard (top 5, persisted) ----------
  const LEADERBOARD_SIZE = 5;
  let leaderboard = lsGetJSON('leaderboard', []);
  let showLeaderboard = false;
  function submitScore(h){
    const entry = { h: Math.floor(h), t: Date.now() };
    leaderboard.push(entry);
    leaderboard.sort((a,b)=>b.h-a.h);
    leaderboard = leaderboard.slice(0, LEADERBOARD_SIZE);
    lsSetJSON('leaderboard', leaderboard);
  }

  // ---------- personal lifetime stats (persisted, shown in the "내 통계" tab) ----------
  let lifeStats = lsGetJSON('lifeStats', { plays:0, distance:0, landings:0, bestCombo:0, falls:0, hpDeaths:0 });
  // fields added after initial release - backfill for players with an older saved lifeStats blob
  lifeStats.starsUsedTotal = lifeStats.starsUsedTotal||0;
  lifeStats.friendsMetTotal = lifeStats.friendsMetTotal||0;
  lifeStats.invitesConverted = lifeStats.invitesConverted||0;
  function saveLifeStats(){ lsSetJSON('lifeStats', lifeStats); }
  function recordPlayStart(){
    lifeStats.plays++;
    saveLifeStats();
    incDailyCounter('plays', 1);
  }
  function recordGameOverStats(){
    lifeStats.distance += Math.floor(height);
    lifeStats.landings += landings;
    if(comboBest > lifeStats.bestCombo) lifeStats.bestCombo = comboBest;
    if(gameOverReason==='fall') lifeStats.falls++; else lifeStats.hpDeaths++;
    saveLifeStats();
    incDailyCounter('landings', landings);
    checkAchievements();
  }

  // ---------- daily missions ----------
  function dateKeyFor(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function todayKey(){ return dateKeyFor(new Date()); }
  function simpleHash(str){ let h=0; for(let i=0;i<str.length;i++){ h=(h*31+str.charCodeAt(i))>>>0; } return h; }
  const MISSION_TEMPLATES = [
    { id:'height300', icon:'📏', desc:{ko:'한 판에서 300m 넘기',en:'Reach 300m in one run'}, target:300, key:'maxHeight' },
    { id:'combo8',     icon:'🔥', desc:{ko:'8콤보 달성하기',en:'Reach an 8x combo'},      target:8,   key:'maxCombo' },
    { id:'plays2',     icon:'🎮', desc:{ko:'2판 플레이하기',en:'Play 2 runs'},      target:2,   key:'plays' },
    { id:'land15',     icon:'🦶', desc:{ko:'15번 착지하기',en:'Land 15 times'},       target:15,  key:'landings' },
    { id:'star1',      icon:'⭐', desc:{ko:'무적 별 1번 먹기',en:'Grab 1 invincibility star'},    target:1,   key:'starsUsed' },
    { id:'friend1',    icon:'🐧', desc:{ko:'친구 1번 만나기',en:'Meet a friend once'},     target:1,   key:'friendsMet' }
  ];
  function missionDesc(m){ return m.desc[lang] || m.desc.ko; }
  function missionById(id){ return MISSION_TEMPLATES.find(function(m){ return m.id===id; }); }
  function pickDailyMissionIds(dateStr){
    let seed = simpleHash(dateStr);
    const idxs = [];
    while(idxs.length<3){
      seed = (seed*1103515245+12345)>>>0;
      const idx = seed % MISSION_TEMPLATES.length;
      if(idxs.indexOf(idx)<0) idxs.push(idx);

  let shoutText='', shoutColor='#FFD93D', shoutStart=0, shoutUntil=0;

  // full-screen flash overlay (power-up cue)
  let flashColor='#fff', flashStart=0, flashUntil=0;
  function triggerFlash(color, dur){
    flashColor = color; flashStart = performance.now(); flashUntil = flashStart+dur;
  }
  function triggerShout(text, color, dur){
    shoutText = text; shoutColor = color||'#FFD93D';
    shoutStart = performance.now(); shoutUntil = shoutStart+(dur||1000);
  }

  function diffFactor(){ return clamp(landings/50,0,1); }
  function spawnIntervalBase(){ return lerp(1650,620,diffFactor()); }
  function obstacleSpeedBase(){ return lerp(H*0.28,H*0.60,diffFactor()); }
  function restTimeLimit(){ return lerp(3.4,1.9,diffFactor()); } // seconds allowed idle on a pillar

  function scheduleNextSpawn(now){
    const base = spawnIntervalBase();
    nextSpawnAt = now + base*(0.55+Math.random()*0.85);
  }

  function resetGame(){
    hpMax = 3; hp = hpMax; height = 0; landings = 0;
    combo = 0; comboMultiplier = 1;
    isNewRecord = false; paused = false;
    runStartBest = sessionBest;
    challengeBeatenShoutShown = false;
    lastAnnouncedZoneIdx = 0;
    lastTickAt = 0; lastHeartbeatAt = 0;
    applyBgmPreset('ground');
    obstacles = []; particles = [];
    obstacleUnlocked = {helmet:false, ad:false, leaf:false, boulder:false, lightning:false, friend:false, hpup:false, star:false};
    helmetLevel = 0;
    charSide = 'left'; charState='resting';
    invincibleUntil = 0; landTime=-999; deathAt=-999; gameOverReason='hp';
    shoutUntil=0; flashUntil=0;
    gapTarget = (gapWidthMin+gapWidthMax)/2; gapWidth = gapTarget;
    pillarLeftX = (W-gapWidth)/2; pillarRightX = pillarLeftX+gapWidth;
    charX = currentLeftX(); charY = restY; charScale=1; charRot=0;
    blinkAt = performance.now()+randRange(1500,3500);
    restDeadline = performance.now() + restTimeLimit()*1000 + 1000; // extra grace at the very start
  }

  function startGame(){
    ensureAudio();
    resetGame();
    state = 'playing';
    sfxStart();
    nextSpawnAt = performance.now()+1600;
    startBgm();
    recordPlayStart();
    syncUiButtons();
  }

  function triggerGameOver(){
    state='gameover';
    isNewRecord = height > runStartBest;
    sessionBest = Math.max(sessionBest, height);
    lsSet('bestHeight', String(sessionBest));
    submitScore(height);
    submitGlobalScoreIfBest(height);
    recordGameOverStats();
    creditReferralIfNeeded();
    sfxGameOver();
    vibrate([40,60,40,60,120]);
    shakeUntil = performance.now()+300; shakeMag = 10;
    stopBgm();
    syncUiButtons();
  }

  // ---------- pause / resume ----------
  // shifts every pending wall-clock deadline forward by the paused duration so
  // nothing (idle timeout, jump animation, invincibility, obstacle spawn timer...)
  // "fast-forwards" the instant the game resumes
  function togglePause(){
    if(state!=='playing') return;
    const now = performance.now();
    if(!paused){
      paused = true;
      pauseStartedAt = now;
      stopBgm();
    } else {
      const pausedMs = now - pauseStartedAt;
      restDeadline += pausedMs;
      invincibleUntil += pausedMs;
      blinkAt += pausedMs; blinkUntil += pausedMs;
      deathAt += pausedMs;
      landTime += pausedMs;
      segStart += pausedMs;
      nextSpawnAt += pausedMs;
      shakeUntil += pausedMs;
      unlockToastUntil += pausedMs;
      shoutStart += pausedMs; shoutUntil += pausedMs;
      flashStart += pausedMs; flashUntil += pausedMs;
      comboPopAt += pausedMs;
      fireballGrinStart += pausedMs; fireballStart += pausedMs;
      friendPhaseStart += pausedMs;
      lastTickAt += pausedMs; lastHeartbeatAt += pausedMs;
      paused = false;
      if(!muted) startBgm();
    }
    syncUiButtons();
  }

    charX = fromX; charY = fromY;
    freefallVy = H*0.55;
  }

  function idleTimeoutFall(now){
    targetSideAfterJump = charSide==='left' ? 'right' : 'left';
    travelDir = charSide==='left' ? 1 : -1;
    enterFreefall(charX, restY);
    sfxFall();
  }

  function triggerFallDeath(now){

  // ---- fireball ultimate: 3rd stacked helmet -> grin baring white teeth -> "Fire Ball!!" -> invincible +100m auto-ascent ----
  function triggerFireballGrin(now){

  }
  function triggerFireball(now){
    charState = 'fireball';

    shakeUntil = now+500; shakeMag = 14;
    // satisfying screen-clear: everything currently falling bursts away
    // (clear in place, NOT reassign - this can run while update()'s obstacle
    // loop is mid-iteration via equipHelmet(), and reassigning `obstacles` to
    // a new array would leave that loop indexing into a stale/empty array)
    for(const o of obstacles){
      spawnParticles(o.x, o.y, Math.random()<0.5?fx.particle[0]:fx.particle[1], 6, [60,200], 0.5);

  // ---- friend encounter: touch the falling friend -> high-five -> fly up together (20/30/50m by variant) ----
  function encounterFriend(o){

    friendX = o.x; friendY = o.y;
    friendVariant = o.variant||0;

  function beginJump1(now){
    const fromX = charSide==='left' ? currentLeftX() : currentRightX();
    const dirSign = charSide==='left' ? 1 : -1;
    const midRatio = randRange(0.44,0.58);
    const dist = gapWidth*midRatio;
    const toX = fromX + dirSign*dist;
    targetSideAfterJump = charSide==='left' ? 'right' : 'left';
    segFromX=fromX; segFromY=restY; segToX=toX; segToY=restY;
    segStart=now;
    segDuration = clamp(dist/(W*0.95)*1000, 260, 900);
    segPeak = jumpPeak;
    travelDir = dirSign;
    charState = 'jump1';
    sfxJump();
  }

  function beginJump2(now){
    const targetX = targetSideAfterJump==='left' ? currentLeftX() : currentRightX();
    const dist = Math.abs(targetX-charX);
    segFromX=charX; segFromY=charY; segToX=targetX; segToY=restY;
    segStart=now;
    segDuration = clamp(dist/(W*0.95)*1000, 220, 900);
    segPeak = jumpPeak*clamp(dist/(gapWidth*0.5), 0.5, 1.4);
    travelDir = targetX>charX ? 1 : -1;
    charState = 'jump2';
    sfxJump();
  }

  function tryJump(){
    ensureAudio();
    if(state==='start'){ startGame(); return; }
    if(state==='gameover'){ startGame(); return; }
    if(state!=='playing') return;
    const now = performance.now();
    if(charState==='resting'){
      beginJump1(now);
    } else if(charState==='jump1' || charState==='freefall'){
      beginJump2(now);
    }
    // jump2 or dead: input ignored, already committed
  }

  // ---------- obstacles ----------
  // damaging: drop, leaf, boulder, lightning (2 dmg). beneficial pickups: helmet
  // (stacking shield), ad (heal + advances ad banner), hpup (max HP +1), friend (mini event)
  function pickObstacleType(){
    const pool = [{t:'drop', w:5}];
    if(obstacleUnlocked.helmet) pool.push({t:'helmet', w:1.4});
    if(obstacleUnlocked.ad) pool.push({t:'ad', w:1.1});
    if(obstacleUnlocked.leaf) pool.push({t:'leaf', w:3});
    if(obstacleUnlocked.friend) pool.push({t:'friend', w:1.0});
    if(obstacleUnlocked.lightning) pool.push({t:'lightning', w:1.3});
    if(obstacleUnlocked.hpup) pool.push({t:'hpup', w:0.6});
    if(obstacleUnlocked.boulder) pool.push({t:'boulder', w:2});
    if(obstacleUnlocked.star) pool.push({t:'star', w:0.55});
    const total = pool.reduce((s,p)=>s+p.w,0);
    let r = Math.random()*total;
    for(const p of pool){ if(r<p.w) return p.t; r-=p.w; }
    return 'drop';
  }

  function obstacleRadius(type){
    if(type==='boulder') return W*0.075;
    if(type==='ad') return W*0.06;
    if(type==='helmet') return W*0.055;
    if(type==='leaf') return W*0.05;
    if(type==='lightning') return W*0.05;
    if(type==='friend') return W*0.058;
    if(type==='hpup') return W*0.058;
    if(type==='star') return W*0.058;
    return W*0.045;
  }

  function spawnObstacle(){
    const type = pickObstacleType();
    const r = obstacleRadius(type);
    const margin = r+10;
    const usableW = Math.max(10, gapWidth-margin*2);
    const x = pillarLeftX+margin+Math.random()*usableW;
    const speedMul = type==='boulder' ? 0.72
      : type==='lightning' ? 1.25
      : type==='friend' ? 0.78
      : (type==='helmet'||type==='ad'||type==='hpup'||type==='star') ? 0.8
      : 1;
    const vy = obstacleSpeedBase()*(0.85+Math.random()*0.35)*speedMul;
    obstacles.push({
      type, x, baseX:x, y:-r-10, r, vy, age:0,
      amp: r*1.7, freq: 2+Math.random()*1.6, phase: Math.random()*Math.PI*2,
      rot:0, spin:(Math.random()<0.5?-1:1)*randRange(0.5,1.4),
      variant: type==='friend' ? pickFriendVariant() : 0,
      zone: currentZoneIdx() // freeze the seasonal skin at spawn time so it doesn't reskin mid-fall
    });
  }

  function spawnParticles(x,y,color,count,speedRange,life){
    for(let i=0;i<count;i++){
      const ang = Math.random()*Math.PI*2;
      const sp = randRange(speedRange[0],speedRange[1]);
      particles.push({
        x,y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp-sp*0.3,
        life:life, maxLife:life, color, r: randRange(2,5)
      });
    }
  }

  // combo-scaling jump trail: sparser/plainer at low combo, denser/more colorful as it climbs
  function spawnJumpTrail(){
    if(combo<1) return;
    const intensity = clamp((comboMultiplier-1)/1.0, 0, 1); // 0 at x1.0 -> 1 at the x2.0 cap
    if(Math.random() > 0.3+intensity*0.45) return;
    const color = lerpColorHex('#FFE9A0', '#FF5CF0', intensity);
    spawnParticles(
      charX+randRange(-charRadius*0.3,charRadius*0.3),
      charY+randRange(-charRadius*0.2,charRadius*0.4),
      color, 1+Math.round(intensity*2), [10,35], 0.28+intensity*0.22
    );
  }

  function hitObstacle(o, dmg){
    dmg = dmg||1;
    hp = Math.max(0,hp-dmg);
    combo = 0; comboMultiplier = 1;
    invincibleUntil = performance.now()+950;
    spawnParticles(o.x,o.y,'#FFD93D',10,[60,180],0.5);
    if(o.type==='lightning') sfxLightning(); else sfxHit();
    vibrate(dmg>=2 ? [30,40,60] : 40);
    shakeUntil = performance.now()+180; shakeMag = dmg>=2 ? 10 : 6;
    if(hp<=0) triggerGameOver();

  // ---------- update ----------
  function update(dt, now){
    gapWidth += (gapTarget-gapWidth)*Math.min(1,dt*1.5);
    pillarLeftX = (W-gapWidth)/2;
    pillarRightX = pillarLeftX+gapWidth;
    bgScrollOffset += dt*scrollSpeed;

    // blink
    if(!blinking && now>blinkAt){ blinking=true; blinkUntil=now+120; }
    if(blinking && now>blinkUntil){ blinking=false; blinkAt = now+randRange(1800,4200); }

    if(state==='playing'){
      // low-HP danger cue: heartbeat sfx/vibrate + a pulsing red vignette (drawn in render())
      if(hp===1 && now-lastHeartbeatAt>=700){
        lastHeartbeatAt = now;
        sfxHeartbeat();
        vibrate(35);
      }
      if(charState==='resting'){
        charX = charSide==='left' ? currentLeftX() : currentRightX();
        charY = restY + Math.sin(now/320)*2;
        charRot = 0; charScale = 1;
        const remain = (restDeadline-now)/1000, limit = restTimeLimit();
        if(remain < limit*0.2 && remain>0){
          const shake = 1-remain/(limit*0.2);
          charX += (Math.random()*2-1)*shake*3;
        }
        // urgency ticking as the rest timer runs low, speeding up toward the deadline
        const restFrac = clamp(remain/limit, 0, 1);
        if(restFrac<=0.28 && restFrac>0){
          const tickInterval = lerp(420, 110, 1-restFrac/0.28);
          if(now-lastTickAt>=tickInterval){
            lastTickAt = now;
            sfxTick(lerp(0.07,0.13,1-restFrac/0.28));
            vibrate(15);
          }
        }
        if(now > restDeadline){
          idleTimeoutFall(now);
        }
      } else if(charState==='jump1'){
        const t = Math.min(1,(now-segStart)/segDuration);
        charX = lerp(segFromX, segToX, t);
        charY = restY - Math.sin(t*Math.PI)*segPeak;
        charRot = Math.sin(t*Math.PI)*0.32*travelDir;
        charScale = 1 + Math.sin(t*Math.PI)*0.06;
        spawnJumpTrail();
        if(t>=1){
          enterFreefall(segToX, restY);
        }
      } else if(charState==='freefall'){
        freefallVy += H*2.4*dt;
        charY += freefallVy*dt;
        const targetX = targetSideAfterJump==='left' ? currentLeftX() : currentRightX();
        charX += (targetX-charX)*Math.min(1,dt*0.8);
        charRot += dt*5*travelDir;
        charScale = 1;
        if(charY > H + charRadius*2.2){
          triggerFallDeath(now);
        }
      } else if(charState==='jump2'){
        const t = Math.min(1,(now-segStart)/segDuration);
        charX = lerp(segFromX, segToX, t);
        charY = lerp(segFromY, segToY, t) - Math.sin(t*Math.PI)*segPeak;
        charRot = Math.sin(t*Math.PI)*0.32*travelDir;
        charScale = 1 + Math.sin(t*Math.PI)*0.06;
        spawnJumpTrail();
        if(t>=1){
          charSide = targetSideAfterJump;
          charX = charSide==='left' ? currentLeftX() : currentRightX();
          charY = restY; charRot = 0; charScale = 1;
          charState = 'resting';
          restDeadline = now + restTimeLimit()*1000; lastTickAt = 0;
          landCharacter();
        }
      } else if(charState==='dead'){
        freefallVy += H*2.4*dt;
        charY += freefallVy*dt;
        charRot += dt*5*travelDir;
        if(now-deathAt>500){
          triggerGameOver();
        }
      } else if(charState==='fireball_grin'){
        // wind-up: bare white teeth and grin before igniting
        const gt = Math.min(1,(now-fireballGrinStart)/FIREBALL_GRIN_DURATION);
        charScale = 1 + Math.sin(gt*Math.PI)*0.14;
        charY = restY + Math.sin(now/70)*2;
        if(gt>=1){
          triggerFireball(now);
        }
      } else if(charState==='fireball'){
        const t = Math.min(1,(now-fireballStart)/fireballDuration);
        const eased = 1-Math.pow(1-t,3);
        height = fireballStartHeight + 100*eased;
        sessionBest = Math.max(sessionBest, height);
        const centerX = (pillarLeftX+pillarRightX)/2;
        charX += (centerX-charX)*Math.min(1,dt*4);
        charY = restY + Math.sin(now/90)*3;
        charRot = Math.sin(now/60)*0.15;
        charScale = 1.08 + Math.sin(now/80)*0.05;
        if(Math.random()<0.6){
          const trailFx = currentUltimateFx();
          spawnParticles(charX+randRange(-charRadius*0.4,charRadius*0.4), charY+charRadius*0.7,
            Math.random()<0.5?trailFx.particle[0]:trailFx.particle[1], 1, [20,60], 0.35);
        }
        if(t>=1){
          charState = 'resting';
          charX = charSide==='left' ? currentLeftX() : currentRightX();
          charY = restY; charRot=0; charScale=1;
          restDeadline = now + restTimeLimit()*1000; lastTickAt = 0;
          landTime = now;
          spawnParticles(charX, restY+charRadius*0.6, '#C9A876', 8, [30,110], 0.45);
          sfxLand();
        }
      } else if(charState==='friend_highfive'){
        const dur = 420;
        const t = Math.min(1,(now-friendPhaseStart)/dur);
        friendX = lerp(hfFriendStartX, charX, t);
        friendY = lerp(hfFriendStartY, charY, t);
        charScale = 1 + Math.sin(t*Math.PI)*0.1;
        if(t>=1){
          spawnParticles(charX, charY, '#FFD93D', 12, [60,180], 0.5);
          const fv0 = FRIEND_VARIANTS[friendVariant];
          triggerShout(t('shoutHighFive', { n: fv0.ascend }), fv0.wing, 700);
          playVoiceLine('friend'+friendVariant, fv0.line, 1.0, 1.05 + friendVariant*0.08);
          sfxFriendGreet();
          charState = 'friend_ascend';
          friendAscendStartHeight = height;
          friendPhaseStart = now;
        }
      } else if(charState==='friend_ascend'){
        const dur = 1200 + FRIEND_VARIANTS[friendVariant].ascend*17;
        const t = Math.min(1,(now-friendPhaseStart)/dur);
        const eased = 1-Math.pow(1-t,2);
        height = friendAscendStartHeight + FRIEND_VARIANTS[friendVariant].ascend*eased;
        sessionBest = Math.max(sessionBest, height);
        charY = restY + Math.sin(now/260)*4;
        charScale = 1;
        const dir = travelDir || 1;
        const exitStart = 0.65;
        if(t < exitStart){
          friendX = charX + charRadius*1.7*dir;
          friendY = charY + Math.sin(now/220+1)*4;
        } else {
          const et = (t-exitStart)/(1-exitStart);
          friendX = charX + charRadius*1.7*dir + et*charRadius*3;
          friendY = charY - et*charRadius*5;
        }
        if(Math.random()<0.35){
          spawnParticles(friendX, friendY+charRadius*0.5, '#BDEFFF', 1, [15,45], 0.4);
        }
        if(t>=1){
          charState = 'resting';
          charX = charSide==='left' ? currentLeftX() : currentRightX();
          charY = restY; charRot=0; charScale=1;
          restDeadline = now + restTimeLimit()*1000; lastTickAt = 0;
          landTime = now;
          spawnParticles(charX, restY+charRadius*0.6, '#C9A876', 6, [30,90], 0.4);
          sfxLand();
        }
      }

      if(now>=nextSpawnAt){ spawnObstacle(); scheduleNextSpawn(now); }

      const vulnerable = (charState==='jump1' || charState==='freefall' || charState==='jump2');
      for(let i=obstacles.length-1;i>=0;i--){
        const o=obstacles[i];
        o.age += dt;
        o.y += o.vy*dt;
        if(o.type==='leaf'){
          o.x = o.baseX + Math.sin(o.age*o.freq+o.phase)*o.amp;
          o.rot = Math.sin(o.age*o.freq+o.phase)*0.7;
        } else if(o.type==='boulder'){
          o.rot += dt*o.spin*0.3;
        } else if(o.type==='helmet'){
          o.rot += dt*o.spin*0.35;
        } else if(o.type==='ad'){
          o.rot = Math.sin(o.age*2.2+o.phase)*0.08;
        } else if(o.type==='lightning'){
          o.rot = Math.sin(o.age*40)*0.05;
        } else if(o.type==='friend'){
          o.rot = Math.sin(o.age*2+o.phase)*0.12;
        } else if(o.type==='hpup'){
          o.rot = Math.sin(o.age*1.6+o.phase)*0.06;
        } else if(o.type==='star'){
          o.rot += dt*1.8;
        } else {
          o.rot += dt*o.spin;
        }
        if(o.y - o.r > H){ obstacles.splice(i,1); continue; }

        // fireball ultimate: smash straight through anything in the gap
        if(charState==='fireball'){
          spawnParticles(o.x,o.y,'#FFB199',6,[50,150],0.4);
          obstacles.splice(i,1);
          continue;
        }
        // fireball wind-up (grinning before ignition): invincible, obstacles keep falling
        // until the burst-clear happens at actual ignition (triggerFireball)
        if(charState==='fireball_grin'){ continue; }

        if(vulnerable){
          const dist = Math.hypot(charX-o.x, charY-o.y);
          if(dist < charRadius*0.72 + o.r*0.72){
            if(o.type==='ad'){
              healFromAd(o);
              obstacles.splice(i,1);
              continue;
            } else if(o.type==='hpup'){
              gainMaxHp(o);
              obstacles.splice(i,1);
              continue;
            } else if(o.type==='star'){
              grantInvincibility(o);
              obstacles.splice(i,1);
              continue;
            } else if(o.type==='helmet'){
              equipHelmet(o);
              // equipHelmet() may trigger the fireball wind-up (grin phase), which does
              // NOT touch the obstacles array - safe to keep iterating normally
              obstacles.splice(i,1);
              continue;
            } else if(o.type==='friend'){
              encounterFriend(o);
              obstacles.splice(i,1);
              continue;
            } else if(helmetLevel>=1){
              destroyWithHelmet(o);
              obstacles.splice(i,1);
              continue;
            } else if(now>=invincibleUntil){
              hitObstacle(o, o.type==='lightning'?2:1);
              obstacles.splice(i,1);
              continue;
            }
          }
        }
      }
    }

    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];
      p.life -= dt;
      if(p.life<=0){ particles.splice(i,1); continue; }
      p.x += p.vx*dt; p.y += p.vy*dt;
      p.vy += 220*dt;
    }
  }

  // ---------- drawing helpers ----------
  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }
  function heart(cx,cy,s){
    ctx.beginPath();
    ctx.moveTo(cx, cy+s*0.3);
    ctx.bezierCurveTo(cx-s, cy-s*0.6, cx-s*1.6, cy+s*0.35, cx, cy+s*1.15);
    ctx.bezierCurveTo(cx+s*1.6, cy+s*0.35, cx+s, cy-s*0.6, cx, cy+s*0.3);
    ctx.closePath();
  }

      decor:null, enterMsg:{ko:'🌌 태양계를 벗어났어요!',en:'🌌 You left the solar system!'} }

  const ZONE_TRANS = 70; // meters of crossfade blended into the next zone near each boundary
  const ZONE_BOUNDS = (function(){
    let acc = 0;
    return ZONES.map(function(z){ const b = { start: acc, end: acc+z.len }; acc += z.len; return b; });
  })();
  function zoneInfo(h){
    h = Math.max(0,h);
    let idx = ZONES.length-1;
    for(let i=0;i<ZONES.length;i++){ if(h < ZONE_BOUNDS[i].end){ idx = i; break; } }
    const nextIdx = Math.min(ZONES.length-1, idx+1);
    const into = h - ZONE_BOUNDS[idx].start;
    let t = 0;
    if(idx < ZONES.length-1){
      t = clamp((into-(ZONES[idx].len-ZONE_TRANS))/ZONE_TRANS, 0, 1);
    }
    return { idx, nextIdx, t, zone:ZONES[idx], nextZone:ZONES[nextIdx] };
  }
  // "logical" zone used for picking obstacle skins / character outfit (hard cutover at the halfway blend point)
  function currentZoneIdx(h){
    const zi = zoneInfo(h==null?height:h);
    return zi.t>=0.5 ? zi.nextIdx : zi.idx;
  }
  // announces arriving at a new zone (skips zone 0, the starting spring sky)
  function checkZoneTransition(){
    const zi = currentZoneIdx(height);
    if(zi !== lastAnnouncedZoneIdx){
      lastAnnouncedZoneIdx = zi;
      const z = ZONES[zi];
      if(z.enterMsg){
        unlockToastText = z.enterMsg[lang]||z.enterMsg.ko; unlockToastUntil = performance.now()+2400;
        sfxUnlock();
      }
    }
  }

  let starField = null;
  function ensureStars(){
    if(starField) return starField;
    starField = [];
    for(let i=0;i<48;i++){
      starField.push({ xf: Math.random(), yf: Math.random(), r: randRange(0.6,2.0), ph: Math.random()*Math.PI*2, spd: randRange(0.5,1.3) });
    }
    return starField;
  }
  let cloudField = null;
  function ensureClouds(){
    if(cloudField) return cloudField;
    cloudField = [];
    for(let i=0;i<6;i++){
      cloudField.push({ xf: Math.random(), yf: Math.random(), s: randRange(0.5,1.1), spd: randRange(0.25,0.5) });
    }
    return cloudField;
  }
  // deepest parallax layer: dim, tiny, very-slow-scrolling stars for depth once in space
  let starFieldFar = null;
  function ensureFarStars(){
    if(starFieldFar) return starFieldFar;
    starFieldFar = [];
    for(let i=0;i<70;i++){
      starFieldFar.push({ xf: Math.random(), yf: Math.random(), r: randRange(0.4,1.1), ph: Math.random()*Math.PI*2, spd: randRange(0.4,1.0) });
    }
    return starFieldFar;
  }
  // distant mountain silhouettes: slow parallax layer for the ground-based zones
  let mountainField = null;
  function ensureMountains(){
    if(mountainField) return mountainField;
    mountainField = [];
    for(let i=0;i<5;i++){
      mountainField.push({ xf: i/5 + Math.random()*0.08, yf: 0.68+Math.random()*0.18, w: randRange(0.3,0.44), h: randRange(0.13,0.24) });
    }
    return mountainField;
  }
  function drawMountainLayer(zi, now){
    // visible through the ground/season zones, fades away while crossing into orbit
    const alpha = zi.idx<=3 ? 1 : (zi.idx===4 ? 1-zi.t : 0);
    if(alpha<=0.01) return;
    const col = lerpColorHex(zi.zone.pillarB, zi.nextZone.pillarB, zi.t);
    const mts = ensureMountains();
    ctx.save();
    ctx.globalAlpha = alpha*0.32;
    ctx.fillStyle = col;
    for(const m of mts){
      const h = m.h*H;
      const y = ((m.yf*H) + bgScrollOffset*0.12) % (H+h*2) - h;
      const x = m.xf*W, w = m.w*W;
      ctx.beginPath();
      ctx.moveTo(x-w/2, y+h);
      ctx.lineTo(x, y);
      ctx.lineTo(x+w/2, y+h);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  function drawBackground(now){
    const zi = zoneInfo(height);
    const topCol = lerpColorHex(zi.zone.skyTop, zi.nextZone.skyTop, zi.t);
    const botCol = lerpColorHex(zi.zone.skyBot, zi.nextZone.skyBot, zi.t);
    const grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0, topCol); grad.addColorStop(1, botCol);
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    drawCelestialDecor(zi, now);

    // far/deep star layer: dimmer, smaller, scrolls slowest (depth cue behind the near stars)
    const farStarAlpha = zi.idx>=4 ? 0.7 : (zi.idx===3 ? zi.t*0.7 : 0);
    if(farStarAlpha>0.01){
      const farStars = ensureFarStars();
      ctx.save();
      for(const s of farStars){
        const y = ((s.yf*H) + bgScrollOffset*0.08*s.spd) % (H+20) - 10;
        const x = s.xf*W;
        const tw = 0.4+0.3*Math.sin(now/900*s.spd + s.ph);
        ctx.globalAlpha = farStarAlpha*tw;
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath(); ctx.arc(x,y,s.r,0,Math.PI*2); ctx.fill();
      }
      ctx.restore();
    }

    // near stars only in (or fading into) the space zone
    const starAlpha = zi.idx>=4 ? 1 : (zi.idx===3 ? zi.t : 0);
    if(starAlpha>0.01){
      const stars = ensureStars();
      ctx.save();
      for(const s of stars){
        const y = ((s.yf*H) + bgScrollOffset*0.25*s.spd) % (H+20) - 10;
        const x = s.xf*W;
        const tw = 0.55+0.45*Math.sin(now/500*s.spd + s.ph);
        ctx.globalAlpha = starAlpha*tw;
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath(); ctx.arc(x,y,s.r,0,Math.PI*2); ctx.fill();
      }
      ctx.restore();
    }

    // distant mountain silhouettes (mid-far parallax layer, ground zones only)
    drawMountainLayer(zi, now);

    // clouds (nebulae once in space) fade out crossing into the space zone
    const cloudAlpha = zi.idx>=4 ? 0.5 : clamp(1-(zi.idx===3?zi.t:0), 0.08, 0.85);
    const cloudColor = lerpColorHexAlpha(zi.zone.cloudColor, zi.nextZone.cloudColor, zi.t);
    const clouds = ensureClouds();
    ctx.save();
    ctx.globalAlpha = cloudAlpha;
    for(const c of clouds){
      const y = ((c.yf*H) + bgScrollOffset*0.4*c.spd) % (H+120) - 60;
      const x = c.xf*W;
      drawCloud(x,y,c.s*W*0.16,cloudColor);
    }
    ctx.restore();

    drawGroundSkyline();
  }

  // ---------- decorative celestial body (sun/earth/moon/planet) per zone, cross-fades at zone boundaries ----------
  function drawCelestialDecor(zi, now){
    const cx = W*0.74, cy = H*0.15;
    const bob = Math.sin(now/2600)*H*0.006;
    if(zi.zone.decor){
      ctx.save(); ctx.globalAlpha = 1-zi.t;
      drawDecorBody(zi.zone.decor, cx, cy+bob);
      ctx.restore();
    }
    if(zi.t>0.002 && zi.nextZone!==zi.zone && zi.nextZone.decor){
      ctx.save(); ctx.globalAlpha = zi.t;
      drawDecorBody(zi.nextZone.decor, cx, cy+bob);
      ctx.restore();
    }
  }
  function drawDecorBody(decor, x, y){
    const r = W*(decor.size||0.12);
    if(decor.type==='sun'){
      const glow = ctx.createRadialGradient(x,y,0,x,y,r*2.4);
      glow.addColorStop(0,'rgba(255,232,170,0.55)'); glow.addColorStop(1,'rgba(255,232,170,0)');
      ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(x,y,r*2.4,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = decor.color;
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
      return;
    }
    if(decor.type==='earth'){
      ctx.fillStyle = decor.color;
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = decor.accent;
      ctx.beginPath(); ctx.ellipse(x-r*0.3,y-r*0.15,r*0.42,r*0.28,0.4,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x+r*0.35,y+r*0.3,r*0.3,r*0.2,-0.3,0,Math.PI*2); ctx.fill();
      return;
    }
    if(decor.type==='moon'){
      ctx.fillStyle = decor.color;
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = decor.accent;
      ctx.beginPath(); ctx.arc(x-r*0.32,y-r*0.28,r*0.22,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x+r*0.28,y+r*0.1,r*0.14,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x-r*0.05,y+r*0.38,r*0.16,0,Math.PI*2); ctx.fill();
      return;
    }
    if(decor.type==='bands'){
      ctx.save();
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.clip();
      ctx.fillStyle = decor.color;
      ctx.fillRect(x-r,y-r,r*2,r*2);
      const bandColors = decor.bands;
      for(let i=-3;i<=3;i++){
        ctx.fillStyle = bandColors[((i%bandColors.length)+bandColors.length)%bandColors.length];
        ctx.fillRect(x-r, y+i*r*0.3-r*0.08, r*2, r*0.16);
      }
      ctx.restore();
      return;
    }
    if(decor.type==='ring'){
      ctx.save();
      ctx.translate(x,y); ctx.rotate(-0.34);
      ctx.strokeStyle = decor.ringColor; ctx.lineWidth = r*0.22;
      ctx.beginPath(); ctx.ellipse(0,0,r*1.9,r*0.6,0,0,Math.PI*2); ctx.stroke();
      ctx.restore();
      ctx.fillStyle = decor.color;
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
      return;
    }
    // plain glowing planet (mars/uranus/neptune)
    const glow = ctx.createRadialGradient(x,y,r*0.3,x,y,r*1.6);
    glow.addColorStop(0, decor.color+'55'); glow.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(x,y,r*1.6,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = decor.color;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  }

  // ---------- ground/skyline: visible only for the first ~70m, then sinks away and fades ----------
  function drawGroundSkyline(){
    const FADE_H = 70;
    if(height >= FADE_H) return;
    const p = clamp(height/FADE_H, 0, 1);
    const alpha = 1-p;
    if(alpha<=0.01) return;
    const groundY = H*(0.82 + p*0.55);
    if(groundY - H*0.3 > H) return;
    ctx.save();
    ctx.globalAlpha = alpha;
    const buildings = [
      {x:0.03,w:0.11,h:0.11},{x:0.15,w:0.08,h:0.17},{x:0.25,w:0.10,h:0.08},
      {x:0.58,w:0.09,h:0.14},{x:0.69,w:0.12,h:0.09},{x:0.83,w:0.08,h:0.18},{x:0.93,w:0.06,h:0.07}
    ];
    ctx.fillStyle = 'rgba(58,48,68,0.55)';
    for(const b of buildings){
      const bw = b.w*W, bh = b.h*H*0.6;
      ctx.fillRect(b.x*W, groundY-bh, bw, bh+H*0.06);
    }
    ctx.fillStyle = 'rgba(86,120,78,0.55)';
    ctx.fillRect(0, groundY, W, H-groundY);
    ctx.restore();
  }

  // lerp two rgba()/rgba(...)-style css color strings component-wise (used for cloud tint blending)
  function parseRgba(str){
    const m = str.match(/rgba?\(([^)]+)\)/);
    if(!m) return [255,255,255,0.85];
    const parts = m[1].split(',').map(s=>parseFloat(s));
    return [parts[0],parts[1],parts[2], parts.length>3?parts[3]:1];
  }
  function lerpColorHexAlpha(c1,c2,t){
    const a = parseRgba(c1), b = parseRgba(c2);
    const r = Math.round(lerp(a[0],b[0],t)), g = Math.round(lerp(a[1],b[1],t)), bl = Math.round(lerp(a[2],b[2],t));
    const al = lerp(a[3],b[3],t);
    return `rgba(${r},${g},${bl},${al.toFixed(3)})`;
  }

  function drawCloud(x,y,s,color){
    ctx.fillStyle = color || 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.ellipse(x,y,s,s*0.55,0,0,Math.PI*2);
    ctx.ellipse(x+s*0.6,y+s*0.1,s*0.65,s*0.4,0,0,Math.PI*2);
    ctx.ellipse(x-s*0.6,y+s*0.15,s*0.55,s*0.35,0,0,Math.PI*2);
    ctx.fill();
  }

  function drawPillars(now){
    const w = pillarLeftX;
    drawPillar(0, w, true);
    drawPillar(W-w, w, false);
  }
  function drawPillar(x0, w, isLeft){
    const zi = zoneInfo(height);
    const colA = lerpColorHex(zi.zone.pillarA, zi.nextZone.pillarA, zi.t);
    const colB = lerpColorHex(zi.zone.pillarB, zi.nextZone.pillarB, zi.t);
    const grad = ctx.createLinearGradient(x0,0,x0+w,0);
    grad.addColorStop(0, isLeft? colA : colB);
    grad.addColorStop(1, isLeft? colB : colA);
    ctx.fillStyle = grad;
    ctx.fillRect(x0,0,w,H);

    const texKind = ZONES[currentZoneIdx(height)].texture || 'blocks';
    drawPillarTexture(x0, w, texKind, performance.now());

    // inner glowing rail
    const railTint = lerpColorHex(zi.zone.railTint, zi.nextZone.railTint, zi.t);
    const railX = isLeft ? x0+w : x0;
    const railGrad = ctx.createLinearGradient(railX-6,0,railX+6,0);
    railGrad.addColorStop(0,'rgba(255,255,255,0)');
    railGrad.addColorStop(0.5, railTint.replace('rgb(','rgba(').replace(')',',0.6)'));
    railGrad.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle = railGrad;
    ctx.fillRect(railX-6,0,12,H);
  }

  // ---------- per-zone pillar surface texture/pattern (color alone no longer carries the zone identity) ----------
  const pillarTexFields = {};
  function pillarTexField(kind, count, tileH){
    const cached = pillarTexFields[kind];
    if(cached) return cached;
    const pts = [];
    for(let i=0;i<count;i++) pts.push({ xf: Math.random(), yf: Math.random()*tileH, r: randRange(0.4,1) });
    const f = { pts, tileH };
    pillarTexFields[kind] = f;
    return f;
  }
  function drawPillarTexture(x0, w, kind, now){
    ctx.save();
    ctx.beginPath(); ctx.rect(x0,0,w,H); ctx.clip();
    const off = bgScrollOffset;

    if(kind==='blocks'){
      const blockH = 76;
      const o = off % blockH;
      ctx.globalAlpha = 0.18; ctx.fillStyle = '#000';
      for(let y=-blockH+o; y<H+blockH; y+=blockH){ roundRect(x0+w*0.12, y+8, w*0.76, blockH*0.45, 10); ctx.fill(); }
    } else if(kind==='diagonal'){
      const spacing = 46;
      const o = off % spacing;
      ctx.globalAlpha = 0.16; ctx.strokeStyle = '#000'; ctx.lineWidth = w*0.1;
      for(let y=-spacing*2+o; y<H+spacing*2; y+=spacing){
        ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x0+w, y+w); ctx.stroke();
      }
    } else if(kind==='crystal'){
      const spacing = 60;
      const o = off*0.7 % spacing;
      ctx.globalAlpha = 0.3; ctx.fillStyle = 'rgba(255,255,255,0.9)';
      for(let y=-spacing+o; y<H+spacing; y+=spacing){
        const cx = x0+w*0.5, cy = y;
        ctx.beginPath(); ctx.moveTo(cx,cy-10); ctx.lineTo(cx+w*0.18,cy); ctx.lineTo(cx,cy+10); ctx.lineTo(cx-w*0.18,cy); ctx.closePath(); ctx.fill();
      }
    } else if(kind==='panel'){
      const blockH = 90;
      const o = off % blockH;
      ctx.globalAlpha = 0.28; ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 2;
      for(let y=-blockH+o; y<H+blockH; y+=blockH){ ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(x0+w,y); ctx.stroke(); }
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      for(let y=-blockH+o+10; y<H+blockH; y+=blockH){
        ctx.beginPath(); ctx.arc(x0+w*0.18,y,2.2,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x0+w*0.82,y,2.2,0,Math.PI*2); ctx.fill();
      }
    } else if(kind==='crater'){
      const f = pillarTexField('crater', 10, 140);
      const o = off % f.tileH;
      for(let ty=-f.tileH+o; ty<H+f.tileH; ty+=f.tileH){
        for(const p of f.pts){
          const cx = x0+p.xf*w, cy = ty+p.yf, rr = w*0.09*p.r;
          ctx.globalAlpha = 0.32; ctx.fillStyle = 'rgba(0,0,0,1)';
          ctx.beginPath(); ctx.arc(cx,cy,rr,0,Math.PI*2); ctx.fill();
          ctx.globalAlpha = 0.25; ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
    } else if(kind==='crack'){
      const f = pillarTexField('crack', 6, 160);
      const o = off % f.tileH;
      ctx.globalAlpha = 0.4; ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.lineWidth = w*0.045; ctx.lineCap = 'round';
      for(let ty=-f.tileH+o; ty<H+f.tileH; ty+=f.tileH){
        for(const p of f.pts){
          const cx = x0+p.xf*w, cy = ty+p.yf;
          ctx.beginPath();
          ctx.moveTo(cx-w*0.12,cy-10); ctx.lineTo(cx,cy); ctx.lineTo(cx+w*0.1,cy+14); ctx.lineTo(cx-w*0.05,cy+26);
          ctx.stroke();
        }
      }
    } else if(kind==='bands'){
      const bandH = 34;
      const o = off*0.5 % bandH;
      ctx.globalAlpha = 0.22;
      let i = 0;
      for(let y=-bandH+o; y<H+bandH; y+=bandH, i++){
        ctx.fillStyle = i%2===0 ? 'rgba(0,0,0,0.35)' : 'rgba(255,255,255,0.28)';
        ctx.beginPath();
        ctx.moveTo(x0, y);
        for(let sx=0; sx<=w; sx+=6){ ctx.lineTo(x0+sx, y+Math.sin((sx+now/200)*0.15)*4); }
        ctx.lineTo(x0+w, y+bandH*0.6); ctx.lineTo(x0, y+bandH*0.6);
        ctx.closePath(); ctx.fill();
      }
    } else if(kind==='grain'){
      const f = pillarTexField('grain', 40, 120);
      const o = off % f.tileH;
      ctx.globalAlpha = 0.4; ctx.fillStyle = 'rgba(255,255,255,0.9)';
      for(let ty=-f.tileH+o; ty<H+f.tileH; ty+=f.tileH){
        for(const p of f.pts){ ctx.beginPath(); ctx.arc(x0+p.xf*w, ty+p.yf, 1, 0, Math.PI*2); ctx.fill(); }
      }
    } else if(kind==='streak'){
      const spacing = w*0.4;
      ctx.globalAlpha = 0.3; ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2;
      for(let sx=x0+spacing*0.5; sx<x0+w; sx+=spacing){
        ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, H); ctx.stroke();
      }
      const blobY = ((now/8) % (H+200))-100;
      const g = ctx.createRadialGradient(x0+w/2,blobY,0,x0+w/2,blobY,w*0.7);
      g.addColorStop(0,'rgba(255,255,255,0.4)'); g.addColorStop(1,'rgba(255,255,255,0)');
      ctx.globalAlpha = 1; ctx.fillStyle = g; ctx.fillRect(x0,blobY-w,w,w*2);
    } else if(kind==='energy'){
      const f = pillarTexField('energy', 8, 150);
      const o = off % f.tileH;
      let prev = null;
      for(let ty=-f.tileH+o; ty<H+f.tileH; ty+=f.tileH){
        for(const p of f.pts){
          const cx = x0+p.xf*w, cy = ty+p.yf;
          const pulse = 0.5+0.4*Math.sin(now/500+p.xf*10);
          if(prev){ ctx.globalAlpha = pulse*0.5; ctx.strokeStyle = 'rgba(184,168,232,0.8)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(prev[0],prev[1]); ctx.lineTo(cx,cy); ctx.stroke(); }
          ctx.globalAlpha = pulse; ctx.fillStyle = 'rgba(210,190,255,0.9)';
          ctx.beginPath(); ctx.arc(cx,cy,2.2,0,Math.PI*2); ctx.fill();
          prev = [cx,cy];
        }
      }
    }
    ctx.restore();
  }

  function drawCharacter(x,y,scale,rot,now){
    const __charType = currentSkin().character;
    if(__charType==='ninja'){ drawCharacterNinja(x,y,scale,rot,now); return; }
    if(__charType==='spider'){ drawCharacterSpider(x,y,scale,rot,now); return; }
    if(__charType==='taekwon'){ drawCharacterTaekwon(x,y,scale,rot,now); return; }
    if(__charType==='astronaut'){ drawCharacterAstronaut(x,y,scale,rot,now); return; }
    if(__charType==='robot'){ drawCharacterRobot(x,y,scale,rot,now); return; }
    if(__charType==='dinosaur'){ drawCharacterDinosaur(x,y,scale,rot,now); return; }
    const isFlashing = now < invincibleUntil && Math.floor(now/90)%2===0;
    const sinceLand = now-landTime;
    let squash = 1, squashY = 1;
    if(sinceLand>=0 && sinceLand<260){
      const p = sinceLand/260;
      const wob = Math.sin(p*Math.PI)*(1-p);
      squash = 1+wob*0.18; squashY = 1-wob*0.18;
    }
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(rot);
    ctx.scale(scale*squash, scale*squashY);

    const r = charRadius;
    // shadow
    ctx.save();
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(0, r*1.15, r*0.9, r*0.28, 0,0,Math.PI*2); ctx.fill();
    ctx.restore();

    // fireball ultimate: flame aura behind the body
    if(charState==='fireball'){
      const flicker = 1+Math.sin(now/40)*0.08;
      ctx.save();
      ctx.scale(flicker,flicker);
      const fg = ctx.createRadialGradient(0,0,r*0.3,0,0,r*1.6);
      fg.addColorStop(0,'rgba(255,217,61,0.9)');
      fg.addColorStop(0.5,'rgba(255,140,45,0.55)');
      fg.addColorStop(1,'rgba(255,90,45,0)');
      ctx.fillStyle = fg;
      ctx.beginPath(); ctx.arc(0,0,r*1.6,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }

    // feet (only when resting on a pillar)
    if(charState==='resting'){
      ctx.fillStyle = '#F2994A';
      ctx.beginPath(); ctx.ellipse(-r*0.35, r*0.92, r*0.22, r*0.13, 0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(r*0.35, r*0.92, r*0.22, r*0.13, 0,0,Math.PI*2); ctx.fill();
    }

    // wing
    ctx.fillStyle = currentSkin().wing;
    ctx.beginPath();
    ctx.ellipse(-r*0.75, r*0.05, r*0.45, r*0.62, -0.5, 0, Math.PI*2);
    ctx.fill();

    // body
    ctx.fillStyle = isFlashing ? '#FFFFFF' : currentSkin().body;
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();

    // blush
    ctx.fillStyle = 'rgba(255,120,120,0.55)';
    ctx.beginPath(); ctx.ellipse(-r*0.5, r*0.18, r*0.16, r*0.1, 0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(r*0.5, r*0.18, r*0.16, r*0.1, 0,0,Math.PI*2); ctx.fill();

    // eyes
    const eyeY = -r*0.08;
    const eyeDX = r*0.36;
    if(charState==='fireball_grin'){
      // confident squint during the fireball wind-up grin
      ctx.strokeStyle = '#3A2A1A'; ctx.lineWidth = r*0.09; ctx.lineCap='round';
      ctx.beginPath(); ctx.arc(-eyeDX, eyeY+r*0.03, r*0.16, Math.PI*1.08, Math.PI*1.92); ctx.stroke();
      ctx.beginPath(); ctx.arc(eyeDX, eyeY+r*0.03, r*0.16, Math.PI*1.08, Math.PI*1.92); ctx.stroke();
    } else if(blinking){
      ctx.strokeStyle = '#3A2A1A'; ctx.lineWidth = r*0.08; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(-eyeDX-r*0.14,eyeY); ctx.lineTo(-eyeDX+r*0.14,eyeY); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(eyeDX-r*0.14,eyeY); ctx.lineTo(eyeDX+r*0.14,eyeY); ctx.stroke();
    } else {
      const dir = charState!=='resting' ? travelDir : 0;
      ctx.fillStyle = '#3A2A1A';
      ctx.beginPath(); ctx.ellipse(-eyeDX+dir*r*0.04, eyeY, r*0.17, r*0.20,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(eyeDX+dir*r*0.04, eyeY, r*0.17, r*0.20,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(-eyeDX+dir*r*0.04+r*0.05, eyeY-r*0.06, r*0.05,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(eyeDX+dir*r*0.04+r*0.05, eyeY-r*0.06, r*0.05,0,Math.PI*2); ctx.fill();
    }

    // beak (or, during the fireball wind-up, an open beak baring a grin of white teeth)
    if(charState==='fireball_grin'){
      const gt = clamp((now-fireballGrinStart)/FIREBALL_GRIN_DURATION, 0, 1);
      const openAmt = Math.sin(Math.min(1, gt/0.35)*Math.PI/2); // snaps open quickly, holds
      const teethH = r*0.05 + openAmt*r*0.10;
      // upper mandible
      ctx.fillStyle = '#F2994A';
      ctx.beginPath();
      ctx.moveTo(-r*0.34, r*0.20);
      ctx.lineTo(r*0.34, r*0.20);
      ctx.lineTo(0, r*0.17);
      ctx.closePath(); ctx.fill();
      // white teeth row
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath(); ctx.rect(-r*0.28, r*0.20, r*0.56, teethH); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = r*0.018;
      for(let ti=-2; ti<=2; ti++){
        ctx.beginPath();
        ctx.moveTo(ti*r*0.112, r*0.20);
        ctx.lineTo(ti*r*0.112, r*0.20+teethH);
        ctx.stroke();
      }
      // lower mandible, drops open
      ctx.fillStyle = '#F2994A';
      ctx.beginPath();
      ctx.moveTo(-r*0.30, r*0.20+teethH);
      ctx.lineTo(r*0.30, r*0.20+teethH);
      ctx.lineTo(0, r*0.20+teethH + r*0.16 + openAmt*r*0.14);
      ctx.closePath(); ctx.fill();
    } else {
      ctx.fillStyle = '#F2994A';
      ctx.beginPath();
      ctx.moveTo(-r*0.14, r*0.28);
      ctx.lineTo(r*0.14, r*0.28);
      ctx.lineTo(0, r*0.48);
      ctx.closePath(); ctx.fill();
    }

    // seasonal outfit accessory (matches the current background zone) - drawn clear of the
    // top-center head area so it never clashes with the steel-helmet power-up drawn after it
    drawZoneOutfit(r, currentZoneIdx(height));

    // steel helmet (shield power-up, worn on head - color upgrades as it stacks)
    if(helmetLevel>=1){
      drawHelmetOnHead(r, helmetLevel, now);
    }
    drawCostume(r);

    ctx.restore();
  }

  // ---------- ninja character (selectable alternate to the default bird) ----------
  // ultimate: "그림자 질주" (shadow dash) - orbiting shadow clones instead of a flame aura,
  // triggered the same way as the bird's fireball (3 stacked helmets -> grin -> ultimate)
  function drawNinjaShadowClones(r, now){
    ctx.save();
    const glow = ctx.createRadialGradient(0,0,r*0.3,0,0,r*1.7);
    glow.addColorStop(0,'rgba(90,70,140,0.55)'); glow.addColorStop(1,'rgba(90,70,140,0)');
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(0,0,r*1.7,0,Math.PI*2); ctx.fill();
    ctx.restore();
    const count = 3;
    for(let i=0;i<count;i++){
      const ang = now/240 + i*(Math.PI*2/count);
      const cx = Math.cos(ang)*r*1.55, cy = Math.sin(ang)*r*1.55*0.55;
      ctx.save();
      ctx.globalAlpha = 0.38;
      ctx.translate(cx,cy);
      ctx.scale(0.6,0.6);
      ctx.fillStyle = '#20222E';
      ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
  }

  function drawCharacterNinja(x,y,scale,rot,now){
    const isFlashing = now < invincibleUntil && Math.floor(now/90)%2===0;
    const sinceLand = now-landTime;
    let squash = 1, squashY = 1;
    if(sinceLand>=0 && sinceLand<260){
      const p = sinceLand/260;
      const wob = Math.sin(p*Math.PI)*(1-p);
      squash = 1+wob*0.18; squashY = 1-wob*0.18;
    }
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(rot);
    ctx.scale(scale*squash, scale*squashY);

    const r = charRadius;
    const skin = currentSkin();

    // shadow
    ctx.save();
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(0, r*1.15, r*0.9, r*0.28, 0,0,Math.PI*2); ctx.fill();
    ctx.restore();

    // ultimate: shadow-clone burst instead of the bird's flame aura
    if(charState==='fireball'){
      drawNinjaShadowClones(r, now);
    }

    // feet (only when resting on a pillar)
    if(charState==='resting'){
      ctx.fillStyle = '#1C1E29';
      ctx.beginPath(); ctx.ellipse(-r*0.32, r*0.92, r*0.2, r*0.12, 0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(r*0.32, r*0.92, r*0.2, r*0.12, 0,0,Math.PI*2); ctx.fill();
    }

    // headband ribbon (ninja's equivalent slot to the bird's wing)
    const dir = charState!=='resting' ? travelDir : 0;
    ctx.fillStyle = skin.headband;
    ctx.save();
    ctx.translate(-r*0.75 - dir*r*0.1, -r*0.15);
    ctx.rotate(-dir*0.4);
    ctx.beginPath();
    ctx.moveTo(0,-r*0.12); ctx.lineTo(-r*0.55, r*0.05); ctx.lineTo(-r*0.1, r*0.28);
    ctx.closePath(); ctx.fill();
    ctx.restore();

    // body (hood + gi, one blob matching the bird's proportions)
    ctx.fillStyle = isFlashing ? '#FFFFFF' : skin.body;
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();

    // eye-slit skin band across the middle of the hood
    if(!isFlashing){
      ctx.save();
      ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.clip();
      ctx.fillStyle = '#E8C9A0';
      ctx.fillRect(-r, -r*0.24, r*2, r*0.26);
      ctx.restore();
    }

    // sash / belt accent
    ctx.fillStyle = skin.headband;
    ctx.beginPath(); ctx.ellipse(0, r*0.62, r*0.72, r*0.16, 0,0,Math.PI*2); ctx.fill();

    // eyes
    const eyeY = -r*0.1;
    const eyeDX = r*0.34;

  // ---------- spider-hero character ----------
  // ultimate: "웹 스윙" (web swing) - a trailing web-strand + web-burst ring instead of a flame aura
  function drawSpiderWebAura(r, now){
    ctx.save();
    const glow = ctx.createRadialGradient(0,0,r*0.3,0,0,r*1.6);
    glow.addColorStop(0,'rgba(220,230,255,0.5)'); glow.addColorStop(1,'rgba(220,230,255,0)');
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(0,0,r*1.6,0,Math.PI*2); ctx.fill();
    ctx.restore();
    // trailing web strand streaming behind the travel direction
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.lineWidth = r*0.05; ctx.lineCap='round';
    ctx.beginPath();
    for(let i=0;i<=10;i++){
      const t = i/10;
      const wx = -travelDir*r*1.9*t;
      const wy = Math.sin(now/110 + t*7)*r*0.22*t;
      if(i===0) ctx.moveTo(wx,wy); else ctx.lineTo(wx,wy);
    }
    ctx.stroke();
    ctx.restore();
    // pulsing web-burst ring
    const ringP = (now%700)/700;
    ctx.save();
    ctx.globalAlpha = 1-ringP;
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.lineWidth = r*0.04;
    ctx.beginPath(); ctx.arc(0,0,r*(1+ringP*0.7),0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  function drawCharacterSpider(x,y,scale,rot,now){
    const isFlashing = now < invincibleUntil && Math.floor(now/90)%2===0;
    const sinceLand = now-landTime;
    let squash = 1, squashY = 1;
    if(sinceLand>=0 && sinceLand<260){
      const p = sinceLand/260;
      const wob = Math.sin(p*Math.PI)*(1-p);
      squash = 1+wob*0.18; squashY = 1-wob*0.18;
    }
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(rot);
    ctx.scale(scale*squash, scale*squashY);

    const r = charRadius;
    const skin = currentSkin();

    // shadow

    ctx.globalAlpha = 0.18;
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(0, r*1.15, r*0.9, r*0.28, 0,0,Math.PI*2); ctx.fill();
    ctx.restore();

    if(charState==='fireball'){
      drawSpiderWebAura(r, now);

    // feet (only when resting on a pillar)

    }

    // angular shoulder/side panel (spider's equivalent slot to the bird's wing)
    ctx.fillStyle = skin.wing;
    ctx.beginPath();
    ctx.moveTo(-r*0.95, -r*0.1);
    ctx.lineTo(-r*0.45, -r*0.55);
    ctx.lineTo(-r*0.35, r*0.15);

    // body (masked head, one blob matching the bird's proportions)
    ctx.fillStyle = isFlashing ? '#FFFFFF' : skin.body;
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();

    // web-pattern lines across the mask
    if(!isFlashing){
      ctx.save();
      ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.clip();
      ctx.strokeStyle = skin.web; ctx.lineWidth = r*0.028; ctx.globalAlpha = 0.55;

        ctx.beginPath();

      for(let i=-1;i<=1;i++){

      ctx.strokeStyle = skin.web; ctx.lineWidth = r*0.07; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(-eyeDX-r*0.16,eyeY); ctx.lineTo(-eyeDX+r*0.16,eyeY); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(eyeDX-r*0.16,eyeY); ctx.lineTo(eyeDX+r*0.16,eyeY); ctx.stroke();
    } else {
      const dir = charState!=='resting' ? travelDir : 0;

  // ---------- seasonal character outfit (matches the current zone) ----------
  function drawZoneOutfit(r, zoneIdx){
    if(zoneIdx===0){ // spring: flower clip beside the head
      ctx.save(); ctx.translate(r*0.62, -r*0.78);
      ctx.fillStyle = '#FF6FA5';
      for(let i=0;i<5;i++){
        ctx.save(); ctx.rotate(i*(Math.PI*2/5));
        ctx.beginPath(); ctx.ellipse(0,-r*0.11,r*0.075,r*0.11,0,0,Math.PI*2); ctx.fill();
        ctx.restore();
      }
      ctx.fillStyle = '#FFE477';
      ctx.beginPath(); ctx.arc(0,0,r*0.06,0,Math.PI*2); ctx.fill();
      ctx.restore();
    } else if(zoneIdx===1){ // summer: sunglasses
      ctx.save();
      ctx.fillStyle = 'rgba(40,40,50,0.88)';
      ctx.beginPath(); ctx.ellipse(-r*0.36,-r*0.08,r*0.19,r*0.15,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(r*0.36,-r*0.08,r*0.19,r*0.15,0,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(40,40,50,0.88)'; ctx.lineWidth = r*0.05;
      ctx.beginPath(); ctx.moveTo(-r*0.17,-r*0.08); ctx.lineTo(r*0.17,-r*0.08); ctx.stroke();
      ctx.restore();
    } else if(zoneIdx===2){ // autumn: striped scarf
      ctx.save();
      ctx.fillStyle = '#D1492E';
      ctx.beginPath(); ctx.ellipse(0,r*0.34,r*0.62,r*0.16,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#F2A33D';
      for(let i=-2;i<=2;i++){ ctx.beginPath(); ctx.ellipse(i*r*0.2,r*0.34,r*0.07,r*0.13,0,0,Math.PI*2); ctx.fill(); }
      ctx.fillStyle = '#D1492E';
      ctx.beginPath(); ctx.moveTo(r*0.3,r*0.4); ctx.lineTo(r*0.5,r*0.85); ctx.lineTo(r*0.32,r*0.82); ctx.closePath(); ctx.fill();
      ctx.restore();
    } else if(zoneIdx===3){ // winter: scarf + earmuffs
      ctx.save();
      ctx.fillStyle = '#3F7FC4';

      ctx.beginPath(); ctx.arc(r*0.95,-r*0.35,r*0.16,0,Math.PI*2); ctx.fill();
      ctx.restore();
    } else { // space: spacesuit collar + tiny antenna
      ctx.save();
      ctx.strokeStyle = 'rgba(220,230,255,0.9)'; ctx.lineWidth = r*0.12;
      ctx.beginPath(); ctx.ellipse(0,r*0.42,r*0.68,r*0.14,0,Math.PI*1.08,Math.PI*1.92); ctx.stroke();

  function drawHelmetOnHead(r, level, now){
    const lvl2 = level>=2;
    const grad = ctx.createLinearGradient(-r*0.9,-r*1.05,r*0.9,-r*0.2);
    if(lvl2){
      grad.addColorStop(0,'#FFF3C4');
      grad.addColorStop(0.5,'#FFC94D');
      grad.addColorStop(1,'#FF8A3D');
    } else {
      grad.addColorStop(0,'#EEF2F5');
      grad.addColorStop(0.5,'#B9C4CC');
      grad.addColorStop(1,'#8993A0');
    }
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(-r*0.95, -r*0.22);
    ctx.quadraticCurveTo(-r*0.95, -r*1.18, 0, -r*1.15);
    ctx.quadraticCurveTo(r*0.95, -r*1.18, r*0.95, -r*0.22);
    ctx.quadraticCurveTo(0, -r*0.36, -r*0.95, -r*0.22);
    ctx.closePath();
    ctx.fill();
    // brim
    ctx.fillStyle = lvl2 ? '#C9781E' : '#7B8794';
    roundRect(-r*1.02, -r*0.28, r*2.04, r*0.16, r*0.08);
    ctx.fill();
    // rivets
    ctx.fillStyle = lvl2 ? '#8A4A0F' : '#5B6572';
    ctx.beginPath(); ctx.arc(-r*0.6,-r*0.75,r*0.06,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(r*0.6,-r*0.75,r*0.06,0,Math.PI*2); ctx.fill();
    // shine
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath(); ctx.ellipse(-r*0.32,-r*0.82,r*0.22,r*0.13,-0.4,0,Math.PI*2); ctx.fill();
    // level-2 glow ring, hinting the next catch triggers the ultimate
    if(lvl2){
      ctx.save();
      ctx.globalAlpha = 0.5+Math.sin((now||0)/150)*0.15;
      ctx.strokeStyle = '#FFD93D';
      ctx.lineWidth = r*0.09;
      ctx.beginPath(); ctx.arc(0,-r*0.65,r*0.78,0,Math.PI*2); ctx.stroke();
      ctx.restore();
    }
  }

    ctx.beginPath(); ctx.arc(r*0.55,r*0.55,r*0.05,0,Math.PI*2); ctx.fill();

    // charging fists during the ultimate wind-up (replaces the bird's grin/teeth)
    if(charState==='fireball_grin'){

  // ---------- dinosaur character ----------

  function drawRestRing(now){
    if(state!=='playing' || charState!=='resting') return;
    const remain = clamp((restDeadline-now)/1000, 0, 999);

    if(frac > 0.55) return; // only warn once time is running low

  // the friend character (falls as a pickup, then rides along during the encounter) - colors depend on variant

  // big "shout" text popup (호야!, 짝! etc.) - pops in with a bounce, fades out
  function drawShout(now){
    if(now > shoutUntil || !shoutText) return;
    const total = shoutUntil-shoutStart || 1;
    const t = clamp((now-shoutStart)/total, 0, 1);
    const pop = t<0.25 ? (t/0.25) : 1;
    const fade = t>0.7 ? 1-(t-0.7)/0.3 : 1;
    const scale = 0.5+pop*0.65 - (t>0.25 ? Math.min(0.15,(t-0.25)*0.3) : 0);
    ctx.save();
    ctx.translate(charX, charY - charRadius*1.9);
    ctx.scale(scale, scale);
    ctx.globalAlpha = fade;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `${Math.round(W*0.11)}px 'Jua', sans-serif`;
    ctx.lineWidth = W*0.02;
    ctx.strokeStyle = '#3A2A1A';
    ctx.strokeText(shoutText,0,0);
    ctx.fillStyle = shoutColor;
    ctx.fillText(shoutText,0,0);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function drawFlash(now){
    if(now > flashUntil) return;
    const total = flashUntil-flashStart || 1;
    const p = clamp(1-(now-flashStart)/total, 0, 1);
    ctx.save();
    ctx.globalAlpha = p*0.55;
    ctx.fillStyle = flashColor;
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }

  // pulsing red edge vignette while down to the last heart - paired with sfxHeartbeat/vibrate in update()
  function drawDangerVignette(now){
    if(state!=='playing' || hp!==1) return;
    const pulse = 0.5+0.5*Math.sin(now/280);
    const alpha = 0.16+0.22*pulse;
    ctx.save();
    const g = ctx.createRadialGradient(W/2,H/2,H*0.32, W/2,H/2,H*0.72);
    g.addColorStop(0,'rgba(255,20,20,0)');
    g.addColorStop(1,'rgba(255,20,20,'+alpha.toFixed(3)+')');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
    // colorblind-friendly mode: a pulsing white border - a shape/motion cue that
    // doesn't rely on distinguishing red from the background hue
    if(colorblindMode){
      ctx.globalAlpha = 0.35+0.35*pulse;
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = H*0.012;
      ctx.strokeRect(ctx.lineWidth/2, ctx.lineWidth/2, W-ctx.lineWidth, H-ctx.lineWidth);
    }
    ctx.restore();
  }

  // ---------- seasonal obstacle skins: 'drop'/'leaf'/'boulder'/'lightning' reskin per zone ----------

  function drawObstacleLeaf(r, zoneIdx){
