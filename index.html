<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>하늘에 닿고 싶어</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  * { -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #05061a;
    font-family: 'Jua', sans-serif;
    overscroll-behavior: none;
  }
  #outer {
    width: 100vw; height: 100dvh; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #05061a;
  }
  #gameContainer {
    position: relative;
    width: 100%; height: 100%;
    max-width: 480px;
    max-height: 900px;
    margin: 0 auto;
    overflow: hidden;
    box-shadow: 0 0 60px rgba(0,0,0,0.6);
    background: #000;
    display: flex;
    flex-direction: column;
  }
  /* ===== 최상단 광고 배너 슬롯 ===== */
  #adBanner {
    flex: 0 0 auto;
    height: clamp(52px, 8.5%, 92px);
    width: 100%;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    background:
      repeating-linear-gradient(45deg, #f3f5f9 0 12px, #eaeef4 12px 24px);
    border-bottom: 2px solid rgba(0,0,0,0.12);
  }
  /* 실제 광고(AdSense 등)를 넣으면 이 안내가 가려집니다 */
  #adBanner .ad-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    color: #8a94a3;
    text-align: center;
    line-height: 1.2;
    pointer-events: none;
  }
  #adBanner .ad-placeholder .ad-title {
    font-size: clamp(12px, 3.4vw, 16px);
    letter-spacing: 0.5px;
  }
  #adBanner .ad-placeholder .ad-size {
    font-size: clamp(9px, 2.4vw, 11px);
    color: #aab2bf;
  }
  #adBanner .ad-chip {
    position: absolute;
    top: 5px; left: 6px;
    background: rgba(0,0,0,0.32);
    color: #fff;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 5px;
    letter-spacing: 0.5px;
    pointer-events: none;
  }
  #adSlot { display: flex; align-items: center; justify-content: center; }
  #adSlot:empty { display: none; }
  /* 실제 광고가 삽입되면 안내 문구는 자동으로 숨김 */
  #adBanner:has(#adSlot:not(:empty)) .ad-placeholder { display: none; }
  #adBanner:has(#adSlot:not(:empty)) { background: #fff; }
  #gameArea {
    position: relative;
    flex: 1 1 auto;
    width: 100%;
    min-height: 0;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
</style>
</head>
<body>
<div id="outer">
  <div id="gameContainer">
    <!-- ===================================================================
         광고 배너 영역 (Ad banner slot)
         실제 광고를 넣으려면 아래 <div id="adSlot"> 안에 광고 네트워크
         스크립트/태그를 붙여넣으세요. 예) Google AdSense:

         <div id="adSlot">
           <ins class="adsbygoogle"
                style="display:inline-block;width:320px;height:50px"
                data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
                data-ad-slot="XXXXXXXXXX"></ins>
           <script>(adsbygoogle = window.adsbygoogle || []).push({});<\/script>
         </div>

         adSlot에 내용이 채워지면 아래 안내(.ad-placeholder)는 자동으로
         가려지고 광고가 그 자리에 표시됩니다.
    ==================================================================== -->
    <div id="adBanner">
      <span class="ad-chip">AD</span>
      <div id="adSlot"></div>
      <div class="ad-placeholder">
        <div class="ad-title">광고 배너 영역</div>
        <div class="ad-size">여기에 광고가 표시됩니다 (권장 320×50)</div>
      </div>
    </div>
    <div id="gameArea">
      <canvas id="gameCanvas"></canvas>
    </div>
  </div>
</div>
<script>
(function(){
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const container = document.getElementById('gameContainer');
  const gameArea = document.getElementById('gameArea');

  // ---------- utility ----------
  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
  function lerp(a,b,t){ return a+(b-a)*t; }
  function randRange(a,b){ return a+Math.random()*(b-a); }
  function hexToRgb(hex){
    const n = parseInt(hex.slice(1),16);
    return [(n>>16)&255,(n>>8)&255,n&255];
  }
  function lerpColorHex(h1,h2,t){
    const a=hexToRgb(h1), b=hexToRgb(h2);
    const r=Math.round(lerp(a[0],b[0],t));
    const g=Math.round(lerp(a[1],b[1],t));
    const bl=Math.round(lerp(a[2],b[2],t));
    return `rgb(${r},${g},${bl})`;
  }

  // ---------- layout ----------
  let W=0,H=0,DPR=1;
  let charRadius=24, restY=0, jumpPeak=100, scrollSpeed=40;
  let pillarLeftX=0, pillarRightX=0; // live, from gapWidth
  let gapWidth=200, gapTarget=200, gapWidthMin=100, gapWidthMax=260;

  function currentLeftX(){ return pillarLeftX + charRadius*0.25; }
  function currentRightX(){ return pillarRightX - charRadius*0.25; }

  function resize(){
    const rect = gameArea.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio||1, 2.5);
    W = rect.width; H = rect.height;
    canvas.width = Math.round(W*DPR);
    canvas.height = Math.round(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);

    charRadius = W*0.055;
    restY = H*0.60;
    jumpPeak = H*0.16;
    scrollSpeed = H*0.12;
    // gap is wide enough that a single jump can't cross it - two jumps are needed
    gapWidthMin = W*0.58;
    gapWidthMax = W*0.82;
    if(!gapTarget || gapTarget < gapWidthMin || gapTarget > gapWidthMax) gapTarget = (gapWidthMin+gapWidthMax)/2;
    gapWidth = gapTarget;
    pillarLeftX = (W-gapWidth)/2;
    pillarRightX = pillarLeftX+gapWidth;
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', ()=>setTimeout(resize,50));

  // ---------- audio ----------
  let actx=null;
  function ensureAudio(){
    if(!actx){
      try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
    } else if(actx.state==='suspended'){ actx.resume(); }
  }
  function beep(freq,dur,type,vol,delay){
    if(!actx) return;
    delay = delay||0; vol = vol==null?0.14:vol; type = type||'sine';
    const t0=actx.currentTime+delay;
    const osc=actx.createOscillator(), gain=actx.createGain();
    osc.type=type; osc.frequency.setValueAtTime(freq,t0);
    gain.gain.setValueAtTime(0,t0);
    gain.gain.linearRampToValueAtTime(vol,t0+0.012);
    gain.gain.exponentialRampToValueAtTime(0.001,t0+dur);
    osc.connect(gain); gain.connect(actx.destination);
    osc.start(t0); osc.stop(t0+dur+0.03);
  }
  function sfxJump(){ beep(520,0.09,'triangle',0.12); beep(760,0.07,'triangle',0.09,0.045); }
  function sfxLand(){ beep(210,0.09,'sine',0.10); }
  function sfxHit(){ beep(150,0.20,'sawtooth',0.15); beep(90,0.22,'square',0.08,0.03); }
  function sfxGameOver(){ beep(420,0.16,'sine',0.12,0); beep(320,0.16,'sine',0.12,0.16); beep(220,0.28,'sine',0.12,0.32); }
  function sfxStart(){ beep(440,0.09,'triangle',0.1); beep(660,0.09,'triangle',0.1,0.08); beep(880,0.12,'triangle',0.1,0.16); }
  function sfxUnlock(){ beep(660,0.08,'square',0.08); beep(990,0.1,'square',0.08,0.09); }
  function sfxFall(){ beep(300,0.12,'sine',0.1); beep(160,0.22,'sine',0.09,0.06); }
  function noiseBurst(dur,vol,delay,filterFreq){
    if(!actx) return;
    delay = delay||0; vol = vol==null?0.2:vol; filterFreq = filterFreq||1200;
    const t0 = actx.currentTime+delay;
    const bufferSize = Math.max(1,Math.floor(actx.sampleRate*dur));
    const buffer = actx.createBuffer(1, bufferSize, actx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1) * (1-i/bufferSize); }
    const src = actx.createBufferSource();
    src.buffer = buffer;
    const filter = actx.createBiquadFilter();
    filter.type='lowpass'; filter.frequency.setValueAtTime(filterFreq,t0);
    const gain = actx.createGain();
    gain.gain.setValueAtTime(vol,t0);
    gain.gain.exponentialRampToValueAtTime(0.001,t0+dur);
    src.connect(filter); filter.connect(gain); gain.connect(actx.destination);
    src.start(t0); src.stop(t0+dur+0.02);
  }
  function sfxExplode(){ noiseBurst(0.32,0.3,0,900); beep(90,0.2,'square',0.16,0); beep(55,0.28,'sine',0.12,0.02); }
  function sfxHeal(){ beep(660,0.09,'triangle',0.11); beep(880,0.09,'triangle',0.11,0.08); beep(1100,0.14,'triangle',0.12,0.16); }
  function sfxEquip(){ beep(200,0.08,'square',0.13); beep(520,0.07,'triangle',0.1,0.05); beep(920,0.09,'triangle',0.09,0.1); }

  // ---------- game state ----------
  let state = 'start'; // start | playing | gameover
  let hp=3, hpMax=3;
  let height=0, sessionBest=0, landings=0;
  let climbPerLanding = 3;
  let charSide = 'left';
  // charState: resting (safe, on a pillar) | jump1 (first hop, airborne) |
  // freefall (missed the window, falling under gravity, can still be rescued) |
  // jump2 (second hop, committed to landing) | dead (fall animation before game-over)
  let charState = 'resting';
  let charX=0, charY=0, charScale=1, charRot=0;
  let segFromX=0, segFromY=0, segToX=0, segToY=0, segStart=0, segDuration=420, segPeak=100;
  let travelDir=1; // +1 moving right, -1 moving left (persists through freefall)
  let targetSideAfterJump='right';
  let freefallVy=0;
  let restDeadline=0;
  let deathAt=-999;
  let gameOverReason='hp'; // 'hp' | 'fall'
  let landTime=-999;
  let invincibleUntil=0;
  let blinkAt=0, blinking=false, blinkUntil=0;
  let obstacles=[], particles=[];
  let nextSpawnAt=0;
  let bgScrollOffset=0;
  let obstacleUnlocked = {helmet:false, ad:false, leaf:false, boulder:false};
  let unlockToastText='', unlockToastUntil=0;
  let lastTime=0;
  let shakeUntil=0, shakeMag=0;
  let hasHelmet=false;

  function diffFactor(){ return clamp(landings/50,0,1); }
  function spawnIntervalBase(){ return lerp(1650,620,diffFactor()); }
  function obstacleSpeedBase(){ return lerp(H*0.28,H*0.60,diffFactor()); }
  function restTimeLimit(){ return lerp(3.4,1.9,diffFactor()); } // seconds allowed idle on a pillar

  function scheduleNextSpawn(now){
    const base = spawnIntervalBase();
    nextSpawnAt = now + base*(0.55+Math.random()*0.85);
  }

  function resetGame(){
    hp = hpMax; height = 0; landings = 0;
    obstacles = []; particles = [];
    obstacleUnlocked = {helmet:false, ad:false, leaf:false, boulder:false};
    hasHelmet = false;
    charSide = 'left'; charState='resting';
    invincibleUntil = 0; landTime=-999; deathAt=-999; gameOverReason='hp';
    gapTarget = (gapWidthMin+gapWidthMax)/2; gapWidth = gapTarget;
    pillarLeftX = (W-gapWidth)/2; pillarRightX = pillarLeftX+gapWidth;
    charX = currentLeftX(); charY = restY; charScale=1; charRot=0;
    blinkAt = performance.now()+randRange(1500,3500);
    restDeadline = performance.now() + restTimeLimit()*1000 + 1000; // extra grace at the very start
  }

  function startGame(){
    ensureAudio();
    resetGame();
    state = 'playing';
    sfxStart();
    nextSpawnAt = performance.now()+1600;
  }

  function triggerGameOver(){
    state='gameover';
    sessionBest = Math.max(sessionBest, height);
    sfxGameOver();
    shakeUntil = performance.now()+300; shakeMag = 10;
  }

  function enterFreefall(fromX, fromY){
    charState = 'freefall';
    charX = fromX; charY = fromY;
    freefallVy = H*0.55;
  }

  function idleTimeoutFall(now){
    targetSideAfterJump = charSide==='left' ? 'right' : 'left';
    travelDir = charSide==='left' ? 1 : -1;
    enterFreefall(charX, restY);
    sfxFall();
  }

  function triggerFallDeath(now){
    charState = 'dead';
    gameOverReason = 'fall';
    deathAt = now;
    shakeUntil = now+300; shakeMag = 8;
    sfxFall();
  }

  function beginJump1(now){
    const fromX = charSide==='left' ? currentLeftX() : currentRightX();
    const dirSign = charSide==='left' ? 1 : -1;
    const midRatio = randRange(0.44,0.58);
    const dist = gapWidth*midRatio;
    const toX = fromX + dirSign*dist;
    targetSideAfterJump = charSide==='left' ? 'right' : 'left';
    segFromX=fromX; segFromY=restY; segToX=toX; segToY=restY;
    segStart=now;
    segDuration = clamp(dist/(W*0.95)*1000, 260, 900);
    segPeak = jumpPeak;
    travelDir = dirSign;
    charState = 'jump1';
    sfxJump();
  }

  function beginJump2(now){
    const targetX = targetSideAfterJump==='left' ? currentLeftX() : currentRightX();
    const dist = Math.abs(targetX-charX);
    segFromX=charX; segFromY=charY; segToX=targetX; segToY=restY;
    segStart=now;
    segDuration = clamp(dist/(W*0.95)*1000, 220, 900);
    segPeak = jumpPeak*clamp(dist/(gapWidth*0.5), 0.5, 1.4);
    travelDir = targetX>charX ? 1 : -1;
    charState = 'jump2';
    sfxJump();
  }

  function tryJump(){
    ensureAudio();
    if(state==='start'){ startGame(); return; }
    if(state==='gameover'){ startGame(); return; }
    if(state!=='playing') return;
    const now = performance.now();
    if(charState==='resting'){
      beginJump1(now);
    } else if(charState==='jump1' || charState==='freefall'){
      beginJump2(now);
    }
    // jump2 or dead: input ignored, already committed
  }

  // ---------- obstacles ----------
  // damaging: drop, leaf, boulder. beneficial pickups: helmet (shield), ad (heal)
  function pickObstacleType(){
    const pool = [{t:'drop', w:5}];
    if(obstacleUnlocked.helmet) pool.push({t:'helmet', w:1.4});
    if(obstacleUnlocked.ad) pool.push({t:'ad', w:1.1});
    if(obstacleUnlocked.leaf) pool.push({t:'leaf', w:3});
    if(obstacleUnlocked.boulder) pool.push({t:'boulder', w:2});
    const total = pool.reduce((s,p)=>s+p.w,0);
    let r = Math.random()*total;
    for(const p of pool){ if(r<p.w) return p.t; r-=p.w; }
    return 'drop';
  }

  function obstacleRadius(type){
    if(type==='boulder') return W*0.075;
    if(type==='ad') return W*0.06;
    if(type==='helmet') return W*0.055;
    if(type==='leaf') return W*0.05;
    return W*0.045;
  }

  function spawnObstacle(){
    const type = pickObstacleType();
    const r = obstacleRadius(type);
    const margin = r+10;
    const usableW = Math.max(10, gapWidth-margin*2);
    const x = pillarLeftX+margin+Math.random()*usableW;
    const speedMul = type==='boulder' ? 0.72 : ((type==='helmet'||type==='ad') ? 0.8 : 1);
    const vy = obstacleSpeedBase()*(0.85+Math.random()*0.35)*speedMul;
    obstacles.push({
      type, x, baseX:x, y:-r-10, r, vy, age:0,
      amp: r*1.7, freq: 2+Math.random()*1.6, phase: Math.random()*Math.PI*2,
      rot:0, spin:(Math.random()<0.5?-1:1)*randRange(0.5,1.4)
    });
  }

  function spawnParticles(x,y,color,count,speedRange,life){
    for(let i=0;i<count;i++){
      const ang = Math.random()*Math.PI*2;
      const sp = randRange(speedRange[0],speedRange[1]);
      particles.push({
        x,y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp-sp*0.3,
        life:life, maxLife:life, color, r: randRange(2,5)
      });
    }
  }

  function hitObstacle(o){
    hp = Math.max(0,hp-1);
    invincibleUntil = performance.now()+950;
    spawnParticles(o.x,o.y,'#FFD93D',10,[60,180],0.5);
    sfxHit();
    shakeUntil = performance.now()+180; shakeMag = 6;
    if(hp<=0) triggerGameOver();
  }

  function equipHelmet(o){
    hasHelmet = true;
    spawnParticles(o.x,o.y,'#CBD3DA',10,[50,150],0.45);
    spawnParticles(charX, charY-charRadius, '#E8EEF2', 7, [30,100], 0.4);
    sfxEquip();
  }

  function healFromAd(o){
    hp = Math.min(hpMax, hp+1);
    spawnParticles(o.x,o.y,'#FF5C7A',10,[50,150],0.5);
    sfxHeal();
  }

  function destroyWithHelmet(o){
    hasHelmet = false;
    spawnParticles(o.x,o.y,'#FFB199',14,[80,220],0.55);
    spawnParticles(o.x,o.y,'#FFD93D',8,[60,180],0.45);
    sfxExplode();
    shakeUntil = performance.now()+150; shakeMag = 5;
  }

  function landCharacter(){
    landings++;
    height += climbPerLanding;
    sessionBest = Math.max(sessionBest, height);
    landTime = performance.now();
    spawnParticles(charX, restY+charRadius*0.6, '#C9A876', 6, [30,90], 0.4);
    sfxLand();
    if(landings % 10 === 0){
      gapTarget = randRange(gapWidthMin, gapWidthMax);
    }
    if(landings === 3 && !obstacleUnlocked.helmet){
      obstacleUnlocked.helmet = true;
      unlockToastText = '🛡️ 강철투구 등장!'; unlockToastUntil = performance.now()+2400;
      sfxUnlock();
    }
    if(landings === 5 && !obstacleUnlocked.ad){
      obstacleUnlocked.ad = true;
      unlockToastText = '📢 광고 캡슐 등장! HP+1'; unlockToastUntil = performance.now()+2400;
      sfxUnlock();
    }
    if(landings === 8 && !obstacleUnlocked.leaf){
      obstacleUnlocked.leaf = true;
      unlockToastText = '🍃 회오리 낙엽 등장!'; unlockToastUntil = performance.now()+2200;
      sfxUnlock();
    }
    if(landings === 18 && !obstacleUnlocked.boulder){
      obstacleUnlocked.boulder = true;
      unlockToastText = '🪨 큰 돌덩이 등장!'; unlockToastUntil = performance.now()+2200;
      sfxUnlock();
    }
  }

  // ---------- update ----------
  function update(dt, now){
    gapWidth += (gapTarget-gapWidth)*Math.min(1,dt*1.5);
    pillarLeftX = (W-gapWidth)/2;
    pillarRightX = pillarLeftX+gapWidth;
    bgScrollOffset += dt*scrollSpeed;

    // blink
    if(!blinking && now>blinkAt){ blinking=true; blinkUntil=now+120; }
    if(blinking && now>blinkUntil){ blinking=false; blinkAt = now+randRange(1800,4200); }

    if(state==='playing'){
      if(charState==='resting'){
        charX = charSide==='left' ? currentLeftX() : currentRightX();
        charY = restY + Math.sin(now/320)*2;
        charRot = 0; charScale = 1;
        const remain = (restDeadline-now)/1000, limit = restTimeLimit();
        if(remain < limit*0.2 && remain>0){
          const shake = 1-remain/(limit*0.2);
          charX += (Math.random()*2-1)*shake*3;
        }
        if(now > restDeadline){
          idleTimeoutFall(now);
        }
      } else if(charState==='jump1'){
        const t = Math.min(1,(now-segStart)/segDuration);
        charX = lerp(segFromX, segToX, t);
        charY = restY - Math.sin(t*Math.PI)*segPeak;
        charRot = Math.sin(t*Math.PI)*0.32*travelDir;
        charScale = 1 + Math.sin(t*Math.PI)*0.06;
        if(t>=1){
          enterFreefall(segToX, restY);
        }
      } else if(charState==='freefall'){
        freefallVy += H*2.4*dt;
        charY += freefallVy*dt;
        const targetX = targetSideAfterJump==='left' ? currentLeftX() : currentRightX();
        charX += (targetX-charX)*Math.min(1,dt*0.8);
        charRot += dt*5*travelDir;
        charScale = 1;
        if(charY > H + charRadius*2.2){
          triggerFallDeath(now);
        }
      } else if(charState==='jump2'){
        const t = Math.min(1,(now-segStart)/segDuration);
        charX = lerp(segFromX, segToX, t);
        charY = lerp(segFromY, segToY, t) - Math.sin(t*Math.PI)*segPeak;
        charRot = Math.sin(t*Math.PI)*0.32*travelDir;
        charScale = 1 + Math.sin(t*Math.PI)*0.06;
        if(t>=1){
          charSide = targetSideAfterJump;
          charX = charSide==='left' ? currentLeftX() : currentRightX();
          charY = restY; charRot = 0; charScale = 1;
          charState = 'resting';
          restDeadline = now + restTimeLimit()*1000;
          landCharacter();
        }
      } else if(charState==='dead'){
        freefallVy += H*2.4*dt;
        charY += freefallVy*dt;
        charRot += dt*5*travelDir;
        if(now-deathAt>500){
          triggerGameOver();
        }
      }

      if(now>=nextSpawnAt){ spawnObstacle(); scheduleNextSpawn(now); }

      const vulnerable = (charState==='jump1' || charState==='freefall' || charState==='jump2');
      for(let i=obstacles.length-1;i>=0;i--){
        const o=obstacles[i];
        o.age += dt;
        o.y += o.vy*dt;
        if(o.type==='leaf'){
          o.x = o.baseX + Math.sin(o.age*o.freq+o.phase)*o.amp;
          o.rot = Math.sin(o.age*o.freq+o.phase)*0.7;
        } else if(o.type==='boulder'){
          o.rot += dt*o.spin*0.3;
        } else if(o.type==='helmet'){
          o.rot += dt*o.spin*0.35;
        } else if(o.type==='ad'){
          o.rot = Math.sin(o.age*2.2+o.phase)*0.08;
        } else {
          o.rot += dt*o.spin;
        }
        if(o.y - o.r > H){ obstacles.splice(i,1); continue; }
        if(vulnerable){
          const dist = Math.hypot(charX-o.x, charY-o.y);
          if(dist < charRadius*0.72 + o.r*0.72){
            if(o.type==='ad'){
              healFromAd(o);
              obstacles.splice(i,1);
              continue;
            } else if(o.type==='helmet'){
              equipHelmet(o);
              obstacles.splice(i,1);
              continue;
            } else if(hasHelmet){
              destroyWithHelmet(o);
              obstacles.splice(i,1);
              continue;
            } else if(now>=invincibleUntil){
              hitObstacle(o);
              obstacles.splice(i,1);
              continue;
            }
          }
        }
      }
    }

    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];
      p.life -= dt;
      if(p.life<=0){ particles.splice(i,1); continue; }
      p.x += p.vx*dt; p.y += p.vy*dt;
      p.vy += 220*dt;
    }
  }

  // ---------- drawing helpers ----------
  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }
  function heart(cx,cy,s){
    ctx.beginPath();
    ctx.moveTo(cx, cy+s*0.3);
    ctx.bezierCurveTo(cx-s, cy-s*0.6, cx-s*1.6, cy+s*0.35, cx, cy+s*1.15);
    ctx.bezierCurveTo(cx+s*1.6, cy+s*0.35, cx+s, cy-s*0.6, cx, cy+s*0.3);
    ctx.closePath();
  }

  const skyStops = [
    {t:0.00, top:'#6EC6FF', bot:'#DFF6FF'},
    {t:0.25, top:'#FFB199', bot:'#FFE0C8'},
    {t:0.50, top:'#5B4B8A', bot:'#A98BC9'},
    {t:0.75, top:'#171A45', bot:'#3A3F7A'},
    {t:1.00, top:'#05061A', bot:'#10123B'}
  ];
  function skyColors(t){
    t = clamp(t,0,1);
    for(let i=0;i<skyStops.length-1;i++){
      const a=skyStops[i], b=skyStops[i+1];
      if(t>=a.t && t<=b.t){
        const lt = (t-a.t)/(b.t-a.t||1);
        return { top: lerpColorHex(a.top,b.top,lt), bot: lerpColorHex(a.bot,b.bot,lt) };
      }
    }
    return { top: skyStops[skyStops.length-1].top, bot: skyStops[skyStops.length-1].bot };
  }

  let starField = null;
  function ensureStars(){
    if(starField) return starField;
    starField = [];
    for(let i=0;i<48;i++){
      starField.push({ xf: Math.random(), yf: Math.random(), r: randRange(0.6,2.0), ph: Math.random()*Math.PI*2, spd: randRange(0.5,1.3) });
    }
    return starField;
  }
  let cloudField = null;
  function ensureClouds(){
    if(cloudField) return cloudField;
    cloudField = [];
    for(let i=0;i<6;i++){
      cloudField.push({ xf: Math.random(), yf: Math.random(), s: randRange(0.5,1.1), spd: randRange(0.25,0.5) });
    }
    return cloudField;
  }

  function drawBackground(now){
    const st = clamp(height/1500,0,1);
    const col = skyColors(st);
    const grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0, col.top); grad.addColorStop(1, col.bot);
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    // stars fade in during later stages
    const starAlpha = clamp((st-0.45)/0.55,0,1);
    if(starAlpha>0.01){
      const stars = ensureStars();
      ctx.save();
      for(const s of stars){
        const y = ((s.yf*H) + bgScrollOffset*0.25*s.spd) % (H+20) - 10;
        const x = s.xf*W;
        const tw = 0.55+0.45*Math.sin(now/500*s.spd + s.ph);
        ctx.globalAlpha = starAlpha*tw;
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath(); ctx.arc(x,y,s.r,0,Math.PI*2); ctx.fill();
      }
      ctx.restore();
    }

    // clouds fade out at higher stages
    const cloudAlpha = clamp(1-(st-0.35)/0.4,0.08,0.85);
    const clouds = ensureClouds();
    ctx.save();
    ctx.globalAlpha = cloudAlpha;
    for(const c of clouds){
      const y = ((c.yf*H) + bgScrollOffset*0.4*c.spd) % (H+120) - 60;
      const x = c.xf*W;
      drawCloud(x,y,c.s*W*0.16);
    }
    ctx.restore();
  }

  function drawCloud(x,y,s){
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.ellipse(x,y,s,s*0.55,0,0,Math.PI*2);
    ctx.ellipse(x+s*0.6,y+s*0.1,s*0.65,s*0.4,0,0,Math.PI*2);
    ctx.ellipse(x-s*0.6,y+s*0.15,s*0.55,s*0.35,0,0,Math.PI*2);
    ctx.fill();
  }

  function drawPillars(now){
    const w = pillarLeftX;
    drawPillar(0, w, true);
    drawPillar(W-w, w, false);
  }
  function drawPillar(x0, w, isLeft){
    const grad = ctx.createLinearGradient(x0,0,x0+w,0);
    grad.addColorStop(0, isLeft? '#9BE8CF' : '#7FD8C2');
    grad.addColorStop(1, isLeft? '#6FCBB2' : '#8DE4CD');
    ctx.fillStyle = grad;
    ctx.fillRect(x0,0,w,H);

    // scrolling stripe blocks
    const blockH = 76;
    const off = bgScrollOffset % blockH;
    ctx.save();
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = '#3E9C82';
    for(let y=-blockH+off; y<H+blockH; y+=blockH){
      roundRect(x0+w*0.12, y+8, w*0.76, blockH*0.45, 10);
      ctx.fill();
    }
    ctx.restore();

    // inner glowing rail
    const railX = isLeft ? x0+w : x0;
    const railGrad = ctx.createLinearGradient(railX-6,0,railX+6,0);
    railGrad.addColorStop(0,'rgba(255,255,255,0)');
    railGrad.addColorStop(0.5,'rgba(255,255,255,0.55)');
    railGrad.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle = railGrad;
    ctx.fillRect(railX-6,0,12,H);
  }

  function drawCharacter(x,y,scale,rot,now){
    const isFlashing = now < invincibleUntil && Math.floor(now/90)%2===0;
    const sinceLand = now-landTime;
    let squash = 1, squashY = 1;
    if(sinceLand>=0 && sinceLand<260){
      const p = sinceLand/260;
      const wob = Math.sin(p*Math.PI)*(1-p);
      squash = 1+wob*0.18; squashY = 1-wob*0.18;
    }
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(rot);
    ctx.scale(scale*squash, scale*squashY);

    const r = charRadius;
    // shadow
    ctx.save();
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(0, r*1.15, r*0.9, r*0.28, 0,0,Math.PI*2); ctx.fill();
    ctx.restore();

    // feet (only when resting on a pillar)
    if(charState==='resting'){
      ctx.fillStyle = '#F2994A';
      ctx.beginPath(); ctx.ellipse(-r*0.35, r*0.92, r*0.22, r*0.13, 0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(r*0.35, r*0.92, r*0.22, r*0.13, 0,0,Math.PI*2); ctx.fill();
    }

    // wing
    ctx.fillStyle = '#F2A93B';
    ctx.beginPath();
    ctx.ellipse(-r*0.75, r*0.05, r*0.45, r*0.62, -0.5, 0, Math.PI*2);
    ctx.fill();

    // body
    ctx.fillStyle = isFlashing ? '#FFFFFF' : '#FFC947';
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();

    // blush
    ctx.fillStyle = 'rgba(255,120,120,0.55)';
    ctx.beginPath(); ctx.ellipse(-r*0.5, r*0.18, r*0.16, r*0.1, 0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(r*0.5, r*0.18, r*0.16, r*0.1, 0,0,Math.PI*2); ctx.fill();

    // eyes
    const eyeY = -r*0.08;
    const eyeDX = r*0.36;
    if(blinking){
      ctx.strokeStyle = '#3A2A1A'; ctx.lineWidth = r*0.08; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(-eyeDX-r*0.14,eyeY); ctx.lineTo(-eyeDX+r*0.14,eyeY); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(eyeDX-r*0.14,eyeY); ctx.lineTo(eyeDX+r*0.14,eyeY); ctx.stroke();
    } else {
      const dir = charState!=='resting' ? travelDir : 0;
      ctx.fillStyle = '#3A2A1A';
      ctx.beginPath(); ctx.ellipse(-eyeDX+dir*r*0.04, eyeY, r*0.17, r*0.20,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(eyeDX+dir*r*0.04, eyeY, r*0.17, r*0.20,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(-eyeDX+dir*r*0.04+r*0.05, eyeY-r*0.06, r*0.05,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(eyeDX+dir*r*0.04+r*0.05, eyeY-r*0.06, r*0.05,0,Math.PI*2); ctx.fill();
    }

    // beak
    ctx.fillStyle = '#F2994A';
    ctx.beginPath();
    ctx.moveTo(-r*0.14, r*0.28);
    ctx.lineTo(r*0.14, r*0.28);
    ctx.lineTo(0, r*0.48);
    ctx.closePath(); ctx.fill();

    // steel helmet (shield power-up, worn on head)
    if(hasHelmet){
      drawHelmetOnHead(r);
    }

    ctx.restore();
  }

  function drawHelmetOnHead(r){
    const grad = ctx.createLinearGradient(-r*0.9,-r*1.05,r*0.9,-r*0.2);
    grad.addColorStop(0,'#EEF2F5');
    grad.addColorStop(0.5,'#B9C4CC');
    grad.addColorStop(1,'#8993A0');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(-r*0.95, -r*0.22);
    ctx.quadraticCurveTo(-r*0.95, -r*1.18, 0, -r*1.15);
    ctx.quadraticCurveTo(r*0.95, -r*1.18, r*0.95, -r*0.22);
    ctx.quadraticCurveTo(0, -r*0.36, -r*0.95, -r*0.22);
    ctx.closePath();
    ctx.fill();
    // brim
    ctx.fillStyle = '#7B8794';
    roundRect(-r*1.02, -r*0.28, r*2.04, r*0.16, r*0.08);
    ctx.fill();
    // rivets
    ctx.fillStyle = '#5B6572';
    ctx.beginPath(); ctx.arc(-r*0.6,-r*0.75,r*0.06,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(r*0.6,-r*0.75,r*0.06,0,Math.PI*2); ctx.fill();
    // shine
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath(); ctx.ellipse(-r*0.32,-r*0.82,r*0.22,r*0.13,-0.4,0,Math.PI*2); ctx.fill();
  }

  function drawRestRing(now){
    if(state!=='playing' || charState!=='resting') return;
    const remain = clamp((restDeadline-now)/1000, 0, 999);
    const limit = restTimeLimit();
    const frac = clamp(remain/limit, 0, 1);
    if(frac > 0.55) return; // only warn once time is running low
    const r = charRadius*1.4;
    ctx.save();
    ctx.translate(charX, charY);
    ctx.rotate(-Math.PI/2);
    ctx.strokeStyle = frac>0.28 ? 'rgba(255,214,10,0.85)' : 'rgba(255,70,70,0.9)';
    ctx.lineWidth = charRadius*0.13;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(0,0,r,0, Math.PI*2*frac);
    ctx.stroke();
    ctx.restore();
  }

  function drawObstacle(o){
    ctx.save();
    ctx.translate(o.x,o.y);
    ctx.rotate(o.rot||0);
    if(o.type==='drop'){
      ctx.fillStyle = '#4FC3F7';
      ctx.beginPath();
      ctx.moveTo(0,-o.r*1.3);
      ctx.quadraticCurveTo(o.r*1.05,o.r*0.35,0,o.r*1.05);
      ctx.quadraticCurveTo(-o.r*1.05,o.r*0.35,0,-o.r*1.3);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#1B6B93';
      ctx.beginPath(); ctx.arc(-o.r*0.22,o.r*0.15,o.r*0.1,0,Math.PI*2); ctx.arc(o.r*0.22,o.r*0.15,o.r*0.1,0,Math.PI*2); ctx.fill();
    } else if(o.type==='leaf'){
      ctx.fillStyle = '#8BC34A';
      ctx.beginPath();
      ctx.ellipse(0,0,o.r*1.15,o.r*0.62,0,0,Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = '#5C8A2E'; ctx.lineWidth = o.r*0.12; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(-o.r*1.05,0); ctx.lineTo(o.r*1.05,0); ctx.stroke();
    } else if(o.type==='boulder'){
      ctx.fillStyle = '#9E9E9E';
      ctx.beginPath();
      const pts=8;
      for(let i=0;i<pts;i++){
        const a=(i/pts)*Math.PI*2;
        const rr=o.r*(0.85+0.15*Math.sin(a*3+o.phase));
        const px=Math.cos(a)*rr, py=Math.sin(a)*rr;
        if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#3A2A1A';
      ctx.beginPath(); ctx.ellipse(-o.r*0.28,-o.r*0.05,o.r*0.11,o.r*0.14,0,0,Math.PI*2); ctx.ellipse(o.r*0.28,-o.r*0.05,o.r*0.11,o.r*0.14,0,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#3A2A1A'; ctx.lineWidth=o.r*0.09; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(-o.r*0.15,o.r*0.35); ctx.lineTo(o.r*0.15,o.r*0.35); ctx.stroke();
    } else if(o.type==='helmet'){
      const grad = ctx.createLinearGradient(-o.r,-o.r,o.r,o.r*0.3);
      grad.addColorStop(0,'#EDEFF2');
      grad.addColorStop(1,'#9AA5B1');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0,0,o.r,Math.PI,0);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#7B8794';
      roundRect(-o.r*1.08,-o.r*0.06,o.r*2.16,o.r*0.28,o.r*0.12);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.beginPath(); ctx.ellipse(-o.r*0.35,-o.r*0.35,o.r*0.28,o.r*0.16,-0.4,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#5B6572';
      ctx.beginPath(); ctx.arc(-o.r*0.65,-o.r*0.12,o.r*0.09,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(o.r*0.65,-o.r*0.12,o.r*0.09,0,Math.PI*2); ctx.fill();
    } else if(o.type==='ad'){
      const pulse = 1+Math.sin(o.age*6)*0.06;
      ctx.scale(pulse,pulse);
      const grad = ctx.createLinearGradient(-o.r,-o.r,o.r,o.r);
      grad.addColorStop(0,'#FFD93D');
      grad.addColorStop(1,'#FF9F45');
      ctx.fillStyle = grad;
      roundRect(-o.r*1.05,-o.r*0.78,o.r*2.1,o.r*1.56,o.r*0.32);
      ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = o.r*0.1;
      roundRect(-o.r*1.05,-o.r*0.78,o.r*2.1,o.r*1.56,o.r*0.32);
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${Math.round(o.r*0.95)}px sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('AD', 0, -o.r*0.06);
      ctx.fillStyle = '#FF5C7A';
      heart(o.r*0.6, -o.r*0.58, o.r*0.26);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawParticles(){
    for(const p of particles){
      const a = clamp(p.life/p.maxLife,0,1);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawHUD(now){
    // backing panels for legibility over any background
    const hs = W*0.045;
    const heartsPanelW = 18+hpMax*(hs*2.3)-2;
    ctx.save();
    ctx.fillStyle = 'rgba(10,20,30,0.28)';
    roundRect(10, 10, heartsPanelW, hs*2.1, hs*1.05);
    ctx.fill();
    ctx.restore();

    // hearts
    for(let i=0;i<hpMax;i++){
      const cx = 22+i*(hs*2.3), cy = 26;
      ctx.fillStyle = i<hp ? '#FF5C7A' : 'rgba(255,255,255,0.28)';
      ctx.strokeStyle = 'rgba(0,0,0,0.25)';
      ctx.lineWidth = hs*0.06;
      heart(cx-hs*0.75, cy-hs*0.35, hs*0.75);
      ctx.fill(); ctx.stroke();
    }

    // score
    ctx.textAlign = 'right';
    ctx.textBaseline = 'alphabetic';
    const scoreText = Math.floor(height)+'m';
    ctx.font = `${Math.round(W*0.065)}px 'Jua', sans-serif`;
    const scoreW = ctx.measureText(scoreText).width;
    ctx.save();
    ctx.fillStyle = 'rgba(10,20,30,0.28)';
    roundRect(W-30-scoreW, 12, scoreW+20, hs*2.3, hs*1.05);
    ctx.fill();
    ctx.restore();
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillText(scoreText, W-18+1, 38+1);
    ctx.fillStyle = '#FFFFFF';
    ctx.fillText(scoreText, W-18, 38);

    if(now < unlockToastUntil){
      ctx.textAlign='center';
      const alpha = clamp((unlockToastUntil-now)/2200,0,1);
      ctx.globalAlpha = Math.min(1, alpha*3);
      ctx.font = `${Math.round(W*0.05)}px 'Jua', sans-serif`;
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillText(unlockToastText, W/2+1, H*0.22+1);
      ctx.fillStyle = '#FFF3B0';
      ctx.fillText(unlockToastText, W/2, H*0.22);
      ctx.globalAlpha = 1;
    }
  }

  function drawOverlay(now){
    if(state==='start'){
      ctx.fillStyle = 'rgba(5,8,25,0.45)';
      ctx.fillRect(0,0,W,H);
      ctx.textAlign='center';
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.font = `${Math.round(W*0.11)}px 'Jua', sans-serif`;
      ctx.fillText('하늘에', W/2+2, H*0.33+2);
      ctx.fillText('닿고 싶어', W/2+2, H*0.33+Math.round(W*0.13)+2);
      ctx.fillStyle = '#FFFFFF';
      ctx.fillText('하늘에', W/2, H*0.33);
      ctx.fillText('닿고 싶어', W/2, H*0.33+Math.round(W*0.13));

      ctx.font = `${Math.round(W*0.038)}px 'Jua', sans-serif`;
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      const lh = Math.round(W*0.052);
      ctx.fillText('탭하면 점프, 공중에서 한번 더 탭하면', W/2, H*0.485);
      ctx.fillText('반대쪽까지 이어서 점프해요', W/2, H*0.485+lh);
      ctx.fillText('너무 오래 머무르면 떨어지니 조심!', W/2, H*0.485+lh*2);

      const bob = Math.sin(now/350)*6;
      ctx.font = `${Math.round(W*0.055)}px 'Jua', sans-serif`;
      ctx.fillStyle = '#FFD93D';
      ctx.fillText('탭 / 스페이스바로 시작', W/2, H*0.78+bob);

      drawCharacter(W/2, H*0.66, 1, 0, now);
    } else if(state==='gameover'){
      ctx.fillStyle = 'rgba(5,8,25,0.6)';
      ctx.fillRect(0,0,W,H);
      ctx.textAlign='center';
      ctx.fillStyle = '#FF5C7A';
      ctx.font = `${Math.round(W*0.09)}px 'Jua', sans-serif`;
      ctx.fillText(gameOverReason==='fall' ? '떨어지고 말았어요!' : '게임 오버', W/2, H*0.38);

      ctx.fillStyle = '#FFFFFF';
      ctx.font = `${Math.round(W*0.06)}px 'Jua', sans-serif`;
      ctx.fillText('높이: '+Math.floor(height)+'m', W/2, H*0.48);
      ctx.font = `${Math.round(W*0.045)}px 'Jua', sans-serif`;
      ctx.fillStyle = '#FFD93D';
      ctx.fillText('최고 기록(이번 플레이): '+Math.floor(sessionBest)+'m', W/2, H*0.55);

      const bob = Math.sin(now/350)*6;
      ctx.font = `${Math.round(W*0.052)}px 'Jua', sans-serif`;
      ctx.fillStyle = '#FFFFFF';
      ctx.fillText('탭 / 스페이스바로 다시 시작', W/2, H*0.66+bob);
    }
  }

  // ---------- main loop ----------
  function render(now){
    let ox=0, oy=0;
    if(now<shakeUntil){
      const p = (shakeUntil-now)/300;
      ox = (Math.random()*2-1)*shakeMag*p;
      oy = (Math.random()*2-1)*shakeMag*p;
    }
    ctx.save();
    ctx.translate(ox,oy);
    drawBackground(now);
    drawPillars(now);
    drawParticles();
    if(state!=='start'){
      drawRestRing(now);
      drawCharacter(charX, charY, charScale, charRot, now);
    }
    for(const o of obstacles) drawObstacle(o);
    if(state==='playing') drawHUD(now);
    ctx.restore();
    drawOverlay(now);
  }

  function loop(now){
    if(!lastTime) lastTime = now;
    let dt = (now-lastTime)/1000;
    lastTime = now;
    dt = Math.min(dt, 0.05);
    update(dt, now);
    render(now);
    requestAnimationFrame(loop);
  }

  // ---------- input ----------
  function onPointerDown(e){
    e.preventDefault();
    tryJump();
  }
  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('touchstart', function(e){ e.preventDefault(); }, {passive:false});
  window.addEventListener('keydown', function(e){
    if(e.code==='Space' || e.key===' '){
      e.preventDefault();
      tryJump();
    }
  });
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden) lastTime = 0;
  });

  // ---------- init ----------
  resize();
  resetGame();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
