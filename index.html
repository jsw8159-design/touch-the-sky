      ctx.beginPath(); ctx.arc(0,0,r*0.42,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#D9739E';
      ctx.beginPath(); ctx.arc(0,0,r*0.14,0,Math.PI*2); ctx.fill();
    } else if(zoneIdx===1){ // summer: broad green leaf
      ctx.fillStyle = '#4CAF50';
      ctx.beginPath();
      ctx.ellipse(0,0,r*1.15,r*0.62,0,0,Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = '#2E7D32'; ctx.lineWidth = r*0.12; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(-r*1.05,0); ctx.lineTo(r*1.05,0); ctx.stroke();
    } else if(zoneIdx===2){ // autumn: maple leaf
      ctx.fillStyle = '#E0632E';
      ctx.beginPath();
      for(let i=0;i<5;i++){
        const a = -Math.PI/2 + i*(Math.PI*2/5);
        const tipX = Math.cos(a)*r*1.15, tipY = Math.sin(a)*r*1.15;
        const baseA1 = a-0.35, baseA2 = a+0.35;
        const b1x = Math.cos(baseA1)*r*0.5, b1y = Math.sin(baseA1)*r*0.5;
        const b2x = Math.cos(baseA2)*r*0.5, b2y = Math.sin(baseA2)*r*0.5;
        if(i===0) ctx.moveTo(b1x,b1y);
        ctx.lineTo(tipX,tipY); ctx.lineTo(b2x,b2y);
      }
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#A8391A'; ctx.lineWidth = r*0.08; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,r*1.15); ctx.stroke();
    } else if(zoneIdx===3){ // winter: snowflake
      ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = r*0.14; ctx.lineCap='round';
      for(let i=0;i<3;i++){
        ctx.save(); ctx.rotate(i*(Math.PI/3));
        ctx.beginPath(); ctx.moveTo(-r*1.1,0); ctx.lineTo(r*1.1,0); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(r*0.65,0); ctx.lineTo(r*0.9,-r*0.3); ctx.moveTo(r*0.65,0); ctx.lineTo(r*0.9,r*0.3); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-r*0.65,0); ctx.lineTo(-r*0.9,-r*0.3); ctx.moveTo(-r*0.65,0); ctx.lineTo(-r*0.9,r*0.3); ctx.stroke();
        ctx.restore();
      }
    } else { // space: tumbling debris panel
      ctx.fillStyle = '#8FA3B8';
      ctx.beginPath();
      ctx.rect(-r*1.05,-r*0.5,r*2.1,r);
      ctx.fill();
      ctx.fillStyle = '#4E5D6C';
      ctx.fillRect(-r*0.85,-r*0.3,r*0.6,r*0.24);
      ctx.fillRect(r*0.15,-r*0.02,r*0.6,r*0.24);
      ctx.strokeStyle = '#CFE0EE'; ctx.lineWidth = r*0.06;
      ctx.strokeRect(-r*1.05,-r*0.5,r*2.1,r);
    }
  }

  function drawObstacleBoulder(r, zoneIdx, phase){
    if(zoneIdx===0){ // spring: flower pot
      ctx.fillStyle = '#D97B4A';
      ctx.beginPath();
      ctx.moveTo(-r*0.62,-r*0.1); ctx.lineTo(r*0.62,-r*0.1); ctx.lineTo(r*0.42,r*0.85); ctx.lineTo(-r*0.42,r*0.85);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#B85F2C';
      ctx.fillRect(-r*0.72,-r*0.28,r*1.44,r*0.2);
      ctx.fillStyle = '#5CA85A';
      ctx.beginPath(); ctx.ellipse(-r*0.2,-r*0.55,r*0.22,r*0.38,-0.3,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(r*0.22,-r*0.6,r*0.22,r*0.4,0.3,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#FF6FA5';
      ctx.beginPath(); ctx.arc(0,-r*0.85,r*0.18,0,Math.PI*2); ctx.fill();
    } else { // summer coconut / autumn pumpkin / winter snowball / space asteroid all share the craggy blob base
      const cfg = zoneIdx===1 ? {fill:'#8B5A2B', dark:'#4A2F16'}
        : zoneIdx===2 ? {fill:'#E8792A', dark:'#B85F2C'}
        : zoneIdx===3 ? {fill:'#F2FAFF', dark:'#C9E6F7'}
        : {fill:'#9E9E9E', dark:'#5C5C63'};
      ctx.fillStyle = cfg.fill;
      ctx.beginPath();
      const pts=8;
      for(let i=0;i<pts;i++){
        const a=(i/pts)*Math.PI*2;
        const rr=r*(0.85+0.15*Math.sin(a*3+(phase||0)));
        const px=Math.cos(a)*rr, py=Math.sin(a)*rr;
        if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath(); ctx.fill();
      if(zoneIdx===2){ // pumpkin ridges + stem
        ctx.strokeStyle = cfg.dark; ctx.lineWidth = r*0.06;
        for(let i=-2;i<=2;i++){ ctx.beginPath(); ctx.moveTo(i*r*0.22,-r*0.75); ctx.quadraticCurveTo(i*r*0.3,0,i*r*0.22,r*0.75); ctx.stroke(); }
        ctx.fillStyle = '#5C3714';
        ctx.fillRect(-r*0.09,-r*1.05,r*0.18,r*0.28);
      } else if(zoneIdx===3){ // snowball texture dots
        ctx.fillStyle = cfg.dark;
        ctx.beginPath(); ctx.arc(-r*0.25,-r*0.1,r*0.06,0,Math.PI*2); ctx.arc(r*0.15,r*0.2,r*0.05,0,Math.PI*2); ctx.arc(r*0.1,-r*0.3,r*0.05,0,Math.PI*2); ctx.fill();
      } else { // coconut face / asteroid craters
        ctx.fillStyle = cfg.dark;
        ctx.beginPath(); ctx.ellipse(-r*0.28,-r*0.05,r*0.11,r*0.14,0,0,Math.PI*2); ctx.ellipse(r*0.28,-r*0.05,r*0.11,r*0.14,0,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle=cfg.dark; ctx.lineWidth=r*0.09; ctx.lineCap='round';
        ctx.beginPath(); ctx.moveTo(-r*0.15,r*0.35); ctx.lineTo(r*0.15,r*0.35); ctx.stroke();
      }
    }
  }

  function drawObstacleLightning(r, zoneIdx){
    if(zoneIdx===0){ // spring: bee
      const glow = ctx.createRadialGradient(0,0,0,0,0,r*1.6);
      glow.addColorStop(0,'rgba(255,224,120,0.5)'); glow.addColorStop(1,'rgba(255,224,120,0)');
      ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(0,0,r*1.6,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(230,240,255,0.7)';
      ctx.beginPath(); ctx.ellipse(-r*0.15,-r*0.55,r*0.5,r*0.28,-0.3,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(r*0.15,-r*0.55,r*0.5,r*0.28,0.3,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#FFD93D';
      ctx.beginPath(); ctx.ellipse(0,0.1*r,r*0.75,r*0.55,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#2B2B2B';
      ctx.fillRect(-r*0.75,-r*0.18,r*1.5,r*0.16);
      ctx.fillRect(-r*0.6,r*0.12,r*1.2,r*0.16);
      ctx.beginPath(); ctx.arc(0,-r*0.4,r*0.22,0,Math.PI*2); ctx.fill();
    } else if(zoneIdx===2){ // autumn: whirlwind gust
      ctx.strokeStyle = '#C9C2B8'; ctx.lineWidth = r*0.16; ctx.lineCap='round';
      for(let i=0;i<3;i++){
        const rr = r*(0.4+i*0.4);
        ctx.beginPath(); ctx.arc(0,0,rr,Math.PI*0.15+i*0.5,Math.PI*1.5+i*0.5); ctx.stroke();
      }
      ctx.fillStyle = '#8A8378';
      ctx.beginPath(); ctx.arc(r*1.1,-r*0.2,r*0.14,0,Math.PI*2); ctx.fill();
    } else if(zoneIdx===4){ // space: laser beam
      const glow = ctx.createRadialGradient(0,0,0,0,0,r*1.6);
      glow.addColorStop(0,'rgba(92,242,255,0.45)'); glow.addColorStop(1,'rgba(92,242,255,0)');
      ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(0,0,r*1.6,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#5CF2FF';
      ctx.beginPath(); ctx.moveTo(-r*0.22,-r*1.4); ctx.lineTo(r*0.22,-r*1.4); ctx.lineTo(r*0.1,r*1.4); ctx.lineTo(-r*0.1,r*1.4);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#FF5CF0';
      ctx.beginPath(); ctx.arc(0,0,r*0.24,0,Math.PI*2); ctx.fill();
    } else { // summer thunderbolt / winter blizzard blast (same silhouette, different coloring)
      const col = zoneIdx===3 ? {glow:'rgba(223,244,255,0.55)', fill:'#DFF4FF', stroke:'#9FD8F2'}
        : {glow:'rgba(255,244,168,0.55)', fill:'#FFF4A8', stroke:'#FFAA00'};
      const glow = ctx.createRadialGradient(0,0,0,0,0,r*1.8);
      glow.addColorStop(0,col.glow); glow.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(0,0,r*1.8,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = col.fill;
      ctx.beginPath();
      ctx.moveTo(-r*0.15,-r*1.3);
      ctx.lineTo(r*0.55,-r*0.15);
      ctx.lineTo(r*0.05,-r*0.15);
      ctx.lineTo(r*0.65,r*1.3);
      ctx.lineTo(-r*0.35,r*0.05);
      ctx.lineTo(r*0.15,r*0.05);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = col.stroke; ctx.lineWidth = r*0.08;
      ctx.stroke();
    }
  }

  function drawObstacle(o){
    ctx.save();
    ctx.translate(o.x,o.y);
    ctx.rotate(o.rot||0);
    const oz = o.zone||0;
    if(o.type==='drop'){
      drawObstacleDrop(o.r, oz);
    } else if(o.type==='leaf'){
      drawObstacleLeaf(o.r, oz);
    } else if(o.type==='boulder'){
      drawObstacleBoulder(o.r, oz, o.phase);
    } else if(o.type==='lightning'){
      drawObstacleLightning(o.r, oz);
    } else if(o.type==='helmet'){
      const grad = ctx.createLinearGradient(-o.r,-o.r,o.r,o.r*0.3);
      grad.addColorStop(0,'#EDEFF2');
      grad.addColorStop(1,'#9AA5B1');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0,0,o.r,Math.PI,0);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#7B8794';
      roundRect(-o.r*1.08,-o.r*0.06,o.r*2.16,o.r*0.28,o.r*0.12);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.beginPath(); ctx.ellipse(-o.r*0.35,-o.r*0.35,o.r*0.28,o.r*0.16,-0.4,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#5B6572';
      ctx.beginPath(); ctx.arc(-o.r*0.65,-o.r*0.12,o.r*0.09,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(o.r*0.65,-o.r*0.12,o.r*0.09,0,Math.PI*2); ctx.fill();
    } else if(o.type==='ad'){
      const pulse = 1+Math.sin(o.age*6)*0.06;
      ctx.scale(pulse,pulse);
      const grad = ctx.createLinearGradient(-o.r,-o.r,o.r,o.r);
      grad.addColorStop(0,'#FFD93D');
      grad.addColorStop(1,'#FF9F45');
      ctx.fillStyle = grad;
      roundRect(-o.r*1.05,-o.r*0.78,o.r*2.1,o.r*1.56,o.r*0.32);
      ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = o.r*0.1;
      roundRect(-o.r*1.05,-o.r*0.78,o.r*2.1,o.r*1.56,o.r*0.32);
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${Math.round(o.r*0.95)}px sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('AD', 0, -o.r*0.06);
      ctx.fillStyle = '#FF5C7A';
      heart(o.r*0.6, -o.r*0.58, o.r*0.26);
      ctx.fill();
    } else if(o.type==='lightning'){
      const glow = ctx.createRadialGradient(0,0,0,0,0,o.r*1.8);
      glow.addColorStop(0,'rgba(255,244,168,0.55)');
      glow.addColorStop(1,'rgba(255,244,168,0)');
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(0,0,o.r*1.8,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#FFF4A8';
      ctx.beginPath();
      ctx.moveTo(-o.r*0.15,-o.r*1.3);
      ctx.lineTo(o.r*0.55,-o.r*0.15);
      ctx.lineTo(o.r*0.05,-o.r*0.15);
      ctx.lineTo(o.r*0.65,o.r*1.3);
      ctx.lineTo(-o.r*0.35,o.r*0.05);
      ctx.lineTo(o.r*0.15,o.r*0.05);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#FFAA00'; ctx.lineWidth = o.r*0.08;
      ctx.stroke();
    } else if(o.type==='friend'){
      const r = o.r*1.05;
      const fv = FRIEND_VARIANTS[o.variant||0];
      ctx.fillStyle = fv.wing;
      ctx.beginPath(); ctx.ellipse(r*0.7,r*0.05,r*0.42,r*0.58,0.5,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = fv.body;
      ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(255,150,150,0.5)';
      ctx.beginPath(); ctx.ellipse(-r*0.5,r*0.18,r*0.15,r*0.09,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(r*0.5,r*0.18,r*0.15,r*0.09,0,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#294048'; ctx.lineWidth = r*0.09; ctx.lineCap='round';
      ctx.beginPath(); ctx.arc(-r*0.36,-r*0.02,r*0.15,Math.PI*1.15,Math.PI*1.85); ctx.stroke();
      ctx.beginPath(); ctx.arc(r*0.36,-r*0.02,r*0.15,Math.PI*1.15,Math.PI*1.85); ctx.stroke();
      ctx.fillStyle = '#F2994A';
      ctx.beginPath(); ctx.moveTo(-r*0.13,r*0.26); ctx.lineTo(r*0.13,r*0.26); ctx.lineTo(0,r*0.44); ctx.closePath(); ctx.fill();
    } else if(o.type==='hpup'){
      const pulse = 1+Math.sin(o.age*5)*0.08;
      ctx.scale(pulse,pulse);
      ctx.strokeStyle = 'rgba(255,180,200,0.7)'; ctx.lineWidth = o.r*0.07; ctx.lineCap='round';
      for(let i=0;i<6;i++){
        const a = (i/6)*Math.PI*2 + o.age*1.5;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a)*o.r*1.1, Math.sin(a)*o.r*1.1);
        ctx.lineTo(Math.cos(a)*o.r*1.55, Math.sin(a)*o.r*1.55);
        ctx.stroke();
      }
      const grad = ctx.createRadialGradient(0,-o.r*0.15,0,0,-o.r*0.15,o.r*1.1);
      grad.addColorStop(0,'#FFE3EA');
      grad.addColorStop(1,'#FF5C7A');
      ctx.fillStyle = grad;
      heart(0,-o.r*0.15,o.r*0.95);
      ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = o.r*0.09;
      heart(0,-o.r*0.15,o.r*0.95);
      ctx.stroke();
    } else if(o.type==='star'){
      const pulse = 1+Math.sin(o.age*6)*0.1;
      ctx.scale(pulse,pulse);
      const glow = ctx.createRadialGradient(0,0,0,0,0,o.r*1.9);
      glow.addColorStop(0,'rgba(255,217,61,0.55)');
      glow.addColorStop(1,'rgba(255,217,61,0)');
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(0,0,o.r*1.9,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#FFD93D';
      ctx.strokeStyle = '#FF9F1C'; ctx.lineWidth = o.r*0.08;
      ctx.beginPath();
      for(let i=0;i<5;i++){
        const outerA = -Math.PI/2 + i*(Math.PI*2/5);
        const innerA = outerA + Math.PI/5;
        const ox = Math.cos(outerA)*o.r, oy = Math.sin(outerA)*o.r;
        const ix = Math.cos(innerA)*o.r*0.45, iy = Math.sin(innerA)*o.r*0.45;
        if(i===0) ctx.moveTo(ox,oy); else ctx.lineTo(ox,oy);
        ctx.lineTo(ix,iy);
      }
      ctx.closePath();
      ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }

  function drawParticles(){
    for(const p of particles){
      const a = clamp(p.life/p.maxLife,0,1);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawHUD(now){
    // backing panels for legibility over any background
    const hs = W*0.045;
    const heartsPanelW = 18+hpMax*(hs*2.3)-2;
    ctx.save();
    ctx.fillStyle = 'rgba(10,20,30,0.28)';
    roundRect(10, 10, heartsPanelW, hs*2.1, hs*1.05);
    ctx.fill();
    ctx.restore();

    // hearts
    for(let i=0;i<hpMax;i++){
      const cx = 22+i*(hs*2.3), cy = 26;
      ctx.fillStyle = i<hp ? '#FF5C7A' : 'rgba(255,255,255,0.28)';
      ctx.strokeStyle = 'rgba(0,0,0,0.25)';
      ctx.lineWidth = hs*0.06;
      heart(cx-hs*0.75, cy-hs*0.35, hs*0.75);
      ctx.fill(); ctx.stroke();
    }

    // score
    ctx.textAlign = 'right';
    ctx.textBaseline = 'alphabetic';
    const scoreText = Math.floor(height)+'m';
    ctx.font = `${Math.round(W*0.065)}px 'Jua', sans-serif`;
    const scoreW = ctx.measureText(scoreText).width;
    ctx.save();
    ctx.fillStyle = 'rgba(10,20,30,0.28)';
    roundRect(W-30-scoreW, 12, scoreW+20, hs*2.3, hs*1.05);
    ctx.fill();
    ctx.restore();
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillText(scoreText, W-18+1, 38+1);
    ctx.fillStyle = '#FFFFFF';
    ctx.fillText(scoreText, W-18, 38);

    // combo indicator (shown while a streak of 2+ clean landings is active)
    if(combo >= 2){
      const comboText = tr('comboText', { mult: comboMultiplier.toFixed(1), n: combo });
      ctx.font = `${Math.round(W*0.038)}px 'Jua', sans-serif`;
      const comboW = ctx.measureText(comboText).width;
      const by = 38 + hs*1.7;
      ctx.save();
      ctx.fillStyle = 'rgba(10,20,30,0.28)';
      roundRect(W-30-comboW, by-hs*0.85, comboW+20, hs*1.55, hs*0.75);
      ctx.fill();
      ctx.restore();

      const popT = clamp((now-comboPopAt)/220,0,1);
      const tierScale = 1 + comboTier()*0.15; // combo text grows permanently bigger as escalation tiers climb
      const popScale = (1 + (1-popT)*0.22) * tierScale;
      ctx.save();
      ctx.translate(W-18, by);
      ctx.scale(popScale,popScale);
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillText(comboText, 1, 1);
      ctx.fillStyle = lerpColorHex('#FFD166', '#FF3B3B', comboTier()/6); // heats up from gold to red at max tier
      ctx.fillText(comboText, 0, 0);
      ctx.restore();
    }
  }

  // drawn regardless of state (start/playing/gameover) so toasts like the
  // "link copied" confirmation are visible even outside active gameplay
  function drawToast(now){
    if(now >= unlockToastUntil) return;
    ctx.save();
    ctx.textAlign='center';
    const alpha = clamp((unlockToastUntil-now)/2200,0,1);
    ctx.globalAlpha = Math.min(1, alpha*3);
    ctx.font = `${Math.round(W*0.05)}px 'Jua', sans-serif`;
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillText(unlockToastText, W/2+1, H*0.22+1);
    ctx.fillStyle = '#FFF3B0';
    ctx.fillText(unlockToastText, W/2, H*0.22);
    ctx.restore();
  }

  function drawOverlay(now){
    if(state==='start'){
      ctx.fillStyle = 'rgba(5,8,25,0.45)';
      ctx.fillRect(0,0,W,H);
      ctx.textAlign='center';
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.font = `${Math.round(W*0.11)}px 'Jua', sans-serif`;
      ctx.fillText(tr('titleLine1'), W/2+2, H*0.33+2);
      ctx.fillText(tr('titleLine2'), W/2+2, H*0.33+Math.round(W*0.13)+2);
      ctx.fillStyle = '#FFFFFF';
      ctx.fillText(tr('titleLine1'), W/2, H*0.33);
      ctx.fillText(tr('titleLine2'), W/2, H*0.33+Math.round(W*0.13));

      ctx.font = `${Math.round(W*0.032)}px 'Jua', sans-serif`;
      if(challengeTarget!=null){
        ctx.fillStyle = '#FF6B81';
        ctx.fillText(tr('challengeSubtitle', { name: challengeFrom, h: Math.floor(challengeTarget) }), W/2, H*0.435);
      } else {
        ctx.fillStyle = '#FFD93D';
        let bestLine = tr('bestHeightLabel', { h: Math.floor(sessionBest) });
        if(streakCount>=2) bestLine += '   ' + tr('streakBadge', { n: streakCount });
        ctx.fillText(bestLine, W/2, H*0.435);
      }

      ctx.font = `${Math.round(W*0.038)}px 'Jua', sans-serif`;
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      const lh = Math.round(W*0.052);
      ctx.fillText(tr('instr1'), W/2, H*0.485);
      ctx.fillText(tr('instr2'), W/2, H*0.485+lh);
      ctx.fillText(tr('instr3'), W/2, H*0.485+lh*2);

      const bob = Math.sin(now/350)*6;
      ctx.font = `${Math.round(W*0.055)}px 'Jua', sans-serif`;
      ctx.fillStyle = '#FFD93D';
      ctx.fillText(tr('startPrompt'), W/2, H*0.78+bob);

      // label above the character preview so the side arrows read as a character picker,
      // not just generic navigation
      ctx.font = `${Math.round(W*0.04)}px 'Jua', sans-serif`;
      ctx.fillStyle = '#FFD93D';
      ctx.fillText(tr('selectCharacter'), W/2, H*0.615);

      drawCharacter(W/2, H*0.655, 1, 0, now);

      const unlockedCount = SKINS.reduce((n,_,i)=>n+(isSkinUnlocked(i)?1:0),0);
      ctx.font = `${Math.round(W*0.034)}px 'Jua', sans-serif`;
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.fillText(skinName(currentSkin())+' ('+unlockedCount+'/'+SKINS.length+')', W/2, H*0.72);
    } else if(state==='gameover'){
      ctx.fillStyle = 'rgba(5,8,25,0.6)';
      ctx.fillRect(0,0,W,H);
      ctx.textAlign='center';
      ctx.fillStyle = '#FF5C7A';
      ctx.font = `${Math.round(W*0.09)}px 'Jua', sans-serif`;
      ctx.fillText(gameOverReason==='fall' ? tr('gameOverFall') : tr('gameOverHp'), W/2, H*0.38);

      ctx.fillStyle = '#FFFFFF';
      ctx.font = `${Math.round(W*0.06)}px 'Jua', sans-serif`;
      ctx.fillText(tr('heightLabel', { h: Math.floor(height) }), W/2, H*0.48);
      ctx.font = `${Math.round(W*0.045)}px 'Jua', sans-serif`;
      ctx.fillStyle = isNewRecord ? '#7CFFB2' : '#FFD93D';
      ctx.fillText(isNewRecord ? tr('newRecord', { h: Math.floor(sessionBest) }) : tr('bestHeight2', { h: Math.floor(sessionBest) }), W/2, H*0.55);

      let extraY = H*0.605;
      const extraStep = H*0.055;
      if(challengeTarget!=null){
        ctx.font = `${Math.round(W*0.036)}px 'Jua', sans-serif`;
        if(height > challengeTarget){
          ctx.fillStyle = '#7CFFB2';
          ctx.fillText(tr('challengeWon', { name: challengeFrom, diff: Math.floor(height-challengeTarget) }), W/2, extraY);
        } else {
          ctx.fillStyle = '#FF9F9F';
          ctx.fillText(tr('challengeLost', { name: challengeFrom, diff: Math.ceil(challengeTarget-height) }), W/2, extraY);
        }
        extraY += extraStep;
      }
      if(comboBest >= 2){
        ctx.font = `${Math.round(W*0.036)}px 'Jua', sans-serif`;
        ctx.fillStyle = '#FF9F1C';
        ctx.fillText(tr('bestComboLabel', { n: comboBest }), W/2, extraY);
        extraY += extraStep;
      }

      const bob = Math.sin(now/350)*6;
      const restartY = Math.max(extraY+H*0.03, H*0.68);
      ctx.font = `${Math.round(W*0.052)}px 'Jua', sans-serif`;
      ctx.fillStyle = '#FFFFFF';
      ctx.fillText(tr('restartPrompt'), W/2, restartY+bob);

      // lets players change character before restarting (the side arrows work here too)
      ctx.font = `${Math.round(W*0.032)}px 'Jua', sans-serif`;
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.fillText('◀ '+skinName(currentSkin())+' ▶', W/2, restartY+H*0.06);
    }
  }

  // ---------- pause overlay ----------
  function drawPauseOverlay(now){
    ctx.save();
    ctx.fillStyle = 'rgba(5,8,25,0.6)';
    ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.fillStyle = '#FFFFFF';
    ctx.font = `${Math.round(W*0.09)}px 'Jua', sans-serif`;
    ctx.fillText(tr('pausedTitle'), W/2, H*0.44);
    const bob = Math.sin(now/350)*6;
    ctx.font = `${Math.round(W*0.045)}px 'Jua', sans-serif`;
    ctx.fillStyle = '#FFD93D';
    ctx.fillText(tr('pausedHint'), W/2, H*0.52+bob);
    ctx.restore();
  }

  // ---------- local leaderboard overlay ----------
  // placeholder rewarded-ad "watching" screen - see startAdUnlockFlow() for where to swap in a real ad SDK
  function drawMissionsOverlay(now){
    ensureDailyMissions(); // catches a midnight rollover while the overlay happens to be open
    ctx.save();
    ctx.fillStyle = 'rgba(4,6,20,0.94)';
    ctx.fillRect(0,0,W,H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#FFD93D';
    ctx.font = `${Math.round(W*0.07)}px 'Jua', sans-serif`;
    ctx.fillText(missionsTab==='missions' ? tr('dailyMissionsTitle') : tr('achievementsTitle'), W/2, H*0.26);

    const rowH = H*0.075;
    if(missionsTab==='missions'){
      for(let i=0;i<dailyMissions.ids.length;i++){
        const id = dailyMissions.ids[i];
        const m = missionById(id);
        const p = missionProgress(id);
        const done = missionDone(id);
        const y = H*0.36 + i*rowH;
        ctx.font = `${Math.round(W*0.04)}px 'Jua', sans-serif`;
        ctx.fillStyle = done ? '#7CFFB2' : 'rgba(255,255,255,0.9)';
        ctx.fillText((done?'✅ ':m.icon+' ')+missionDesc(m), W/2, y);
        ctx.font = `${Math.round(W*0.03)}px 'Jua', sans-serif`;
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.fillText(Math.min(p,m.target)+' / '+m.target, W/2, y+H*0.032);
      }
      ctx.font = `${Math.round(W*0.03)}px 'Jua', sans-serif`;
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.fillText(tr('missionsReset'), W/2, H*0.36+3*rowH+H*0.02);
    } else {
      const earnedCount = ACHIEVEMENTS.reduce(function(n,a){ return n+(earnedAchievements.has(a.id)?1:0); }, 0);
      ctx.font = `${Math.round(W*0.032)}px 'Jua', sans-serif`;
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.fillText(tr('achEarnedOf', { n: earnedCount, total: ACHIEVEMENTS.length }), W/2, H*0.31);
      const achRowH = Math.min(H*0.052, H*0.5/ACHIEVEMENTS.length);
      for(let i=0;i<ACHIEVEMENTS.length;i++){
        const a = ACHIEVEMENTS[i];
        const earned = earnedAchievements.has(a.id);
        const y = H*0.36 + i*achRowH;
        ctx.font = `${Math.round(W*0.032)}px 'Jua', sans-serif`;
        ctx.fillStyle = earned ? '#FFD93D' : 'rgba(255,255,255,0.55)';
        ctx.fillText((earned?a.icon:'🔒')+' '+achName(a), W/2, y);
        // description stays visible even after earning it, so the list still reads
        // as a coherent goal list rather than losing context once achieved
        ctx.font = `${Math.round(W*0.022)}px 'Jua', sans-serif`;
        ctx.fillStyle = earned ? 'rgba(255,255,255,0.5)' : 'rgba(255,255,255,0.32)';
        ctx.fillText(achDesc(a), W/2, y+achRowH*0.42);
      }
    }
    ctx.font = `${Math.round(W*0.028)}px 'Jua', sans-serif`;
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText(tr('tapEmptyToClose'), W/2, H*0.92);
    ctx.restore();
  }

  function drawCostumeOverlay(now){
    ctx.save();
    ctx.fillStyle = 'rgba(4,6,20,0.94)';
    ctx.fillRect(0,0,W,H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#FFD93D';
    ctx.font = `${Math.round(W*0.07)}px 'Jua', sans-serif`;
    ctx.fillText(tr('costumeTitle'), W/2, H*0.22);

    drawCharacter(W/2, H*0.4, 1, 0, now);

    const c = currentCostume();
    ctx.font = `${Math.round(W*0.045)}px 'Jua', sans-serif`;
    ctx.fillStyle = '#FFFFFF';
    ctx.fillText('◀ '+costumeName(c)+' ▶', W/2, H*0.5);

    const unlockedCount = COSTUMES.reduce((n,_,i)=>n+(isCostumeUnlocked(i)?1:0),0);
    ctx.font = `${Math.round(W*0.032)}px 'Jua', sans-serif`;
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillText(tr('costumeUnlockedOf', { n: unlockedCount, total: COSTUMES.length }), W/2, H*0.55);

    const rowH = H*0.032;
    const startY = H*0.6;
    for(let i=0;i<COSTUMES.length;i++){
      const cc = COSTUMES[i];
      const unlocked = isCostumeUnlocked(i);
      const y = startY + i*rowH;
      ctx.font = `${Math.round(W*0.028)}px 'Jua', sans-serif`;
      ctx.fillStyle = i===selectedCostumeIndex ? '#FFD93D' : (unlocked ? 'rgba(255,255,255,0.8)' : 'rgba(255,255,255,0.35)');
      const label = unlocked ? (cc.emoji||'⬜')+' '+costumeName(cc) : tr('costumeLocked', { name: costumeName(cc), h: cc.unlockHeight });
      ctx.fillText(label, W/2, y);
    }

    ctx.font = `${Math.round(W*0.028)}px 'Jua', sans-serif`;
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText(tr('tapEmptyToClose'), W/2, H*0.94);
    ctx.restore();
  }

  function drawSettingsOverlay(now){
    ctx.save();
    ctx.fillStyle = 'rgba(4,6,20,0.94)';
    ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.fillStyle = '#FFD93D';
    ctx.font = `${Math.round(W*0.07)}px 'Jua', sans-serif`;
    ctx.fillText(tr('settingsTitle'), W/2, H*0.26);
    ctx.font = `${Math.round(W*0.03)}px 'Jua', sans-serif`;
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillText(tr('tapEmptyToClose'), W/2, H*0.34);
    ctx.restore();
  }

  function drawAdUnlockOverlay(now){
    const elapsed = now-adUnlockStart;
    const p = clamp(elapsed/AD_UNLOCK_WATCH_MS, 0, 1);
    const remainSec = Math.max(0, Math.ceil((AD_UNLOCK_WATCH_MS-elapsed)/1000));
    ctx.save();
    ctx.fillStyle = 'rgba(4,6,20,0.95)';
    ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.fillStyle = '#FF5A8C';
    ctx.font = `${Math.round(W*0.07)}px 'Jua', sans-serif`;
    ctx.fillText(tr('adWatching'), W/2, H*0.34);

    ctx.font = `${Math.round(W*0.045)}px 'Jua', sans-serif`;
    ctx.fillStyle = '#FFFFFF';
    const targetName = adUnlockTargetIndex>=0 ? skinName(SKINS[adUnlockTargetIndex]) : '';
    ctx.fillText(tr('adUnlockUntil', { name: targetName }), W/2, H*0.44);

    // progress bar
    const barW = W*0.6, barH = H*0.028, barX = W/2-barW/2, barY = H*0.5;
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    roundRect(barX, barY, barW, barH, barH/2); ctx.fill();
    ctx.fillStyle = '#FF5A8C';
    roundRect(barX, barY, barW*p, barH, barH/2); ctx.fill();

    ctx.font = `${Math.round(W*0.09)}px 'Jua', sans-serif`;
    ctx.fillStyle = '#FFD93D';
    ctx.fillText(String(remainSec), W/2, H*0.62);

    ctx.font = `${Math.round(W*0.032)}px 'Jua', sans-serif`;
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillText(tr('adPlaceholderNote'), W/2, H*0.68);
    ctx.restore();
  }

  function drawLeaderboard(now){
    ctx.save();
    ctx.fillStyle = 'rgba(4,6,20,0.94)';
    ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.fillStyle = '#FFD93D';
    ctx.font = `${Math.round(W*0.07)}px 'Jua', sans-serif`;
    ctx.fillText(leaderboardTab==='global' ? tr('lbGlobalTitle') : leaderboardTab==='stats' ? tr('lbStatsTitle') : tr('lbLocalTitle', { n: LEADERBOARD_SIZE }), W/2, H*0.26);

    ctx.font = `${Math.round(W*0.042)}px 'Jua', sans-serif`;
    ctx.textAlign = 'center';
    const medals = ['🥇','🥈','🥉'];
    const rowH = H*0.058;

    if(leaderboardTab==='local'){
      if(!leaderboard.length){
        ctx.fillStyle = 'rgba(255,255,255,0.75)';
        ctx.fillText(tr('lbEmpty'), W/2, H*0.4);
      } else {
        for(let i=0;i<leaderboard.length;i++){
          const y = H*0.36 + i*rowH;
          ctx.fillStyle = i<3 ? '#FFD93D' : 'rgba(255,255,255,0.85)';
          ctx.fillText((medals[i]||(i+1)+'.')+' '+leaderboard[i].h+'m', W/2, y);
        }
      }
    } else if(leaderboardTab==='global'){
      if(globalLoadState==='loading'){
        ctx.fillStyle = 'rgba(255,255,255,0.75)';
        ctx.fillText(tr('lbLoading'), W/2, H*0.4);
      } else if(globalLoadState==='error'){
        ctx.fillStyle = 'rgba(255,150,150,0.85)';
        ctx.fillText(tr('lbError'), W/2, H*0.4);
        ctx.font = `${Math.round(W*0.032)}px 'Jua', sans-serif`;
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.fillText(tr('lbErrorHint'), W/2, H*0.44);
      } else if(!globalLeaderboard || !globalLeaderboard.length){
        ctx.fillStyle = 'rgba(255,255,255,0.75)';
        ctx.fillText(tr('lbGlobalEmpty'), W/2, H*0.4);
      } else {
        for(let i=0;i<globalLeaderboard.length;i++){
          const row = globalLeaderboard[i];
          const y = H*0.36 + i*rowH;
          const isMe = row.nickname===myNickname && row.score===Math.floor(globalBestSubmitted);
          ctx.fillStyle = i<3 ? '#FFD93D' : 'rgba(255,255,255,0.85)';
          ctx.fillText((medals[i]||(i+1)+'.')+' '+row.nickname+' - '+row.score+'m'+(isMe?tr('lbMeSuffix'):''), W/2, y);
        }
      }
    } else { // stats
      const rows = [
        [tr('statStreak'), streakCount+tr('unitDays')],
        [tr('statPlays'), lifeStats.plays+tr('unitTimes')],
        [tr('statDistance'), lifeStats.distance+'m'],
        [tr('statLandings'), lifeStats.landings+tr('unitTimes')],
        [tr('statBestCombo'), lifeStats.bestCombo+tr('unitCombo')],
        [tr('statFalls'), lifeStats.falls+tr('unitTimes')],
        [tr('statHpDeaths'), lifeStats.hpDeaths+tr('unitTimes')]
      ];
      ctx.textAlign = 'left';
      const labelX = W*0.5-W*0.34, valueX = W*0.5+W*0.34;
      for(let i=0;i<rows.length;i++){
        const y = H*0.36 + i*rowH;
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.fillText(rows[i][0], labelX, y);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#FFD93D';
        ctx.fillText(rows[i][1], valueX, y);
        ctx.textAlign = 'left';
      }
      ctx.textAlign = 'center';
    }
    ctx.restore();
  }

  // ---------- main loop ----------
  function render(now){
    let ox=0, oy=0;
    if(now<shakeUntil){
      const p = (shakeUntil-now)/300;
      ox = (Math.random()*2-1)*shakeMag*p;
      oy = (Math.random()*2-1)*shakeMag*p;
    }
    ctx.save();
    ctx.translate(ox,oy);
    drawBackground(now);
    drawPillars(now);
    drawParticles();
    if(state!=='start'){
      drawRestRing(now);
      if(charState==='friend_highfive' || charState==='friend_ascend'){
        drawFriendCharacter(friendX, friendY, friendVariant);
      }
      drawCharAfterimages(now);
      drawCharacter(charX, charY, charScale, charRot, now);
      drawShout(now);
    }
    for(const o of obstacles) drawObstacle(o);
    if(state==='playing') drawHUD(now);
    ctx.restore();
    drawDangerVignette(now);
    drawFlash(now);
    drawOverlay(now);
    drawToast(now);
  }

  function loop(now){
    if(!lastTime) lastTime = now;
    let dt = (now-lastTime)/1000;
    lastTime = now;
    dt = Math.min(dt, 0.05);
    if(!paused) update(dt, now);
    render(now);
    if(paused) drawPauseOverlay(now);
    if(showLeaderboard) drawLeaderboard(now);
    if(showSettings) drawSettingsOverlay(now);
    if(showMissions) drawMissionsOverlay(now);
    if(showCostume) drawCostumeOverlay(now);
    if(adUnlockActive) drawAdUnlockOverlay(now);
    requestAnimationFrame(loop);
  }

  // ---------- input ----------
  function onPointerDown(e){
    e.preventDefault();
    if(adUnlockActive) return; // "watching an ad" can't be skipped by tapping through it
    if(showLeaderboard){ showLeaderboard=false; syncUiButtons(); return; }
    if(showSettings){ showSettings=false; syncUiButtons(); return; }
    if(showMissions){ showMissions=false; syncUiButtons(); return; }
    if(showCostume){ showCostume=false; syncUiButtons(); return; }
    if(paused){ togglePause(); return; }
    tryJump();
  }
  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('touchstart', function(e){ e.preventDefault(); }, {passive:false});
  window.addEventListener('keydown', function(e){
    if(e.code==='Space' || e.key===' '){
      e.preventDefault();
      if(adUnlockActive) return;
      if(showLeaderboard){ showLeaderboard=false; syncUiButtons(); return; }
      if(showSettings){ showSettings=false; syncUiButtons(); return; }
      if(showMissions){ showMissions=false; syncUiButtons(); return; }
      if(showCostume){ showCostume=false; syncUiButtons(); return; }
      if(paused){ togglePause(); return; }
      tryJump();
    } else if(e.key==='p' || e.key==='P' || e.key==='Escape'){
      if(state==='playing') togglePause();
    } else if(e.key==='m' || e.key==='M'){
      toggleMute();
    }
  });
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden) lastTime = 0;
  });

  // ---------- overlay UI button wiring ----------
  btnMute.addEventListener('click', function(e){ e.stopPropagation(); ensureAudio(); toggleMute(); });
  btnPause.addEventListener('click', function(e){ e.stopPropagation(); togglePause(); });
  btnLeaderboard.addEventListener('click', function(e){
    e.stopPropagation();
    showLeaderboard = true;
    showSettings = false;
    showMissions = false;
    showCostume = false;
    leaderboardTab = 'local';
    globalLoadState = 'idle'; // re-fetch fresh standings each time the board is opened
    syncUiButtons();
  });
  btnSettings.addEventListener('click', function(e){
    e.stopPropagation();
    showSettings = true;
    showLeaderboard = false;
    showMissions = false;
    showCostume = false;
    syncUiButtons();
  });
  btnMissions.addEventListener('click', function(e){
    e.stopPropagation();
    showMissions = true;
    showLeaderboard = false;
    showSettings = false;
    showCostume = false;
    missionsTab = 'missions';
    syncUiButtons();
  });
  btnMissionTab.addEventListener('click', function(e){ e.stopPropagation(); missionsTab='missions'; syncUiButtons(); });
  btnAchTab.addEventListener('click', function(e){ e.stopPropagation(); missionsTab='achievements'; syncUiButtons(); });
  btnCostume.addEventListener('click', function(e){
    e.stopPropagation();
    showCostume = true;
    showLeaderboard = false;
    showSettings = false;
    showMissions = false;
    syncUiButtons();
  });
  btnCostumePrev.addEventListener('click', function(e){ e.stopPropagation(); cycleCostume(-1); });
  btnCostumeNext.addEventListener('click', function(e){ e.stopPropagation(); cycleCostume(1); });
  btnLang.addEventListener('click', function(e){ e.stopPropagation(); setLang(lang==='ko' ? 'en' : 'ko'); });
  btnVibCycle.addEventListener('click', function(e){ e.stopPropagation(); cycleVibrationLevel(); });
  btnColorblind.addEventListener('click', function(e){ e.stopPropagation(); toggleColorblindMode(); });
  btnLbClose.addEventListener('click', function(e){
    e.stopPropagation();
    showLeaderboard = false;
    syncUiButtons();
  });
  btnLbLocal.addEventListener('click', function(e){
    e.stopPropagation();
    leaderboardTab = 'local';
    syncUiButtons();
  });
  btnLbGlobal.addEventListener('click', function(e){
    e.stopPropagation();
    ensureNickname();
    leaderboardTab = 'global';
    loadGlobalLeaderboardIfNeeded();
    syncUiButtons();
  });
  btnLbStats.addEventListener('click', function(e){
    e.stopPropagation();
    leaderboardTab = 'stats';
    syncUiButtons();
  });
  btnNickname.addEventListener('click', function(e){ e.stopPropagation(); changeNickname(); });
  btnAdUnlock.addEventListener('click', function(e){ e.stopPropagation(); startAdUnlockFlow(); });
  btnSkinPrev.addEventListener('click', function(e){ e.stopPropagation(); cycleSkin(-1); });
  btnSkinNext.addEventListener('click', function(e){ e.stopPropagation(); cycleSkin(1); });
  btnShare.addEventListener('click', function(e){
    e.stopPropagation();
    shareChallenge(state==='gameover' ? height : sessionBest);
  });

  // ---------- test hooks (used by tests/smoke.spec.js for deterministic, RNG-free testing) ----------
  // Harmless for real players: only lets someone with devtools open inspect or force local state
  // (nothing persists beyond their own session, nothing touches other players or the leaderboard
  // any differently than normal play already can via the console). Exists so automated regression
  // tests can reliably reach states that depend on randomness (obstacle spawns, RNG-picked types)
  // or long play sessions (30-combo escalation) without waiting on chance.
  window.__ttsTest = {
    getState: function(){
      return {
        state, charState, height, combo, comboBest, hp, hpMax, landings, lang,
        sessionBest, showLeaderboard, showMissions, showCostume, showSettings,
        adUnlockActive, streakCount, earnedAchievements: Array.from(earnedAchievements),
        helmetLevel, starInvincibleWallsLeft
      };
    },
    setHeight: function(h){ height = h; sessionBest = Math.max(sessionBest, h); },
    setCombo: function(c){ combo = c; comboBest = Math.max(comboBest, c); comboMultiplier = comboMultiplierFor(c); },
    setLang: function(l){ setLang(l); },
    jump: function(){ tryJump(); },
    isAirborne: function(){ return charState==='jump1' || charState==='jump2' || charState==='freefall'; },
    setHelmetLevel: function(n){ helmetLevel = n; },
    grantStarInvincibility: function(){ starInvincibleWallsLeft = STAR_INVINCIBLE_TOUCHES; },
    // spawns a real obstacle at the character's current position - requires the character to
    // already be airborne (isAirborne()) for the normal collision loop to pick it up next frame
    forceObstacle: function(type){
      const r = obstacleRadius(type);
      obstacles.push({
        type, x:charX, baseX:charX, y:charY, r, vy:0, age:0,
        amp:r*1.7, freq:2, phase:0, rot:0, spin:1,
        variant: type==='friend' ? pickFriendVariant() : 0,
        zone: currentZoneIdx()
      });
      if(type==='friend') obstacleUnlocked.friend = true;
    },
    ensureAudio: function(){ ensureAudio(); },
    getVoiceBufferDuration: function(id){ return voiceClipBuffers[id] ? voiceClipBuffers[id].duration : null; }
  };

  // ---------- init ----------
  document.title = tr('gameTitle');
  applyAdSlideLang();
  resize();
  resetGame();
  syncUiButtons();
  requestAnimationFrame(loop);
  setTimeout(checkReferralRewards, 2000); // give the Firebase module a moment to init first
})();
</script>
</body>
</html>
